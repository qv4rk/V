version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gasapi-postgres
    environment:
      POSTGRES_USER: gasapi
      POSTGRES_PASSWORD: gasapi_secure_password
      POSTGRES_DB: gasapi
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gasapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gasapi-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gsapi.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - admin

volumes:
  postgres_data:
