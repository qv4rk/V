name: Build & Deploy

on:
  push:
    branches: [main]

# Only one build may write generated files back to main at a time.
# A newer push cancels an older run before both can race at git push.
concurrency:
  group: build-deploy-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run build script
        run: python build.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json articles/ sitemap.xml
          git add nodes/tags/ 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing to commit" || \
            git commit -m "auto: regenerate articles and events [skip ci]"

      - name: Push generated files safely
        run: |
          # Another commit may have landed while this build was running.
          # Rebase the generated-files commit onto the latest main, then push.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
