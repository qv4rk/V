<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space · FeistTech</title>
<meta name="description" content="Follow ʻOumuamua, satellites and the hypothetical Planet Nine, and watch any eclipse of the last 5,000 years from the side.">
<link rel="stylesheet" href="/vendor/google-fonts/fonts.css">
<style>
  :root {
    --panel: rgba(10, 12, 18, .9); --line: #262a35; --text: #e4e2dc; --muted: #8d9099;
    --gold: #c9a84c; --cyan: #6fc3d8; --red: #e0664f;
    --mono: "Space Mono", ui-monospace, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --serif: "Cormorant Garamond", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #020308; color: var(--text); font-family: var(--sans); }
  canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; transform: translate(8px, -50%); font: 10px var(--mono); letter-spacing: .06em; white-space: nowrap; color: var(--muted); text-shadow: 0 0 4px #000; }
  .lbl.hi { color: var(--gold); font-size: 11px; }
  .lbl.spec { color: var(--red); }

  .tabs {
    position: fixed; top: 34px; left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px;
    max-width: calc(100vw - 24px); overflow-x: auto;
  }
  .tabs button { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 6px 11px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: #ffffff12; color: var(--gold); }

  .panel {
    position: fixed; z-index: 5; left: 12px; top: 84px; width: 330px; max-height: calc(100vh - 170px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 13px; line-height: 1.55;
  }
  .panel h1 { font: 400 22px/1.2 var(--serif); margin: 0 0 6px; }
  .panel h2 { font: 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: 16px 0 6px; font-weight: 400; }
  .panel p { margin: 0 0 8px; color: #c9c7c0; }
  .panel .muted { color: var(--muted); font-size: 12px; }
  .readout { font: 11px/1.7 var(--mono); color: var(--text); }
  .readout b { color: var(--gold); font-weight: 400; }
  .tag { display: inline-block; font: 9px var(--mono); letter-spacing: .1em; padding: 2px 6px; border-radius: 3px; margin-right: 4px; }
  .tag.known { background: #6fc3d822; color: var(--cyan); }
  .tag.spec { background: #e0664f22; color: var(--red); }
  label.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); margin: 8px 0; }
  label.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--red); }
  label.row output { font: 11px var(--mono); color: var(--text); }
  select, .btn { background: #0b0d12; color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; padding: 6px 8px; }
  .btn { cursor: pointer; }
  .btn:hover { border-color: var(--gold); }
  a { color: var(--gold); }

  .timebar {
    position: fixed; z-index: 5; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(720px, calc(100vw - 24px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .timebar .date { font: 13px var(--mono); color: var(--gold); min-width: 190px; }
  .timebar .speeds { display: flex; gap: 4px; flex-wrap: wrap; }
  .timebar .speeds .btn.on { border-color: var(--gold); color: var(--gold); }
  .timebar input[type=range] { flex: 1; min-width: 160px; accent-color: var(--gold); }

  @media (max-width: 700px) {
    .panel { top: auto; bottom: 110px; left: 8px; right: 8px; width: auto; max-height: 34vh; }
    .panel.collapsed .body { display: none; }
    .tabs { top: 30px; }
  }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js" } }</script>
<script src="/vendor/astronomy-engine/astronomy-engine.min.js"></script>

<body>
<nav class="tabs" id="tabs" aria-label="Views">
  <button data-view="system">Solar system</button>
  <button data-view="oumuamua">ʻOumuamua</button>
  <button data-view="nine">Planet Nine</button>
  <button data-view="eclipse">Eclipse side view</button>
  <button data-view="satellites">Satellites</button>
</nav>
<aside class="panel" id="panel"></aside>
<div id="labels"></div>
<div class="timebar" id="timebar">
  <span class="date" id="date">—</span>
  <button class="btn" id="play" aria-label="Play or pause">⏸</button>
  <div class="speeds" id="speeds"></div>
  <input type="range" id="scrub" hidden>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '/vendor/three/OrbitControls.js';
import { makeCosmos } from './cosmos.js';
import { makePlanet, loadLandMask } from './planets.js';
import { attachGestures } from './gestures.js';

const A = window.Astronomy;
const DEG = Math.PI / 180;
const AU_KM = 149597870.7, RE_KM = 6371, AU_RE = AU_KM / RE_KM;
const RM_RE = 1737.4 / RE_KM, RS_RE = 696000 / RE_KM;

// ── Renderer, camera, controls ──
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1e7);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const gestures = attachGestures(controls, () => camera, renderer.domElement, () => { focus = null; fly = null; });
// Let momentum from the previous page die out before zoom responds here
if (window.FTPortal && FTPortal.arrived) {
  controls.enableZoom = false;
  const wake = () => FTPortal.ready() ? (controls.enableZoom = true) : setTimeout(wake, 150);
  addEventListener('load', () => setTimeout(wake, 150));
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

let scene = new THREE.Scene();
const labelsEl = document.getElementById('labels');
let labels = [];
function label(text, obj, cls) {
  const el = document.createElement('div');
  el.className = 'lbl ' + (cls || '');
  el.textContent = text;
  labelsEl.appendChild(el);
  const l = { el, obj };
  labels.push(l);
  return l;
}
const _v = new THREE.Vector3();
function drawLabels() {
  for (const l of labels) {
    l.obj.getWorldPosition(_v);
    _v.project(camera);
    const vis = _v.z < 1 && Math.abs(_v.x) < 1.1 && Math.abs(_v.y) < 1.1 && l.obj.visible !== false;
    l.el.style.display = vis ? '' : 'none';
    if (vis) {
      l.el.style.left = ((_v.x + 1) / 2 * innerWidth) + 'px';
      l.el.style.top = ((1 - _v.y) / 2 * innerHeight) + 'px';
    }
  }
}

// ── Coordinates ──
// Astronomy Engine gives J2000 vectors with z toward the north pole of the
// frame; three.js is y-up, so (x, y, z) -> (x, z, -y).
const T3 = v => new THREE.Vector3(v.x, v.z, -v.y);
const ECL = A.Rotation_EQJ_ECL();
const toEcl = v => A.RotateVector(ECL, v);
// Solar-system distances are compressed so Mercury (0.4 AU) and a
// Planet Nine at hundreds of AU fit on one screen.
const squash = r => 10 * Math.log2(1 + r / 0.4);
function sysPos(v) {
  const r = Math.hypot(v.x, v.y, v.z) || 1e-9;
  const k = squash(r) / r;
  return T3({ x: v.x * k, y: v.y * k, z: v.z * k });
}

// Keplerian orbit (ecliptic J2000) -> position in AU for anomaly
function orbitPoint(el, E) {
  let x, y;
  if (el.e < 1) {
    x = el.a * (Math.cos(E) - el.e);
    y = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
  } else { // hyperbola: E is the hyperbolic anomaly H
    x = el.a * (Math.cosh(E) - el.e);   // a < 0
    y = -el.a * Math.sqrt(el.e * el.e - 1) * Math.sinh(E);
  }
  const cw = Math.cos(el.w * DEG), sw = Math.sin(el.w * DEG);
  const cO = Math.cos(el.O * DEG), sO = Math.sin(el.O * DEG);
  const ci = Math.cos(el.i * DEG), si = Math.sin(el.i * DEG);
  const xp = x * cw - y * sw, yp = x * sw + y * cw;
  return { x: xp * cO - yp * ci * sO, y: xp * sO + yp * ci * cO, z: yp * si };
}

// ʻOumuamua (1I/2017 U1), JPL Small-Body Database heliocentric elements
const OUMUAMUA = { q: 0.2559115812, e: 1.201133796, i: 122.7417062, O: 24.59690691, w: 241.8105360, tp: 2458006.007 };
OUMUAMUA.a = OUMUAMUA.q / (1 - OUMUAMUA.e);
function oumuamuaAt(date) {
  const jd = date.getTime() / 864e5 + 2440587.5;
  const n = 0.01720209895 / Math.sqrt(-OUMUAMUA.a * OUMUAMUA.a * OUMUAMUA.a);
  const M = n * (jd - OUMUAMUA.tp);
  let H = Math.asinh(M / OUMUAMUA.e);
  for (let k = 0; k < 30; k++) H -= (OUMUAMUA.e * Math.sinh(H) - H - M) / (OUMUAMUA.e * Math.cosh(H) - 1);
  const p = orbitPoint(OUMUAMUA, H);
  // speed from vis-viva, km/s
  const r = Math.hypot(p.x, p.y, p.z);
  const v = Math.sqrt(0.0002959122 * (2 / r - 1 / OUMUAMUA.a)) * AU_KM / 86400;
  return { p, r, v };
}

// Planet Nine: published estimate (Brown & Batygin 2021) and the hypothesis
const NINE_PUBLISHED = { a: 380, e: 0.2, i: 16, O: 97, w: 150 };
const hypo = { tilt: 50, period: 12000, e: 0.35, O: 97, phase: 180 };

// ── Shared state ──
const params = new URLSearchParams(location.search);
let view = params.get('view') || 'system';
let date = (window.FTPortal && FTPortal.time()) || new Date();
let playing = true;
let speed = 1; // days per second (views override)
const dateEl = document.getElementById('date');
const panel = document.getElementById('panel');
let update = () => {};

function fmtDate(d, withTime) {
  const y = d.getUTCFullYear();
  const ys = y <= 0 ? (1 - y) + ' BCE' : String(y);
  const md = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  return md + ', ' + ys + (withTime ? ' · ' + d.toISOString().slice(11, 16) + ' UT' : '');
}

function setSpeeds(list, def) {
  const box = document.getElementById('speeds');
  box.innerHTML = '';
  list.forEach(([name, s]) => {
    const b = document.createElement('button');
    b.className = 'btn' + (s === def ? ' on' : '');
    b.textContent = name;
    b.onclick = () => { speed = s; [...box.children].forEach(c => c.classList.toggle('on', c === b)); };
    box.appendChild(b);
  });
  speed = def;
}
document.getElementById('play').onclick = () => {
  playing = !playing;
  document.getElementById('play').textContent = playing ? '⏸' : '▶';
};

function reset() {
  scene = new THREE.Scene();
  labels.forEach(l => l.el.remove());
  labels = [];
  document.getElementById('scrub').hidden = true;
  controls.minDistance = 0.01;
  controls.maxDistance = 1e6;
}

function starfield(radius) {
  const g = new THREE.BufferGeometry(), pts = [];
  for (let k = 0; k < 3000; k++) {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    pts.push(radius * s * Math.cos(t), radius * u, radius * s * Math.sin(t));
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8890a0, size: 1.2, sizeAttenuation: false }));
}
function line(points, color, opacity, dashed) {
  const g = new THREE.BufferGeometry().setFromPoints(points);
  const m = dashed
    ? new THREE.LineDashedMaterial({ color, transparent: true, opacity, dashSize: 1.2, gapSize: 0.8 })
    : new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  const l = new THREE.Line(g, m);
  if (dashed) l.computeLineDistances();
  return l;
}
function dot(size, color) {
  return new THREE.Mesh(new THREE.SphereGeometry(size, 24, 16), new THREE.MeshBasicMaterial({ color }));
}

// ════════════ Solar system (also the base for ʻOumuamua and Planet Nine) ════════════
// ── The real sky, shared by every view: one copy, following the camera ──
const cosmosReady = makeCosmos(5e5);
let cosmos = null, skyCulture = 'western';
try { skyCulture = localStorage.getItem('ma-sky-culture') || 'western'; } catch (e) {}
// The backdrop is built in the ecliptic frame; the Earth views (eclipse,
// satellites) use Earth's equator, so tilt it by the obliquity there.
function addCosmos(equatorial) {
  const target = scene;
  cosmosReady.then(c => {
    cosmos = c;
    c.setCulture(skyCulture);
    c.group.rotation.x = equatorial ? 23.4392911 * DEG : 0;
    target.add(c.group);
  });
}
const landMaskReady = loadLandMask(window.topojson).catch(() => null);

// Earth's true orientation (precession, nutation, sidereal time) as a rotation
// from its own frame (three.js sphere: +X Greenwich, +Y north) to the scene.
// eclFrame: true for the solar-system views (ecliptic), false for Earth views.
function earthQuat(t, eclFrame) {
  const gast = A.SiderealTime(t) * 15 * DEG, R = A.Rotation_EQD_EQJ(t);
  const img = (x, y, z) => {
    const v = A.RotateVector(R, new A.Vector(x * Math.cos(gast) - y * Math.sin(gast), x * Math.sin(gast) + y * Math.cos(gast), z, t));
    return T3(eclFrame ? toEcl(v) : v);
  };
  const ex = img(1, 0, 0), ey = img(0, 1, 0), ez = img(0, 0, 1);
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(ex, ez, ey.negate()));
}
const geoToLocal = (lat, lon) => new THREE.Vector3(
  Math.cos(lat * DEG) * Math.cos(lon * DEG), Math.sin(lat * DEG), -Math.cos(lat * DEG) * Math.sin(lon * DEG));
function localToGeo(v) {
  return { lat: Math.asin(Math.max(-1, Math.min(1, v.y))) / DEG, lon: Math.atan2(-v.z, v.x) / DEG };
}

const PLANETS = [
  ['Mercury', 'Mercury', 87.97, 0xb0b0b8, 0.35], ['Venus', 'Venus', 224.7, 0xe8d090, 0.55],
  ['Earth', 'Earth', 365.26, 0x5aa7e0, 0.6], ['Mars', 'Mars', 686.98, 0xe05840, 0.45],
  ['Jupiter', 'Jupiter', 4332.6, 0xd4956a, 1.2], ['Saturn', 'Saturn', 10759, 0xe8d870, 1.05],
  ['Uranus', 'Uranus', 30687, 0x9fe0e8, 0.8], ['Neptune', 'Neptune', 60190, 0x5a7ee8, 0.8],
  ['Pluto', 'Pluto', 90560, 0xc8b8a8, 0.3],
];

function buildSystem(opts) {
  reset();
  addCosmos();
  const sun = dot(2.2, 0xfff1c0);
  scene.add(sun);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: 0xffc860,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.scale.set(16, 16, 1);
  scene.add(glow);
  label('SUN', sun, 'hi');
  scene.add(new THREE.PointLight(0xfff4e0, 2.2, 0, 0));
  scene.add(new THREE.AmbientLight(0x404a60, 0.35));

  const bodies = PLANETS.map(([name, body, period, color, size]) => {
    const pts = [];
    const t0 = A.MakeTime(date);
    for (let k = 0; k <= 180; k++) pts.push(sysPos(toEcl(A.HelioVector(A.Body[body], t0.AddDays(period * k / 180)))));
    scene.add(line(pts, color, 0.28));
    const entry = { name, body, size, m: new THREE.Group() };
    scene.add(entry.m);
    const build = land => {
      const p = makePlanet(name, size, name.length * 7, name === 'Earth' ? land : undefined);
      entry.m.add(p.group);
      entry.p = p;
    };
    name === 'Earth' ? landMaskReady.then(build) : build();
    label(name.toUpperCase(), entry.m);
    return entry;
  });
  planetsForPick = bodies;

  // Distance rings for scale
  [1, 10, 100, 1000].forEach(r => {
    const pts = [];
    for (let k = 0; k <= 128; k++) pts.push(sysPos({ x: r * Math.cos(k / 64 * Math.PI), y: r * Math.sin(k / 64 * Math.PI), z: 0 }));
    scene.add(line(pts, 0x444a58, 0.35, true));
    const anchor = new THREE.Object3D();
    anchor.position.copy(sysPos({ x: r, y: 0, z: 0 }));
    scene.add(anchor);
    label(r + ' AU', anchor);
  });

  // ʻOumuamua path 1990-2060
  const oPts = [];
  for (let H = -3.5; H <= 3.5; H += 0.01) oPts.push(sysPos(orbitPoint(OUMUAMUA, H)));
  scene.add(line(oPts, 0x6fc3d8, opts.oumuamua ? 0.9 : 0.4));
  const oum = dot(0.4, 0x6fc3d8);
  scene.add(oum);
  label('ʻOUMUAMUA', oum, opts.oumuamua ? 'hi' : '');

  // Planet Nine: published and hypothesis
  const nineGroup = new THREE.Group();
  scene.add(nineGroup);
  const drawNine = () => {
    nineGroup.clear();
    labels.filter(l => l.nine).forEach(l => l.el.remove());
    labels = labels.filter(l => !l.nine);
    const ell = (el, color, op) => {
      const pts = [];
      for (let k = 0; k <= 256; k++) pts.push(sysPos(orbitPoint(el, k / 128 * Math.PI)));
      nineGroup.add(line(pts, color, op));
    };
    ell(NINE_PUBLISHED, 0x9aa4b8, 0.55);
    const pubAnchor = new THREE.Object3D();
    pubAnchor.position.copy(sysPos(orbitPoint(NINE_PUBLISHED, Math.PI)));
    nineGroup.add(pubAnchor);
    label('PLANET NINE · PUBLISHED ESTIMATE', pubAnchor).nine = true;

    const a = Math.pow(hypo.period, 2 / 3);
    const h = { a, e: hypo.e, i: hypo.tilt, O: hypo.O, w: 150 };
    ell(h, 0xe0664f, 0.9);
    const p = dot(1.1, 0xe0664f);
    p.position.copy(sysPos(orbitPoint(h, hypo.phase * DEG)));
    nineGroup.add(p);
    label('PLANET NINE · HYPOTHESIS', p, 'spec').nine = true;
    // where it crosses the planets' plane (ascending / descending nodes)
    [0, 180].forEach(nu => {
      const n = dot(0.6, 0xe0664f);
      // node points: argument of latitude 0 and 180
      const E = 2 * Math.atan(Math.sqrt((1 - h.e) / (1 + h.e)) * Math.tan(((nu - h.w) * DEG) / 2));
      n.position.copy(sysPos(orbitPoint(h, E)));
      nineGroup.add(n);
    });
    return h;
  };
  let hypoOrbit = drawNine();

  camera.position.copy(opts.cam);
  controls.target.set(0, 0, 0);
  focus = null;

  update = () => {
    const t = A.MakeTime(date);
    bodies.forEach(b => {
      b.m.position.copy(sysPos(toEcl(A.HelioVector(A.Body[b.body], t))));
      if (b.p) {
        b.p.update(date, b.m.position.clone().negate().normalize());
        if (b.name === 'Earth') { b.p.tilt.quaternion.copy(earthQuat(t, true)); b.p.spin.rotation.y = 0; }
      }
    });
    const o = oumuamuaAt(date);
    oum.position.copy(sysPos(o.p));
    followFocus();
    if (opts.onUpdate) opts.onUpdate({ o, t });
  };
  return { redrawNine: () => { hypoOrbit = drawNine(); return hypoOrbit; } };
}

function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d'), grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.2, 'rgba(255,220,150,.6)');
  grad.addColorStop(1, 'rgba(255,160,60,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

// ── Focus: tap a planet to fly to it and ride along ──
let planetsForPick = [], focus = null, fly = null, lastEarthDist = Infinity;
function setFocus(entry) {
  focus = entry;
  if (!entry) return;
  const dist = entry.size * 7;
  fly = { t0: performance.now(), from: controls.target.clone(), cam: camera.position.clone(), dist };
  lastEarthDist = Infinity;
  if (speed > 1) document.querySelector('#speeds .btn')?.click();   // slow to 1 hour/s
}
function followFocus() {
  if (!focus) return;
  const p = focus.m.position;
  if (fly) {
    const u = Math.min(1, (performance.now() - fly.t0) / 1400), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const dir = fly.cam.clone().sub(p).normalize();
    controls.target.lerpVectors(fly.from, p, e);
    camera.position.lerpVectors(fly.cam, p.clone().addScaledVector(dir, fly.dist), e);
    if (u >= 1) fly = null;
    return;
  }
  const delta = p.clone().sub(controls.target);
  controls.target.add(delta);
  camera.position.add(delta);
  if (focus.name === 'Earth' && focus.p) earthPortal();
}
// Zooming close enough to Earth hands over to the Globe & sky page: same
// moment, same side of Earth facing you, same apparent size.
function earthPortal() {
  const e = focus.m.position, d = camera.position.distanceTo(e);
  const frac = focus.size / (d * Math.tan(camera.fov * DEG / 2));
  const closing = d < lastEarthDist - 1e-4;
  lastEarthDist = d;
  if (frac < 0.62 || !closing || !window.FTPortal) return;
  const local = camera.position.clone().sub(e).normalize().applyQuaternion(focus.p.tilt.quaternion.clone().invert());
  const g = localToGeo(local);

let landLines = null;
async function loadLand() {
  if (landLines) return landLines;
  const topo = await fetch('/vendor/world-atlas/land-110m.json').then(r => r.json());
  const land = topojson.feature(topo, topo.objects.land);
  const pts = [];
  const push = ring => {
    for (let k = 1; k < ring.length; k++) {
      [ring[k - 1], ring[k]].forEach(([lon, lat]) => {
        const c = Math.cos(lat * DEG);
        pts.push(1.002 * c * Math.cos(lon * DEG), 1.002 * c * Math.sin(lon * DEG), 1.002 * Math.sin(lat * DEG));
      });
    }
  };
  land.features.forEach(f => {
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    polys.forEach(p => p.forEach(push));
  });
  landLines = pts;
  return pts;
}

// Earth built in Earth-fixed coordinates, then turned to its true
// orientation (precession + nutation + sidereal time) for the moment.
function makeEarth() {
  const g = new THREE.Group();
  g.matrixAutoUpdate = false;
  g.add(new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48),
    new THREE.MeshStandardMaterial({ color: 0x1b3a5c, roughness: 0.9 })));
  loadLand().then(pts => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    g.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0xc9a84c, transparent: true, opacity: 0.8 })));
  });
  return g;
}
function orientEarth(g, t) {
  const gast = A.SiderealTime(t) * 15 * DEG;
  const R = A.Rotation_EQD_EQJ(t);
  const fixedToEqj = v => {
    const eqd = { x: v.x * Math.cos(gast) - v.y * Math.sin(gast), y: v.x * Math.sin(gast) + v.y * Math.cos(gast), z: v.z, t };
    return T3(A.RotateVector(R, new A.Vector(eqd.x, eqd.y, eqd.z, t)));
  };
  const ex = fixedToEqj({ x: 1, y: 0, z: 0 }), ey = fixedToEqj({ x: 0, y: 1, z: 0 }), ez = fixedToEqj({ x: 0, y: 0, z: 1 });
  g.matrix.makeBasis(ex, ey, ez);
}

    mesh.geometry = new THREE.CylinderGeometry(Math.max(r1, 0.0001), r0, len, 64, 1, true);
    mesh.geometry.translate(0, len / 2, 0);

  let current = null, offsetMin = 0;

  scrub.oninput = () => { offsetMin = +scrub.value; playing = false; document.getElementById('play').textContent = '▶'; };

    <p class="muted">Black cone: the Moon's full shadow (totality). Blue: its partial shadow. Red: Earth's shadow, which the Moon crosses in a lunar eclipse. The red dot marks where the Moon's shadow axis meets Earth.</p>

    <p><button class="btn" id="close">Close up</button> <button class="btn" id="side">Whole alignment</button></p>
    <div class="readout" id="ro"></div>

  function placeCamera(wide) {

    const up = new THREE.Vector3(0, 1, 0);
    const side = new THREE.Vector3().crossVectors(sunDir, up).normalize();
    const lunar = current && current.type === 'L';
    const focus = wide ? moonPos.clone().multiplyScalar(0.5) : lunar ? moonPos.clone() : new THREE.Vector3();
    const dist = wide ? 80 : lunar ? 4 : 6;
    controls.target.copy(focus);
    camera.position.copy(focus).addScaledVector(side, dist).addScaledVector(up, dist * 0.25)
      .addScaledVector(sunDir, lunar || wide ? 0 : dist * 0.35);
  }

  function compute() {
    if (!current) return;
    const d = new Date(current.t.getTime() + offsetMin * 60000);
    date = d;
    const t = A.MakeTime(d);
    const s = A.GeoVector(A.Body.Sun, t, true), m = A.GeoMoon(t);
    const sunP = T3(s).multiplyScalar(AU_RE);
    moonPos = T3(m).multiplyScalar(AU_RE);

    sun.position.copy(sunP);
    moon.position.copy(moonPos);
    sunLight.position.copy(sunDir).multiplyScalar(500);
    orientEarth(earth, t);
    sunArrow.position.copy(sunDir).multiplyScalar(40);

    // Moon's shadow (away from the Sun)
    const toSun = sunP.clone().sub(moonPos), dsm = toSun.length(), away = toSun.clone().normalize().negate();
    const umbraLen = dsm * RM_RE / (RS_RE - RM_RE);
    shadow(moonUmbra, moonPos, away, RM_RE, 0, umbraLen);
    shadow(moonPen, moonPos, away, RM_RE, RM_RE + 75 * (RS_RE + RM_RE) / dsm, 75);
    // Earth's shadow
    const dse = sunP.length(), awayE = sunDir.clone().negate();
    shadow(earthUmbra, new THREE.Vector3(), awayE, 1, 0, dse / (RS_RE - 1));

    const lunar = current.type === 'L';
    moonUmbra.visible = moonPen.visible = !lunar;
    earthUmbra.visible = earthPen.visible = lunar;
    // Inside Earth's shadow the Moon goes coppery red (sunlight bent
    // through Earth's atmosphere is all that reaches it)
    const along = moonPos.dot(awayE);
    const off = moonPos.clone().addScaledVector(awayE, -along).length();
    const umbraR = 1 - along * (RS_RE - 1) / dse, penR = 1 + along * (RS_RE + 1) / dse;
    const depth = along > 0 ? Math.max(0, Math.min(1, (penR - off) / (penR - umbraR + RM_RE))) : 0;

    moon.material.emissive.setRGB(0.28 * depth * depth, 0.06 * depth * depth, 0.02 * depth * depth);

    // Where the Moon's shadow axis meets Earth (if it does)
    const oc = moonPos.clone(), b = oc.dot(away), c = oc.lengthSq() - 1, disc = b * b - c;
    hit.visible = disc > 0 && b < 0;
    if (hit.visible) hit.position.copy(moonPos).addScaledVector(away, -b - Math.sqrt(disc));

    const sep = Math.acos(Math.max(-1, Math.min(1, sunP.clone().normalize().dot(moonPos.clone().normalize())))) / DEG;
    document.getElementById('ro').innerHTML =
      `<b>${current.kind.toUpperCase()} ${current.type === 'S' ? 'SOLAR' : 'LUNAR'} ECLIPSE</b><br>` +
      `Greatest eclipse ${fmtDate(current.t, true)}<br>` +
      `Showing ${offsetMin >= 0 ? '+' : '−'}${Math.abs(Math.round(offsetMin))} min from peak<br>` +
      `Moon–Sun angle from Earth's centre <b>${(current.type === 'S' ? sep : 180 - sep).toFixed(2)}°</b>` +
      (current.lat != null ? `<br>Shadow centre at peak <b>${current.lat.toFixed(1)}°, ${current.lon.toFixed(1)}°</b>` : '');
  }

  choose(idx);

    if (playing) {
      offsetMin += dtDays * 1440;
      if (offsetMin > 240) offsetMin = -240;
      scrub.value = offsetMin;
    }
    compute();
  };
  update.fixedTime = true;
};

    <h1>Satellites</h1>
    <p>Crewed stations and the brightest satellites, placed from today's orbital elements published by CelesTrak (from US Space Force tracking). Earth is turned to its real orientation, lit by the real Sun.</p>
    <p><select id="grp"><option value="stations">Space stations</option><option value="visual">100 brightest</option><option value="gps-ops">GPS</option><option value="weather">Weather</option></select></p>
    <div class="readout" id="ro">Loading…</div>`;

  const group = new THREE.Group();
  scene.add(group);
  let sats = [];
  async function load(g) {
    group.clear();
    labels.forEach(l => l.el.remove()); labels = [];
    document.getElementById('ro').textContent = 'Loading…';
    try {
      const txt = await fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=' + g + '&FORMAT=tle').then(r => r.text());
      const lines = txt.trim().split(/\r?\n/);
      sats = [];
      for (let k = 0; k + 2 < lines.length; k += 3) {
        const satrec = satellite.twoline2satrec(lines[k + 1], lines[k + 2]);
        const m = dot(g === 'stations' ? 0.018 : 0.012, g === 'stations' ? 0xc9a84c : 0x6fc3d8);
        group.add(m);
        const s = { name: lines[k].trim(), satrec, m };
        if (sats.length < 12) label(s.name, m, /ISS|TIANGONG|CSS/.test(s.name) ? 'hi' : '');
        sats.push(s);
      }
      // ISS / first object's orbit track
      if (sats[0]) {
        const pts = [];
        for (let mnt = 0; mnt <= 95; mnt += 1) {
          const p = satellite.propagate(sats[0].satrec, new Date(date.getTime() + mnt * 60000)).position;
          if (p) pts.push(eci(p, new Date(date.getTime() + mnt * 60000)));
        }
        group.add(line(pts, 0xc9a84c, 0.5));
      }
      document.getElementById('ro').innerHTML = `<b>${sats.length}</b> objects · source CelesTrak`;
    } catch (e) {
      document.getElementById('ro').textContent = 'Could not reach CelesTrak right now.';
    }
  }
  // satellite.js positions are in km, in Earth's equator-of-date frame
  function eci(p, d) {
    const t = A.MakeTime(d);
    return T3(A.RotateVector(A.Rotation_EQD_EQJ(t), new A.Vector(p.x / RE_KM, p.y / RE_KM, p.z / RE_KM, t)));
  }
  document.getElementById('grp').onchange = e => load(e.target.value);
  load('stations');

  update = () => {
    const t = A.MakeTime(date);
    orientEarth(earth, t);
    sunLight.position.copy(T3(A.GeoVector(A.Body.Sun, t, true)).normalize().multiplyScalar(50));
    for (const s of sats) {
      const pv = satellite.propagate(s.satrec, date);
      s.m.visible = !!(pv && pv.position);
      if (s.m.visible) s.m.position.copy(eci(pv.position, date));
    }
  };
};

// ── View switching and main loop ──
const tabs = document.getElementById('tabs');
function show(v) {
  if (!VIEWS[v]) v = 'system';
  view = v;
  [...tabs.children].forEach(b => b.classList.toggle('on', b.dataset.view === v));
  const u = new URL(location.href);
  u.searchParams.set('view', v);
  if (v !== 'eclipse') u.searchParams.delete('date');
  if (v !== 'nine') ['tilt', 'period', 'e', 'phase'].forEach(k => u.searchParams.delete(k));
  history.replaceState(null, '', u);
  update = () => {};
  VIEWS[v]();
}
tabs.onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.view); };

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const days = playing ? dt * speed : 0;
  if (update.fixedTime) update(days);
  else {
    date = new Date(date.getTime() + days * 864e5);
    update(days);
  }
  dateEl.textContent = fmtDate(date, view === 'eclipse' || view === 'satellites');
  controls.update();
  if (cosmos) cosmos.group.position.copy(camera.position);
  renderer.render(scene, camera);
  drawLabels();
  requestAnimationFrame(frame);
}
show(view);
requestAnimationFrame(frame);
</script>
</body>
</html>
