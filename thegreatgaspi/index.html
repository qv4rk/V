<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Great GASPI</title>
<meta name="description" content="Global Asymmetric Sovereignty & Power Index — an interactive geospatial platform mapping topographic, hydropolitical, infrastructural, and legal asymmetry across contested territories.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23050810'/%3E%3Ccircle cx='50' cy='50' r='36' fill='none' stroke='%23c9a84c' stroke-width='2'/%3E%3Cpath d='M50 18 L50 82 M18 50 L82 50' stroke='%2300e5ff' stroke-width='1' opacity='.5'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%23c9a84c'/%3E%3C/svg%3E">
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<style>
/* ============ DESIGN TOKENS ============
   Ops-console / geospatial-intelligence identity, deliberately continuing
   feisttech.com's existing archive aesthetic (deep near-black ground,
   gold for sovereignty/control data, cyan for infrastructure/telemetry)
   rather than introducing a disconnected visual language. Committed
   single dark theme — this is a satellite/telemetry instrument, not a
   document that should invert to a light reading mode.
   Type: a serif display face for the wordmark/territory name (dossier,
   engraved-document feel), monospace for every coordinate/metric/label
   (tabular data reads as data), a body serif for citation prose. */
:root{
  --bg:#050810; --bg-panel:#0b101c; --bg-tile:#10182a;
  --line:#1c2740; --line-soft:#141d30;
  --gold:#c9a84c; --gold-hi:#e6c877;
  --cyan:#3ad9f2;
  --water:#5b9fd6;
  --warn:#dd9a4d;
  --restrict:#c96650;
  --ink:#eef1f6; --ink-dim:#9aa7bf; --ink-mute:#5d6b87;
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --font-body: Georgia, 'Palatino Linotype', 'Book Antiqua', serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', 'Liberation Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
.stage{ position:fixed; inset:0; display:grid; grid-template-columns:1fr min(380px,38vw); }
@media (max-width:760px){ .stage{ grid-template-columns:1fr; } }

/* ---- Globe canvas column ---- */
.globe-col{ position:relative; background:#050810; }
#map{ position:absolute; inset:0; width:100%; height:100%; }
/* CARTO's free dark-matter style requires attribution to remain visible — restyled to match the console aesthetic rather than hidden. */
.maplibregl-ctrl-attrib{ background:rgba(5,8,16,.55) !important; color:var(--ink-mute) !important; font-family:var(--font-mono) !important; font-size:.58rem !important; }
.maplibregl-ctrl-attrib a{ color:var(--ink-dim) !important; }
.maplibregl-ctrl-bottom-right{ z-index:4; }
.gaspi-marker{ width:13px; height:13px; border-radius:50%; border:1.5px solid rgba(5,8,16,.7); cursor:pointer; box-shadow:0 0 0 3px rgba(0,0,0,.15); }
.gaspi-popup .maplibregl-popup-content{
  background:rgba(8,12,22,.96); border:1px solid var(--gold); border-radius:3px; padding:10px 13px;
  font-family:var(--font-mono); font-size:.68rem; color:var(--ink); box-shadow:none;
}
.gaspi-popup .maplibregl-popup-tip{ border-top-color:var(--gold) !important; border-bottom-color:var(--gold) !important; }
.gaspi-popup .tt-title{ color:var(--gold-hi); font-size:.72rem; margin-bottom:3px; }

.topbar{
  position:absolute; top:0; left:0; right:0; z-index:5;
  display:flex; align-items:baseline; justify-content:space-between;
  padding:20px 24px; pointer-events:none;
}
.wordmark{ font-family:var(--font-display); font-size:1.05rem; letter-spacing:.14em; color:var(--gold-hi); }
.wordmark small{ display:block; font-family:var(--font-mono); font-size:.6rem; letter-spacing:.22em; color:var(--ink-mute); margin-top:3px; text-transform:uppercase; }
.hint{ font-family:var(--font-mono); font-size:.62rem; letter-spacing:.05em; color:var(--ink-mute); text-align:right; line-height:1.6; }

.legend{
  position:absolute; left:24px; bottom:22px; z-index:5;
  display:flex; flex-direction:column; gap:6px;
  font-family:var(--font-mono); font-size:.64rem; letter-spacing:.03em; color:var(--ink-dim);
  background:rgba(5,8,16,.55); backdrop-filter:blur(6px); padding:12px 14px; border:1px solid var(--line-soft); border-radius:3px;
}
.legend-row{ display:flex; align-items:center; gap:8px; }
.dot{ width:8px; height:8px; border-radius:50%; flex:none; }
.legend-note{
  display:block; margin-top:8px; padding-top:8px; border-top:1px solid var(--line-soft);
  font-family:var(--font-mono); font-size:.56rem; line-height:1.6; color:var(--ink-mute); max-width:220px;
}

.mobile-toggle{ display:none; position:absolute; top:20px; right:20px; z-index:6; }
@media (max-width:760px){ .mobile-toggle{ display:block; pointer-events:auto; } .topbar{padding-right:70px;} }
.mobile-toggle button{
  font-family:var(--font-mono); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase;
  background:rgba(11,16,28,.85); color:var(--gold-hi); border:1px solid var(--line); border-radius:3px;
  padding:8px 12px; pointer-events:auto;
}

/* ---- HUD / dossier column ---- */
.hud{
  background:var(--bg-panel); border-left:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
.hud-head{ padding:20px 20px 14px; border-bottom:1px solid var(--line); }
/* 16 territories no longer fit one row at flex:1 — wrap instead, sized
   to content, with a max-height + scroll so the tab strip can't push the
   dossier list off screen on a short viewport. */
.tabs{ display:flex; flex-wrap:wrap; gap:5px; margin-top:12px; max-height:118px; overflow-y:auto; }
.tab{
  display:flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:.64rem; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink-mute); background:transparent; border:1px solid var(--line); padding:6px 10px; cursor:pointer;
  border-radius:2px; white-space:nowrap;
  transition:color .15s,border-color .15s,background .15s;
}
.tab-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
.tab.active{ color:var(--gold-hi); border-color:var(--gold); background:rgba(201,168,76,.08); }
.tab:hover:not(.active){ color:var(--ink-dim); border-color:var(--ink-mute); }

.hud-scroll{ flex:1; overflow-y:auto; padding:18px 20px 28px; }
.hud-scroll::-webkit-scrollbar{ width:7px; }
.hud-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

.territory-name{ font-family:var(--font-display); font-size:1.5rem; color:var(--ink); line-height:1.15; }
.territory-sub{ font-family:var(--font-mono); font-size:.68rem; letter-spacing:.1em; color:var(--ink-mute); margin-top:6px; text-transform:uppercase; }

.section-label{
  font-family:var(--font-mono); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--cyan); margin:22px 0 4px;
}
.section-label:first-of-type{ margin-top:18px; }
.section-blurb{
  font-family:var(--font-body); font-size:.78rem; line-height:1.5; color:var(--ink-mute);
  margin-bottom:10px; max-width:52ch;
}
.m-note{ color:var(--ink-mute); font-weight:400; }

.tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tile{ background:var(--bg-tile); border:1px solid var(--line); border-radius:3px; padding:11px 12px; }
.tile-val{ font-family:var(--font-mono); font-size:1.15rem; color:var(--gold-hi); font-variant-numeric:tabular-nums; display:block; }
.tile-val.restrict{ color:var(--restrict); }
.tile-val.warn{ color:var(--warn); }
.tile-lab{ font-family:var(--font-mono); font-size:.6rem; color:var(--ink-mute); letter-spacing:.03em; margin-top:4px; display:block; line-height:1.4; }
.tile-note{ font-family:var(--font-mono); font-size:.56rem; color:var(--ink-mute); margin-top:6px; opacity:.75; line-height:1.5; }

.bar-row{ margin-top:4px; }
.bar-labels{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:.62rem; color:var(--ink-dim); margin-bottom:5px; }
.bar-track{ height:7px; background:var(--bg-tile); border:1px solid var(--line); border-radius:2px; overflow:hidden; display:flex; }
.bar-fill{ height:100%; }
.bar-caption{ font-family:var(--font-mono); font-size:.58rem; color:var(--ink-mute); margin-top:5px; }

.marker-list{ display:flex; flex-direction:column; gap:1px; border:1px solid var(--line); border-radius:3px; overflow:hidden; }
.marker-item{
  display:flex; align-items:center; gap:9px; padding:9px 11px; background:var(--bg-tile);
  cursor:pointer; transition:background .12s; border-bottom:1px solid var(--line-soft);
}
.marker-item:last-child{ border-bottom:none; }
.marker-item:hover{ background:#141f36; }
.marker-item .dot{ flex:none; }
.marker-item .m-name{ font-family:var(--font-mono); font-size:.68rem; color:var(--ink); flex:1; line-height:1.4; }
.marker-item .m-meta{ font-family:var(--font-mono); font-size:.58rem; color:var(--ink-mute); white-space:nowrap; }

.incident{ background:var(--bg-tile); border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:2px; padding:12px 13px; margin-bottom:10px; }
.incident-focusable{ cursor:pointer; transition:background .12s; }
.incident-focusable:hover{ background:#141f36; }
.incident-focus-note{ font-family:var(--font-mono); font-size:.56rem; color:var(--ink-mute); margin-top:8px; }
.incident-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.incident-title{ font-family:var(--font-mono); font-size:.7rem; color:var(--warn); letter-spacing:.02em; text-transform:uppercase; }
.incident-area{ font-family:var(--font-mono); font-size:.7rem; color:var(--ink-dim); flex:none; }
.incident-body{ font-family:var(--font-body); font-size:.84rem; line-height:1.55; color:var(--ink-dim); margin-top:8px; }
.incident-attr{ margin-top:9px; padding-top:9px; border-top:1px solid var(--line-soft); display:flex; flex-direction:column; gap:5px; }
.attr-row{ font-family:var(--font-mono); font-size:.62rem; line-height:1.6; color:var(--ink-mute); }
.attr-row b{ color:var(--ink-dim); font-weight:600; }

.legal-row{ padding:10px 0; border-bottom:1px solid var(--line-soft); }
.legal-row:last-child{ border-bottom:none; }
.legal-name{ font-family:var(--font-mono); font-size:.68rem; color:var(--gold-hi); }
.legal-desc{ font-family:var(--font-body); font-size:.8rem; color:var(--ink-dim); margin-top:4px; line-height:1.5; }

.footer-note{
  margin-top:24px; padding-top:16px; border-top:1px solid var(--line);
  font-family:var(--font-mono); font-size:.58rem; color:var(--ink-mute); line-height:1.7;
}
.footer-note a{ color:var(--cyan); text-decoration:none; }

.data-flag{
  display:inline-block; font-family:var(--font-mono); font-size:.56rem; letter-spacing:.04em;
  color:var(--restrict); border:1px solid rgba(201,102,80,.4); background:rgba(201,102,80,.08);
  padding:2px 6px; border-radius:2px; margin-top:6px;
}
.pill-missing{
  display:inline-block; font-family:var(--font-mono); font-size:.6rem; letter-spacing:.03em;
  color:var(--ink-mute); border:1px solid var(--line-soft); background:rgba(154,167,191,.08);
  padding:2px 8px; border-radius:999px;
}
.tile-multi .tile-val{ font-size:.78rem; line-height:1.6; }
.metric-confirm{ color:var(--ink-mute); font-size:.62rem; font-weight:400; }
.water-report{ margin-top:10px; }
.water-report:first-child{ margin-top:0; }
.water-persp{ font-family:var(--font-mono); font-size:.62rem; color:var(--cyan); letter-spacing:.02em; margin-bottom:6px; }
.legal-persp{ font-family:var(--font-mono); font-size:.58rem; color:var(--ink-mute); margin-top:5px; letter-spacing:.02em; }

.back-link{
  position:absolute; z-index:6; top:20px; left:24px; display:none;
}
:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

/* Mobile HUD visibility — kept last on purpose. An earlier build had this
   same rule near the top of the file, and the later unconditional .hud{
   display:flex } rule silently won the cascade, so the panel never
   actually hid on phones — it sat on top of the map with no way to
   dismiss it. Same specificity, later always wins; this has to stay the
   last thing in the sheet so nothing added above can re-break it. */
@media (max-width:760px){
  .hud{ display:none; }
  .hud.open{ display:flex; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="globe-col">

</div>

// Checkpoints previously reused the UI's --cyan accent color, one shade off
// water's blue, so the two read as the same color at a glance. Color was
// already the wrong primary signal for what a marker means — see the note
// text built in build_territories.py — but no reason to make it worse than it has
// to be.
const CATS = [
  {key:"peaks", label:"High ground", color:"#c9a84c"},
  {key:"checkpoints", label:"Checkpoints / mobility", color:"#b073e0"},
  {key:"water", label:"Water infrastructure", color:"#5b9fd6"},
  {key:"barriers", label:"Physical barriers", color:"#c96650"},
];

/* ======================================================================
   MAP ENGINE — real MapLibre GL JS (loaded via CDN, no build step, no
   node_modules needed), using CARTO's free dark-matter vector style —
   the same basemap the original GaspiMapViewer.jsx component used.
   MapLibre's built-in globe projection gives an actual rotating,
   pinch-zoomable 3D sphere with real coastlines, and its native touch
   handling replaces the hand-rolled (and buggy) gesture code from the
   first build of this page.
====================================================================== */
let activeTerritory = "west-bank";
let markers = [];

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [DATA[activeTerritory].center.lng, DATA[activeTerritory].center.lat],
  zoom: 2,
  pitch: 0,
  attributionControl: { compact: false },
});

// Fall back to MapLibre's own demo tiles if the CARTO style ever fails to
// load, so the map still renders rather than showing a blank panel.
let usedFallbackStyle = false;
map.on('error', (e) => {
  if (!usedFallbackStyle) {
    usedFallbackStyle = true;
    map.setStyle('https://demotiles.maplibre.org/style.json');
  }
});

map.on('load', () => {
  if (typeof map.setProjection === 'function') {
    try { map.setProjection({ type: 'globe' }); } catch (e) { /* falls back to flat mercator, still fully functional */ }
  }
  map.flyTo({ center:[DATA[activeTerritory].center.lng, DATA[activeTerritory].center.lat], zoom:8, duration:0 });
  addFocusShadeLayer();
  plotMarkers();
});
map.on('style.load', () => { addFocusShadeLayer(); plotMarkers(); });

// There's no real administrative-boundary polygon data in the source
// research (that would need to come from a dedicated GIS source — see the
// research prompts in research/), so this can't shade the actual border.
// What it CAN do honestly: darken everywhere outside a circle sized from
// the territory's own reported total area, centered on its known center,
// so at least "roughly here, roughly this large" reads on the map instead
// of every territory looking like an undifferentiated single dot-field on
// a generic dark basemap. Labeled as approximate everywhere it's shown.
function metricNumber(m){
  if(!m) return null;
  if(typeof m.value === 'number') return m.value;
  if(m.reports && m.reports.length){
    const nums = m.reports.map(r=>r.value).filter(v=>typeof v==='number');
    if(nums.length) return nums.reduce((a,b)=>a+b,0)/nums.length;
  }
  return null;
}
function focusRadiusKm(t){
  const area = metricNumber(t.metrics && t.metrics.area_sqkm);
  if(area && area > 0) return Math.sqrt(area/Math.PI) * 1.6; // padded for irregular shapes
  return 60; // fallback when area isn't known
}
function circlePolygon(lat, lng, radiusKm, points){
  points = points || 72;
  const coords = [];
  const latRad = lat * Math.PI/180;
  const kmPerDegLat = 111.32;
  const kmPerDegLng = 111.32 * Math.cos(latRad) || 0.0001;
  for(let i=0;i<=points;i++){
    const angle = (2*Math.PI*i)/points;
    coords.push([
      lng + (radiusKm/kmPerDegLng) * Math.sin(angle),
      lat + (radiusKm/kmPerDegLat) * Math.cos(angle),
    ]);
  }
  return coords;
}
function addFocusShadeLayer(){
  if(map.getSource('focus-shade')) return;
  map.addSource('focus-shade', { type:'geojson', data: focusShadeGeoJSON(activeTerritory) });
  map.addLayer({
    id: 'focus-shade-fill',
    type: 'fill',
    source: 'focus-shade',
    paint: { 'fill-color': '#050810', 'fill-opacity': 0.55 },
  });
}
function focusShadeGeoJSON(key){
  const t = DATA[key];
  const hole = circlePolygon(t.center.lat, t.center.lng, focusRadiusKm(t));
  const world = [[-179,-85],[179,-85],[179,85],[-179,85],[-179,-85]];
  return { type:'Feature', geometry:{ type:'Polygon', coordinates:[world, hole.slice().reverse()] }, properties:{} };
}
function updateFocusShade(key){
  const src = map.getSource('focus-shade');
  if(src) src.setData(focusShadeGeoJSON(key));
}

function clearMarkers(){
  markers.forEach(m => m.remove());
  markers = [];
}

function addMarkerGroup(list, color){
  (list||[]).forEach(m=>{
    const el = document.createElement('div');
    el.className = 'gaspi-marker';
    el.style.background = color;
    const popupHtml = '<div class="tt-title">'+m.name+'</div>'+(m.note||(m.elev?m.elev+'m elevation':''));
    const popup = new maplibregl.Popup({ offset:12, closeButton:false, className:'gaspi-popup' }).setHTML(popupHtml);
    const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([m.lng, m.lat])
      .setPopup(popup)
      .addTo(map);
    el.addEventListener('click', ()=>{ map.flyTo({ center:[m.lng,m.lat], zoom:Math.max(map.getZoom(),9), essential:true }); });
    markers.push(marker);
  });
}

function plotMarkers(){
  clearMarkers();
  const t = DATA[activeTerritory];
  addMarkerGroup(t.peaks, CATS[0].color);
  addMarkerGroup(t.checkpoints, CATS[1].color);
  addMarkerGroup(t.water, CATS[2].color);
  addMarkerGroup(t.barriers, CATS[3].color);
}

function focusTerritory(key){
  const t = DATA[key];
  map.flyTo({ center:[t.center.lng, t.center.lat], zoom:8, essential:true });
  plotMarkers();
  updateFocusShade(key);
}

function focusPoint(lat,lng){
  map.flyTo({ center:[lng,lat], zoom:Math.max(map.getZoom(),9), essential:true });
}

function fmtRange(arr, unit){
  if(!Array.isArray(arr)) return arr+(unit||'');
  const [a,b]=arr;
  if(a===b) return a.toLocaleString()+(unit||'');
  return a.toLocaleString()+'–'+b.toLocaleString()+(unit||'');
}
// One identity hue per territory, evenly spaced around the wheel — lets
// you tell territories apart at a glance in the tab strip without
// touching the marker-category legend colors (gold/cyan/blue/rust),
// which mean something different (what KIND of site, not WHICH territory).
function territoryHue(key){
  const keys = Object.keys(DATA);
  const i = keys.indexOf(key);
  return Math.round((360 / keys.length) * i);
}
function territoryColor(key){
  return `hsl(${territoryHue(key)}, 58%, 62%)`;
}

function buildTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  Object.keys(DATA).forEach(key=>{
    const b = document.createElement('button');
    b.className = 'tab' + (key===activeTerritory?' active':'');
    b.innerHTML = '<span class="tab-dot" style="background:'+territoryColor(key)+'"></span>' + DATA[key].name;
    b.onclick = ()=>{ activeTerritory = key; focusTerritory(key); renderHud(); buildTabs(); };
    tabs.appendChild(b);
  });
}
function buildLegend(){
  const l = document.getElementById('legend');
  l.innerHTML = CATS.map(c=>'<div class="legend-row"><span class="dot" style="background:'+c.color+'"></span>'+c.label+'</div>').join('')
    + '<div class="legend-row"><span class="dot" style="background:rgba(154,167,191,.6)"></span>Reference city</div>'
    + '<div class="legend-row legend-note">Darkened area = approximate focus radius sized from the territory\'s reported total area — not a real administrative border. Real boundary data isn\'t in the source research yet.</div>';
}
function markerRows(list, color){
  if(!list || !list.length) return '<div class="tile-note">No site in the source research had map coordinates for this category. That doesn\'t mean nothing was documented — check Administrative zones and Legal framework above, which don\'t depend on coordinates.</div>';
  return '<div class="marker-list">'+list.map(m=>
    '<div class="marker-item" data-lat="'+m.lat+'" data-lng="'+m.lng+'">'+
      '<span class="dot" style="background:'+color+'"></span>'+
      '<span class="m-name">'+m.name+(m.note?' <span class="m-note">— '+m.note+'</span>':'')+'</span>'+
      '<span class="m-meta">'+(m.elev?m.elev+'m':'')+'</span>'+
    '</div>'
  ).join('')+'</div>';
}
function statTile(val, label, cls){
  const missing = (val===undefined || val===null || val==='' || val==='data not available');
  const shown = missing ? '<span class="pill-missing">data not available</span>' : (Array.isArray(val) ? fmtRange(val) : val);
  return '<div class="tile"><span class="tile-val'+(cls?' '+cls:'')+'">'+shown+'</span><span class="tile-lab">'+label+'</span></div>';
}
function fmtNum(n){
  return (typeof n === 'number') ? n.toLocaleString() : n;
}
// Renders an attributed_metric()-shaped value from build_territories.py:
// {value:n, confirmed_by:k} when every perspective that reported it agrees,
// or {reports:[{perspective,value},...]} when they disagree or only some
// reported it — shown as one line per perspective instead of a merged
// number or an unattributed range.
function attrTile(metric, label, unit, cls){
  unit = unit || '';
  if(!metric || (metric.reports && !metric.reports.length) || (metric.value===undefined && !metric.reports)){
    return statTile(null, label, cls);
  }
  if(metric.reports && metric.reports.length){
    const lines = metric.reports.map(r=>fmtNum(r.value)+unit+' <span class="m-note">— '+r.perspective+'</span>').join('<br>');
    return '<div class="tile tile-multi"><span class="tile-val'+(cls?' '+cls:'')+'">'+lines+'</span><span class="tile-lab">'+label+'</span></div>';
  }
  if(metric.value==='data not available') return statTile(null, label, cls);
  const confirm = (metric.confirmed_by>1) ? ' <span class="metric-confirm">(confirmed by '+metric.confirmed_by+')</span>' : '';
  return '<div class="tile"><span class="tile-val'+(cls?' '+cls:'')+'">'+fmtNum(metric.value)+unit+confirm+'</span><span class="tile-lab">'+label+'</span></div>';
}
function renderHud(){
  const t = DATA[activeTerritory];
  document.getElementById('tName').textContent = t.name;
  document.getElementById('tName').style.color = territoryColor(activeTerritory);
  document.getElementById('tSub').textContent = t.sub;

  const m = t.metrics || {};
  let html = '';

  html += '<div class="section-label">Territorial control</div>';
  html += '<div class="section-blurb">Who physically controls how much of the land, and what that leaves for everyone else.</div>';
  html += '<div class="tile-grid">';
  html += attrTile(m.area_sqkm, 'Total area', ' km²');
  html += attrTile(m.food_import_pct, 'Food import dependency', '%', 'warn');
  html += '</div>';

  if(t.zones && t.zones.length){
    html += '<div class="section-label">Administrative zones</div>';
    html += '<div class="section-blurb">How the territory is formally or informally partitioned, and who answers for each piece — drawn from each perspective\'s own description, so the same ground sometimes appears twice under different names.</div>';
    t.zones.forEach(z=>{
      const pct = (typeof z.pct === 'number' && z.pct > 0) ? z.pct : 0;
      html += '<div class="bar-row"><div class="bar-labels"><span>'+z.name+' — '+(z.governing_authority||'data not available')+'</span><span>'+(pct?pct+'%':'—')+'</span></div>';
      html += '<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(pct,2)+'%;background:var(--gold)"></div></div></div>';
    });
  }

  if(m.water && m.water.reports && m.water.reports.length){
    html += '<div class="section-label">Water security</div>';
    html += '<div class="section-blurb">Who controls the tap. Consumption gaps between populations sharing the same territory are one of the clearest, most measurable forms of leverage in this whole framework — each perspective\'s own read on the numbers, kept separate rather than picked.</div>';
    m.water.reports.forEach(r=>{
      html += '<div class="water-report"><div class="water-persp">'+r.perspective+'</div><div class="tile-grid">';
      html += statTile(r.population_a, 'Population A per-capita /day', 'warn');
      html += statTile(r.population_b, 'Population B per-capita /day');
      html += statTile(r.who_reference_standard!=null ? r.who_reference_standard+' L/day' : null, 'WHO minimum standard');
      html += '</div></div>';
    });
  }

  html += '<div class="section-label">High ground</div>';
  html += '<div class="section-blurb">Elevation is a surveillance and defense asset — whoever holds the ridgeline can watch, and defend, everything below it. That\'s why these specific peaks are on the map at all.</div>';
  html += markerRows(t.peaks, CATS[0].color);

  html += '<div class="section-label">Checkpoints &amp; mobility</div>';
  html += '<div class="section-blurb">Every crossing is a place where movement — people, goods, medicine — requires someone else\'s permission.</div>';
  html += markerRows(t.checkpoints, CATS[1].color);

  html += '<div class="section-label">Water infrastructure</div>';
  html += '<div class="section-blurb">The physical plumbing behind the water security numbers above — wells, pipelines, treatment plants, and who actually operates each one.</div>';
  html += markerRows(t.water, CATS[2].color);

  if(t.barriers && t.barriers.length){
    html += '<div class="section-label">Physical barriers</div>';
    html += '<div class="section-blurb">Walls, fences, and berms that convert a political boundary into a physical one.</div>';
    html += markerRows(t.barriers, CATS[3].color);
  }

  if(t.incidents && t.incidents.length){
    html += '<div class="section-label">Environmental &amp; agricultural degradation</div>';
    html += '<div class="section-blurb">Documented damage to land, water, or crops. Effect and attribution are kept separate on purpose — the numbers are measured, the cause is each party\'s own account, told in full, not summarized as one side\'s "justification" against another\'s "objection."</div>';
    t.incidents.forEach(inc=>{
      const area = (inc.area===undefined||inc.area===null||inc.area==='') ? 'data not available' : inc.area;
      // Incidents don't carry their own point coordinates — fall back to the
      // territory's known center so clicking still moves the map somewhere
      // relevant instead of doing nothing.
      html += '<div class="incident incident-focusable" data-lat="'+t.center.lat+'" data-lng="'+t.center.lng+'"><div class="incident-head"><span class="incident-title">'+(inc.type||'Incident')+'</span><span class="incident-area">'+area+'</span></div>';
      html += '<div class="incident-attr">';
      (inc.accounts||[]).forEach(acc=>{
        html += '<div class="attr-row"><b>'+acc.party+' —</b> '+acc.account+'</div>';
      });
      if(!inc.accounts || !inc.accounts.length){
        html += '<div class="attr-row">No attributed account recorded for this incident yet.</div>';
      }
      html += '</div><div class="incident-focus-note">Click to center the map on '+t.name+' — this incident isn\'t tied to a single mapped point.</div></div>';
    });
  }

  if(t.legal && t.legal.length){
    html += '<div class="section-label">Legal framework</div>';
    html += '<div class="section-blurb">Where the enforced legal system and the locally preferred one diverge, and the specific statutes, orders, or rulings involved.</div>';
    t.legal.forEach(l=>{
      html += '<div class="legal-row"><div class="legal-name">'+l.name+'</div><div class="legal-desc">'+l.desc+'</div>'+
        (l.perspective && l.perspective!=='data not available' ? '<div class="legal-persp">— per '+l.perspective+'</div>' : '')+
        '</div>';
    });
  }

  const sourcesLine = (t.sources && t.sources.length) ? t.sources.join(' · ') : 'data not available';
  html += '<div class="footer-note">Sources referenced across this profile: '+sourcesLine+
    '.<br>Composite sovereignty scoring intentionally not shown here — computed downstream by a fixed formula applied identically to every territory, never eyeballed per research pass.</div>';

  document.getElementById('hudScroll').innerHTML = html;

  document.querySelectorAll('.marker-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      focusPoint(parseFloat(el.dataset.lat), parseFloat(el.dataset.lng));
    });
  });
  document.querySelectorAll('.incident-focusable').forEach(el=>{
    el.addEventListener('click', ()=>{
      focusPoint(parseFloat(el.dataset.lat), parseFloat(el.dataset.lng));
    });
  });
}

document.getElementById('hudToggle').addEventListener('click', ()=>{
  document.getElementById('hud').classList.toggle('open');
});

buildTabs(); buildLegend(); renderHud();
</script>
