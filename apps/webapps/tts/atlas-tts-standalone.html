  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7d301fb2-ea9c-4d45-b340-0bb6aacef632\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e7d431a5-02c0-4e86-8c5a-0c8073d72bfd\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c545fd50-3c24-45c8-b130-82f4e35dba01\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"08d8771f-7a26-4306-adf0-200a6a332802\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n</style>\n<style>\n:root {\n  --gold:   #c9a84c;\n  --gold2:  #e8c96d;\n  --cyan:   #00d4e8;\n  --orange: #e87c2a;\n  --void:   #02020c;\n  --panel:  rgba(4,6,22,0.97);\n  --border: rgba(201,168,76,0.22);\n  --text:   #c8d4dc;\n  --dim:    #4a5a6a;\n  --bar-h:  64px;\n}\n*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }\nhtml, body {\n  background: var(--void);\n  color: var(--text);\n  font-family: 'Space Mono','Courier New',monospace;\n  min-height: 100vh;\n  -webkit-text-size-adjust: 100%;\n}\n\n/* \u2500\u2500 CHAPTER CONTENT \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n#chapter-wrap {\n  max-width: 720px;\n  margin: 0 auto;\n  padding: 3rem 1.5rem calc(var(--bar-h) + 2rem + env(safe-area-inset-bottom, 0px));\n}\n#chapter-title {\n  font-size: 1.1rem;\n  font-weight: 700;\n  color: var(--gold);\n  letter-spacing: .08em;\n  border-bottom: 1px solid var(--border);\n  padding-bottom: 1rem;\n  margin-bottom: 2rem;\n  line-height: 1.5;\n}\n#chapter-meta {\n  font-size: .7rem;\n  color: var(--dim);\n  letter-spacing: .2em;\n  text-transform: uppercase;\n  margin-bottom: 2rem;\n  display: flex;\n  gap: 1.5rem;\n  flex-wrap: wrap;\n}\n\n/* \u2500\u2500 NODE DISCOVERY HINT \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n#node-hint {\n  display: flex;\n  align-items: center;\n  gap: .6rem;\n  font-size: .65rem;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: var(--dim);\n  border: 1px solid rgba(201,168,76,.12);\n  border-radius: 3px;\n  padding: .5rem .8rem;\n  margin-bottom: 1.5rem;\n  background: rgba(201,168,76,.03);\n  user-select: none;\n}\n#node-hint .hint-icon {\n  color: var(--gold);\n  font-size: .8rem;\n  flex-shrink: 0;\n}\n#node-hint.dismissed { display: none; }\n\n.seg {\n  font-size: .98rem;\n  line-height: 1.85;\n  margin-bottom: 1.4em;\n  padding: .5rem .75rem .5rem 2rem;\n  border-radius: 3px;\n  cursor: pointer;\n  transition: background .15s, border-color .15s;\n  position: relative;\n  -webkit-tap-highlight-color: rgba(201,168,76,.15);\n  touch-action: manipulation;\n}\n/* play triangle affordance */\n.seg::before {\n  content: '\u25b6';\n  position: absolute;\n  left: .55rem;\n  top: .65rem;\n  font-size: .5rem;\n  color: var(--dim);\n  opacity: 0;\n  transition: opacity .15s, color .15s;\n  pointer-events: none;\n}\n.seg:hover::before { opacity: 1; color: var(--gold); }\n.seg:hover { background: rgba(201,168,76,.05); }\n.seg.active {\n  background: rgba(201,168,76,.09);\n  border-left: 2px solid var(--gold);\n  padding-left: calc(2rem - 2px);\n}\n.seg.active::before { opacity: 1; color: var(--gold); }\n.seg.char-seg {\n  font-style: italic;\n  color: #d8e8f0;\n  border-left: 1px solid rgba(0,212,232,.3);\n}\n.seg.char-seg::before { color: var(--cyan); }\n.seg.char-seg.active {\n  border-left: 2px solid var(--cyan);\n  background: rgba(0,212,232,.06);\n}\n.seg.char-seg.active::before { color: var(--cyan); }\n\n/* node index label on hover */\n.seg-idx {\n  position: absolute;\n  right: .5rem;\n  top: .6rem;\n  font-size: .55rem;\n  color: var(--dim);\n  opacity: 0;\n  transition: opacity .15s;\n  letter-spacing: .1em;\n  pointer-events: none;\n}\n.seg:hover .seg-idx,\n.seg.active .seg-idx { opacity: 0.6; }\n\n.char-badge {\n  display: inline-block;\n  font-style: normal;\n  font-size: .6rem;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: #000;\n  background: var(--cyan);\n  padding: 1px 7px;\n  border-radius: 2px;\n  margin-bottom: 5px;\n  font-weight: 700;\n}\n.narrator-badge {\n  background: var(--gold);\n}\n\n/* \u2500\u2500 FORMAT REFERENCE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n#format-card {\n  background: rgba(201,168,76,.05);\n  border: 1px solid var(--border);\n  border-radius: 4px;\n  padding: 1.2rem 1.4rem;\n  margin: 2rem 0;\n  font-size: .78rem;\n  line-height: 1.8;\n}\n#format-card summary {\n  color: var(--gold2);\n  cursor: pointer;\n  letter-spacing: .15em;\n  text-transform: uppercase;\n  font-size: .7rem;\n  list-style: none;\n  display: flex;\n  align-items: center;\n  gap: .5rem;\n}\n#format-card summary::before { content: '\u25b6'; font-size: .55rem; transition: transform .2s; }\n#format-card[open] summary::before { transform: rotate(90deg); }\n#format-card .fmt-block {\n  margin-top: 1rem;\n  background: rgba(0,0,0,.5);\n  border: 1px solid rgba(201,168,76,.15);\n  border-radius: 3px;\n  padding: .8rem 1rem;\n  white-space: pre-wrap;\n  color: #8ab4c4;\n  font-size: .75rem;\n  line-height: 1.7;\n}\n#format-card .fmt-label {\n  color: var(--dim);\n  font-size: .65rem;\n  letter-spacing: .2em;\n  text-transform: uppercase;\n  margin-top: 1rem;\n  margin-bottom: .3rem;\n}\n#format-card .fmt-note { color: var(--dim); font-size: .72rem; margin-top: .5rem; }\n\n/* \u2500\u2500 BOTTOM TTS BAR \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n#tts-bar {\n  position: fixed;\n  bottom: 0;\n  left: 0; right: 0;\n  height: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px));\n  padding-bottom: env(safe-area-inset-bottom, 0px);\n  background: var(--panel);\n  border-top: 1px solid var(--border);\n  display: flex;\n  align-items: center;\n  gap: .75rem;\n  padding-left: 1rem;\n  padding-right: 1rem;\n  z-index: 100;\n  backdrop-filter: blur(12px);\n  -webkit-backdrop-filter: blur(12px);\n}\n#tts-speaker {\n  font-size: .65rem;\n  letter-spacing: .15em;\n  text-transform: uppercase;\n  color: var(--gold);\n  min-width: 72px;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n#tts-progress-wrap {\n  flex: 1;\n  height: 20px;\n  display: flex;\n  align-items: center;\n  cursor: pointer;\n  position: relative;\n  touch-action: none;\n}\n#tts-progress-track {\n  position: absolute;\n  left: 0; right: 0;\n  height: 3px;\n  background: rgba(201,168,76,.15);\n  border-radius: 2px;\n}\n#tts-progress-fill {\n  height: 100%;\n  background: var(--gold);\n  border-radius: 2px;\n  width: 0%;\n  transition: width .2s;\n  pointer-events: none;\n}\n.tts-btn {\n  background: none;\n  border: 1px solid var(--border);\n  color: var(--gold);\n  width: 40px; height: 40px;\n  border-radius: 3px;\n  cursor: pointer;\n  font-size: 1rem;\n  display: flex; align-items: center; justify-content: center;\n  transition: background .15s;\n  flex-shrink: 0;\n  -webkit-tap-highlight-color: transparent;\n  touch-action: manipulation;\n}\n.tts-btn:hover, .tts-btn:active { background: rgba(201,168,76,.1); }\n.tts-btn.primary {\n  background: var(--gold);\n  color: #000;\n  border-color: var(--gold);\n  font-weight: 700;\n  width: 50px;\n}\n.tts-btn.primary:hover, .tts-btn.primary:active { background: var(--gold2); }\n#cast-btn {\n  font-size: .6rem;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  width: auto;\n  padding: 0 .75rem;\n}\n\n/* \u2500\u2500 CAST PANEL \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n#cast-panel {\n  position: fixed;\n  top: 0; right: -100%;\n  width: min(360px, 100vw);\n  height: 100dvh;\n  background: var(--panel);\n  border-left: 1px solid var(--border);\n  z-index: 200;\n  transition: right .3s cubic-bezier(.4,0,.2,1);\n  overflow-y: auto;\n  -webkit-overflow-scrolling: touch;\n  padding: 1.2rem;\n  backdrop-filter: blur(20px);\n  -webkit-backdrop-filter: blur(20px);\n}\n#cast-panel.open { right: 0; }\n.cp-head {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 1.2rem;\n  padding-bottom: .8rem;\n  border-bottom: 1px solid var(--border);\n}\n.cp-title { color: var(--gold); font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; }\n.cp-close {\n  background: none;\n  border: none;\n  color: var(--dim);\n  cursor: pointer;\n  font-size: 1.4rem;\n  line-height: 1;\n  padding: .3rem .5rem;\n  -webkit-tap-highlight-color: transparent;\n  touch-action: manipulation;\n}\n.cp-close:hover { color: var(--gold); }\n.cp-section-label {\n  font-size: .6rem;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--dim);\n  margin: 1rem 0 .5rem;\n}\n.cast-row {\n  display: grid;\n  grid-template-columns: 1fr auto auto;\n  gap: .4rem;\n  align-items: center;\n  margin-bottom: .6rem;\n  background: rgba(0,0,0,.3);\n  border: 1px solid rgba(201,168,76,.1);\n  border-radius: 3px;\n  padding: .5rem .7rem;\n}\n.cast-row-info { overflow: hidden; }\n.cast-row-id {\n  font-size: .65rem;\n  letter-spacing: .1em;\n  color: var(--gold);\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  gap: .4rem;\n}\n.cast-row-id .gender-tag {\n  font-size: .55rem;\n  padding: 1px 5px;\n  border-radius: 2px;\n  font-weight: 400;\n}\n.gender-F { background: rgba(0,212,232,.15); color: var(--cyan); }\n.gender-M { background: rgba(232,124,42,.15); color: var(--orange); }\n.cast-row-assignment {\n  font-size: .65rem;\n  color: var(--dim);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  margin-top: 2px;\n  font-style: italic;\n}\n.cast-select {\n  background: rgba(0,0,0,.6);\n  border: 1px solid var(--border);\n  color: var(--text);\n  font-family: inherit;\n  font-size: .62rem;\n  padding: 3px 4px;\n  border-radius: 3px;\n  width: 130px;\n}\n.cast-preview {\n  background: none;\n  border: 1px solid rgba(201,168,76,.2);\n  color: var(--dim);\n  width: 32px; height: 32px;\n  border-radius: 3px;\n  cursor: pointer;\n  font-size: .7rem;\n  transition: color .15s, border-color .15s;\n  display: flex; align-items: center; justify-content: center;\n  -webkit-tap-highlight-color: transparent;\n  touch-action: manipulation;\n}\n.cast-preview:hover, .cast-preview:active { color: var(--gold); border-color: var(--gold); }\n\n.speed-row {\n  display: flex;\n  align-items: center;\n  gap: .6rem;\n  margin-bottom: .6rem;\n}\n.speed-label { font-size: .65rem; color: var(--dim); min-width: 52px; }\n.speed-val { font-size: .65rem; color: var(--gold); min-width: 30px; text-align: right; }\ninput[type=range] { flex:1; accent-color: var(--gold); height: 3px; cursor: pointer; }\n\n.engine-badge {\n  font-size: .62rem;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  padding: 4px 8px;\n  border-radius: 3px;\n  text-align: center;\n  margin-bottom: .8rem;\n}\n.engine-edge { background: rgba(0,212,232,.1); color: var(--cyan); border: 1px solid rgba(0,212,232,.25); }\n.engine-browser { background: rgba(201,168,76,.1); color: var(--gold); border: 1px solid var(--border); }\n\n/* \u2500\u2500 OVERLAY \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n#overlay {\n  position: fixed; inset: 0;\n  background: rgba(0,0,0,.4);\n  z-index: 150;\n  display: none;\n  backdrop-filter: blur(2px);\n  -webkit-backdrop-filter: blur(2px);\n}\n#overlay.on { display: block; }\n\n/* \u2500\u2500 SHARE TOAST \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n#share-toast {\n  position: fixed;\n  bottom: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px) + .75rem);\n  left: 50%;\n  transform: translateX(-50%) translateY(8px);\n  background: rgba(201,168,76,.95);\n  color: #000;\n  font-size: .65rem;\n  letter-spacing: .1em;\n  padding: .4rem .9rem;\n  border-radius: 3px;\n  opacity: 0;\n  transition: opacity .2s, transform .2s;\n  pointer-events: none;\n  white-space: nowrap;\n  z-index: 300;\n}\n#share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }\n\n/* \u2500\u2500 MOBILE OVERRIDES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n@media (max-width: 480px) {\n  #chapter-wrap { padding: 1.2rem .85rem calc(var(--bar-h) + 2.5rem + env(safe-area-inset-bottom, 0px)); }\n  #tts-speaker { min-width: 54px; font-size: .58rem; }\n  #tts-bar { gap: .4rem; padding-left: .6rem; padding-right: .6rem; }\n  .tts-btn { width: 38px; height: 38px; font-size: .95rem; }\n  .tts-btn.primary { width: 46px; }\n  #cast-btn { padding: 0 .55rem; font-size: .55rem; }\n  .seg { font-size: .92rem; line-height: 1.75; }\n  #chapter-title { font-size: .95rem; }\n  .cast-select { width: 110px; font-size: .58rem; }\n}\n</style>\n\n</head>\n<body>\n\n<div id=\"chapter-wrap\">\n  <!-- Format reference \u2014 collapsible -->\n  <details id=\"format-card\">\n    <summary>Chapter Markup Format Reference</summary>\n\n    <div class=\"fmt-label\">How to tag a historical quote in your chapter text</div>\n    <div class=\"fmt-block\">Normal narrative paragraph. This is read by the narrator (cast slot: narrator).\nNo tag needed \u2014 everything without a [V:] tag defaults to narrator.\n\n[V:male_1]\n\"In 1831, Ibrahim Pasha summoned the leaders of Jerusalem and Nablus.\"\n[/V]\n\nMore narrative continues. Narrator resumes automatically after the closing tag.\n\n[V:female_1]\n\"A direct quote from a historical female figure goes here.\"\n[/V]\n\nYou can also use inline [V:male_2]\"short quote\"[/V] within a paragraph.</div>\n\n    <div class=\"fmt-label\">Chapter JSON \u2014 voiceCast field (optional but recommended)</div>\n    <div class=\"fmt-block\">{\n  \"id\": \"n01\",\n  \"title\": \"The Ledger and the Mob...\",\n  \"voiceCast\": {\n    \"narrator\":   \"Primary narration\",\n    \"narrator_2\": \"Not used this chapter\",\n    \"male_1\":     \"Ibrahim Pasha / Ottoman officials\",\n    \"female_1\":   \"Historical female voices\"\n  },\n  \"content\": \"Normal narrative text...\\n\\n[V:male_1]\\n\\\"Since they were Muslims at war...\\\"\\n[/V]\\n\\nNarration continues...\"\n}</div>\n\n    <div class=\"fmt-note\">Cast IDs: narrator \u00b7 narrator_2 \u00b7 narrator_3 \u00b7 male_1 \u00b7 male_2 \u00b7 female_1 \u00b7 female_2<br>\n    These IDs are permanent across all chapters. Assign historical figures to them per-chapter in voiceCast.\n    The actual voice behind each ID is set globally in cast.json and can be overridden by the user.</div>\n  </details>\n\n  <!-- Node discovery hint -->\n  <div id=\"node-hint\">\n    <span class=\"hint-icon\">\u25b6</span>\n    <span>Tap any paragraph to start reading from that point</span>\n  </div>\n\n  <!-- Chapter content rendered here -->\n  <div id=\"chapter-title\"></div>\n  <div id=\"chapter-meta\"></div>\n  <div id=\"chapter-body\"></div>\n</div>\n\n<!-- TTS bottom bar -->\n<div id=\"tts-bar\">\n  <div id=\"tts-speaker\">Narrator</div>\n  <button class=\"tts-btn\" id=\"prev-btn\" title=\"Previous\" onclick=\"skip(-1)\">\u23ee</button>\n  <button class=\"tts-btn primary\" id=\"play-btn\" onclick=\"togglePlay()\">\u25b6</button>\n  <button class=\"tts-btn\" id=\"next-btn\" title=\"Next\" onclick=\"skip(1)\">\u23ed</button>\n  <div id=\"tts-progress-wrap\" onclick=\"seekClick(event)\">\n    <div id=\"tts-progress-track\">\n      <div id=\"tts-progress-fill\"></div>\n    </div>\n  </div>\n  <button class=\"tts-btn\" id=\"share-btn\" title=\"Copy link to this paragraph\" onclick=\"shareSegment()\">\ud83d\udd17</button>\n  <button class=\"tts-btn\" id=\"cast-btn\" onclick=\"toggleCast()\">\ud83c\udf99 Cast</button>\n</div>\n\n<!-- Share toast -->\n<div id=\"share-toast\">Link copied!</div>\n\n<!-- Cast panel overlay -->\n<div id=\"overlay\" onclick=\"toggleCast()\"></div>\n\n<!-- Cast panel -->\n<div id=\"cast-panel\">\n  <div class=\"cp-head\">\n    <span class=\"cp-title\">Voice Cast</span>\n    <button class=\"cp-close\" onclick=\"toggleCast()\">\u2715</button>\n  </div>\n  <div id=\"engine-badge-wrap\"></div>\n  <div class=\"speed-row\">\n    <span class=\"speed-label\">Speed</span>\n    <input type=\"range\" min=\"0.6\" max=\"2.0\" step=\"0.1\" value=\"1.0\" id=\"speed-slider\" oninput=\"onSpeed(this.value)\">\n    <span class=\"speed-val\" id=\"speed-val\">1.0\u00d7</span>\n  </div>\n  <div class=\"cp-section-label\">Character Voices</div>\n  <div id=\"cast-rows\"></div>\n  <div class=\"cp-section-label\" style=\"margin-top:1.2rem;\">Chapter Assignment</div>\n  <div id=\"cast-assignment\" style=\"font-size:.7rem; color:var(--dim); line-height:1.8;\"></div>\n</div>\n\n<script>\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// CAST \u2014 loaded from cast.json, fallback inline\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst CAST_DEFAULT = [\n  { id:'narrator',   label:'Narrator',       gender:'F', accent:'US', voice:'en-US-AriaNeural',    note:'Primary narrator' },\n  { id:'narrator_2', label:'Narrator 2',     gender:'M', accent:'GB', voice:'en-GB-RyanNeural',    note:'Academic / secondary' },\n  { id:'narrator_3', label:'Narrator 3',     gender:'F', accent:'GB', voice:'en-GB-SoniaNeural',   note:'Tone shift narrator' },\n  { id:'male_1',     label:'Male Voice 1',   gender:'M', accent:'GB', voice:'en-GB-ThomasNeural',  note:'Historical male figure' },\n  { id:'male_2',     label:'Male Voice 2',   gender:'M', accent:'US', voice:'en-US-GuyNeural',     note:'American male figure' },\n  { id:'female_1',   label:'Female Voice 1', gender:'F', accent:'US', voice:'en-US-JennyNeural',   note:'Historical female figure' },\n  { id:'female_2',   label:'Female Voice 2', gender:'F', accent:'AU', voice:'en-AU-NatashaNeural', note:'Alternate female voice' },\n];\n\nconst EDGE_VOICES = {\n  'F\u00b7US': ['en-US-AriaNeural','en-US-JennyNeural','en-US-MichelleNeural','en-US-MonicaNeural','en-US-SaraNeural','en-US-CoraNeural','en-US-ElizabethNeural','en-US-NancyNeural'],\n  'M\u00b7US': ['en-US-GuyNeural','en-US-ChristopherNeural','en-US-EricNeural','en-US-RogerNeural','en-US-SteffanNeural','en-US-DavisNeural','en-US-TonyNeural'],\n  'F\u00b7GB': ['en-GB-SoniaNeural','en-GB-LibbyNeural','en-GB-MaisieNeural','en-GB-AbbiNeural','en-GB-BellaNeural','en-GB-HollieNeural','en-GB-OliviaNeural'],\n  'M\u00b7GB': ['en-GB-RyanNeural','en-GB-ThomasNeural','en-GB-AlfieNeural','en-GB-ElliotNeural','en-GB-OliverNeural','en-GB-NoahNeural'],\n  'F\u00b7AU': ['en-AU-NatashaNeural','en-AU-AnnetteNeural','en-AU-CarlyNeural','en-AU-ElsieNeural','en-AU-FreyaNeural','en-AU-JoanneNeural'],\n  'M\u00b7AU': ['en-AU-WilliamNeural','en-AU-DarrenNeural','en-AU-DuncanNeural','en-AU-KenNeural','en-AU-NeilNeural'],\n  'F\u00b7IE': ['en-IE-EmilyNeural'],\n  'M\u00b7IE': ['en-IE-ConnorNeural'],\n};\n\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// STATE\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nlet cast = CAST_DEFAULT;\nlet voiceOverrides = {};\nlet segments = [];\nlet currentIdx = 0;\nlet playing = false;\n// Default to browser TTS (embedded, no CDN required).\n// Edge TTS upgrades this to false if it loads successfully.\nlet useBrowserTTS = true;\nlet speed = 1.0;\nlet chapterVoiceCast = {};\n\nconst audioEl = new Audio();\n\ntry { voiceOverrides = JSON.parse(localStorage.getItem('atlas_voice_overrides') || '{}'); } catch(e) {}\ntry { speed = parseFloat(localStorage.getItem('atlas_tts_speed') || '1.0'); } catch(e) {}\n\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// DEMO CHAPTER DATA\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst DEMO_CHAPTER = {\n  id: 'n01',\n  title: 'The Ledger and the Mob: Galilee Under the Pashas, 1831\u20131840',\n  date: { year: 1834, month: 4, day: 25 },\n  location: { name: 'Safed & the Galilee, Ottoman Syria' },\n  empire: 'Egyptian occupation of Ottoman Syria',\n  voiceCast: {\n    narrator:   'Primary narration',\n    narrator_2: 'Not used this chapter',\n    male_1:     'Ibrahim Pasha / Ottoman officials',\n    female_1:   'Not used this chapter',\n  },\n  content: `In 1831, Ibrahim Pasha marched his army into Greater Syria and ended a century of Ottoman rule by proxy. Governance there had been outsourced for decades to local strongmen \u2014 Ahmad al-Jazzar Pasha in Acre, Muhammad Abu Nabbut in Jaffa \u2014 men who ran their own fiefdoms with their own muscle and their own tax arrangements, answering to Istanbul mostly in name.\n\nIbrahim Pasha arrived with a modernizing army and a centralized bureaucracy built to replace that system with direct rule from Cairo. The new administration came with conscription quotas, requisition orders, and a tax structure that bypassed local intermediaries entirely.\n\nOn April 25, 1834, Ibrahim Pasha summoned the leaders of Jerusalem and Nablus and laid out what he needed: two hundred conscripts from Jerusalem to start, thirty-five hundred more from the Jerusalem and Nablus districts combined, five hundred from Hebron.\n\n[V:male_1]\n\"Since they were Muslims at war with Christian nations, wasn't a real standing army a necessity?\"\n[/V]\n\nThey didn't disagree with the principle. They told him their men were already trained fighters, the same as their fathers before them, ready to shed blood defending their land from religious enemies when the moment required it. That wasn't the same thing Ibrahim Pasha was asking for, and he told them so.\n\n[V:male_1]\n\"He wanted professional, permanent soldiers, not what he called a herd of useless men called up only when trouble arrived at the door.\"\n[/V]\n\nThe two sides were describing the same word \u2014 service \u2014 and meaning two different arrangements by it.\n\nFor a Muslim peasant household, the old arrangement had run a particular way: a man's sons served when called, and the neighbors who didn't fight paid a tax instead. Egyptian centralization left the costly half of that arrangement untouched while dismantling the half that had offset it. The jizya itself wasn't abolished. But the old bargain had never just been about a tax on someone else's ledger.\n\nBy May, the peasantry had stopped waiting. On May 19, the notables of Jerusalem and Nablus told Egyptian officials they could no longer conscript anyone or collect the new taxes, because the men of the surrounding villages had taken up arms and fled into the mountains.\n\nWhat also survives, because he wrote it down himself, is what the thirty-three days felt like from the other direction. Jacob Saphir was twelve. He didn't write about conscription decrees or toll income.\n\n[V:narrator_2]\nHe wrote about hunger \u2014 three days of it, before the village next door worked out how to hide and feed that many extra people without being caught \u2014 and about a sheikh he never learned the name of, who took that risk anyway.\n[/V]\n\nA number of Safed's Jewish families fled to Ein al-Zeitun, the Arab village beside the city, and were taken in. Saphir hid there for roughly forty days under the protection of the village's sheikh. No source names him.\n\nThe revolt was crushed without much restraint. Egyptian troops broke the city's resistance in heavy street fighting, and once inside, did not distinguish carefully between combatants and civilians: roughly five hundred people were killed in the sack of the city, against Egyptian losses of around 260.`\n};\n\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// HASH URL UTILITIES\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction updateHash(idx) {\n  if (history.replaceState) {\n    history.replaceState(null, '', '#seg-' + idx);\n  }\n}\n\nfunction readHashIdx() {\n  const h = location.hash;\n  if (h && h.startsWith('#seg-')) {\n    const n = parseInt(h.slice(5), 10);\n    if (!isNaN(n) && n >= 0) return n;\n  }\n  return null;\n}\n\nwindow.addEventListener('hashchange', function() {\n  const idx = readHashIdx();\n  if (idx !== null && idx < segments.length) {\n    if (playing) {\n      playing = false;\n      if (!useBrowserTTS) { audioEl.pause(); audioEl.src = ''; }\n      else if (typeof speechSynthesis !== 'undefined') speechSynthesis.cancel();\n    }\n    currentIdx = idx;\n    updateActiveSegment();\n    segments[currentIdx]?.el.scrollIntoView({ block: 'center', behavior: 'smooth' });\n  }\n});\n\nfunction updateActiveSegment() {\n  document.querySelectorAll('.seg.active').forEach(e => e.classList.remove('active'));\n  if (segments[currentIdx]) segments[currentIdx].el.classList.add('active');\n  const seg = segments[currentIdx];\n  document.getElementById('tts-speaker').textContent = seg?.castSlot?.label || 'Narrator';\n  updateProgress();\n}\n\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// SHARE SEGMENT\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction shareSegment() {\n  const url = location.href.split('#')[0] + '#seg-' + currentIdx;\n  if (navigator.clipboard) {\n    navigator.clipboard.writeText(url).then(showToast).catch(() => fallbackCopy(url));\n  } else {\n    fallbackCopy(url);\n  }\n}\n\nfunction fallbackCopy(text) {\n  const ta = document.createElement('textarea');\n  ta.value = text;\n  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';\n  document.body.appendChild(ta);\n  ta.select();\n  try { document.execCommand('copy'); showToast(); } catch(e) {}\n  document.body.removeChild(ta);\n}\n\nfunction showToast() {\n  const t = document.getElementById('share-toast');\n  t.classList.add('show');\n  setTimeout(() => t.classList.remove('show'), 2000);\n}\n\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// TEXT PARSER\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction parseContent(text) {\n  const segs = [];\n  const re = /\\[V:([\\w_]+)\\]\\s*([\\s\\S]*?)\\s*\\[\\/V\\]/g;\n  let lastIndex = 0;\n  let match;\n  while ((match = re.exec(text)) !== null) {\n    if (match.index > lastIndex) splitNarrator(text.slice(lastIndex, match.index), segs);\n    const charText = match[2].replace(/\\n/g, ' ').trim();\n    if (charText) segs.push({ castId: match[1], text: charText });\n    lastIndex = match.index + match[0].length;\n  }\n  if (lastIndex < text.length) splitNarrator(text.slice(lastIndex), segs);\n  return segs;\n}\n\nfunction splitNarrator(text, segs) {\n  text.split(/\\n\\n+/).forEach(para => {\n    const p = para.trim();\n    if (p) segs.push({ castId: 'narrator', text: p });\n  });\n}\n\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// RENDER CHAPTER\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction renderChapter(ch) {\n  chapterVoiceCast = ch.voiceCast || {};\n  document.getElementById('chapter-title').textContent = ch.title;\n  document.getElementById('chapter-meta').innerHTML =\n    `<span>${ch.location.name}</span><span>${ch.date.year}</span><span>${ch.empire}</span>`;\n\n  const raw = parseContent(ch.content);\n  const body = document.getElementById('chapter-body');\n  body.innerHTML = '';\n  segments = [];\n\n  raw.forEach((seg, i) => {\n    const castSlot = cast.find(c => c.id === seg.castId) || cast[0];\n    const isChar = seg.castId !== 'narrator';\n    const isAltNarrator = seg.castId === 'narrator_2' || seg.castId === 'narrator_3';\n    const el = document.createElement('p');\n    el.className = 'seg' + (isChar ? ' char-seg' : '');\n    el.id = 'seg-' + i;\n    el.dataset.idx = i;\n    el.title = 'Tap to play from here';\n\n    if (isChar) {\n      const badge = document.createElement('span');\n      badge.className = 'char-badge';\n      badge.textContent = castSlot.label;\n      el.appendChild(badge);\n      el.appendChild(document.createElement('br'));\n    } else if (isAltNarrator) {\n      const badge = document.createElement('span');\n      badge.className = 'char-badge narrator-badge';\n      badge.textContent = castSlot.label;\n      el.appendChild(badge);\n      el.appendChild(document.createElement('br'));\n    }\n\n    el.appendChild(document.createTextNode(seg.text));\n\n    // Segment index label (shown on hover / active)\n    const idxLabel = document.createElement('span');\n    idxLabel.className = 'seg-idx';\n    idxLabel.textContent = '#' + i;\n    el.appendChild(idxLabel);\n\n    el.onclick = () => { currentIdx = i; updateHash(i); startPlay(); };\n    body.appendChild(el);\n\n    segments.push({ ...seg, el, castSlot });\n  });\n\n  // Hide the hint after first interaction\n  body.addEventListener('click', () => {\n    document.getElementById('node-hint').classList.add('dismissed');\n    localStorage.setItem('atlas_hint_dismissed', '1');\n  }, { once: true });\n\n  // Restore hint dismissed state\n  if (localStorage.getItem('atlas_hint_dismissed') === '1') {\n    document.getElementById('node-hint').classList.add('dismissed');\n  }\n\n  // Restore hash position or saved position\n  const hashIdx = readHashIdx();\n  if (hashIdx !== null && hashIdx < segments.length) {\n    currentIdx = hashIdx;\n  } else {\n    try {\n      const pos = parseInt(localStorage.getItem('atlas_tts_pos') || '0');\n      currentIdx = isNaN(pos) ? 0 : Math.min(pos, segments.length - 1);\n    } catch(e) {}\n  }\n\n  renderCastPanel();\n  updateProgress();\n\n  // Scroll to active segment if coming from hash\n  if (hashIdx !== null && segments[currentIdx]) {\n    setTimeout(() => segments[currentIdx].el.scrollIntoView({ block: 'center', behavior: 'smooth' }), 200);\n  }\n}\n\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// CAST PANEL\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction renderCastPanel() {\n  const eb = document.getElementById('engine-badge-wrap');\n  eb.innerHTML = `<div class=\"engine-badge ${useBrowserTTS ? 'engine-browser' : 'engine-edge'}\">${useBrowserTTS ? '\ud83c\udf10 Browser TTS (built-in)' : '\u26a1 Edge TTS \u2014 Microsoft Neural'}</div>`;\n\n  document.getElementById('speed-slider').value = speed;\n  document.getElementById('speed-val').textContent = speed.toFixed(1) + '\u00d7';\n\n  const rows = document.getElementById('cast-rows');\n  rows.innerHTML = '';\n  cast.forEach(slot => {\n    const row = document.createElement('div');\n    row.className = 'cast-row';\n\n    const info = document.createElement('div');\n    info.className = 'cast-row-info';\n    info.innerHTML = `<div class=\"cast-row-id\">\n      ${slot.label}\n      <span class=\"gender-tag gender-${slot.gender}\">${slot.gender}\u00b7${slot.accent}</span>\n    </div>\n    <div class=\"cast-row-assignment\">${chapterVoiceCast[slot.id] || slot.note}</div>`;\n\n    const sel = document.createElement('select');\n    sel.className = 'cast-select';\n    Object.entries(EDGE_VOICES).forEach(([group, voices]) => {\n      const og = document.createElement('optgroup');\n      og.label = group;\n      voices.forEach(v => {\n        const opt = document.createElement('option');\n        opt.value = v;\n        opt.textContent = v.replace(/en-[A-Z]+-/, '').replace('Neural', '');\n        og.appendChild(opt);\n      });\n      sel.appendChild(og);\n    });\n    sel.value = voiceOverrides[slot.id] || slot.voice;\n    sel.onchange = e => {\n      voiceOverrides[slot.id] = e.target.value;\n      localStorage.setItem('atlas_voice_overrides', JSON.stringify(voiceOverrides));\n    };\n\n    const prev = document.createElement('button');\n    prev.className = 'cast-preview';\n    prev.textContent = '\u25b6';\n    prev.title = 'Preview voice';\n    prev.onclick = () => previewVoice(sel.value, slot.label);\n\n    row.appendChild(info);\n    row.appendChild(sel);\n    row.appendChild(prev);\n    rows.appendChild(row);\n  });\n\n  const assign = document.getElementById('cast-assignment');\n  const entries = Object.entries(chapterVoiceCast).filter(([,v]) => v && !v.includes('Not used'));\n  assign.innerHTML = entries.length\n    ? entries.map(([id, label]) => {\n        const slot = cast.find(c => c.id === id);\n        return `<span style=\"color:var(--gold)\">${slot?.label || id}</span> \u2192 ${label}`;\n      }).join('<br>')\n    : '<span style=\"color:var(--dim)\">No assignments defined for this chapter.</span>';\n}\n\nfunction toggleCast() {\n  document.getElementById('cast-panel').classList.toggle('open');\n  document.getElementById('overlay').classList.toggle('on');\n  renderCastPanel();\n}\n\nfunction onSpeed(v) {\n  speed = parseFloat(v);\n  document.getElementById('speed-val').textContent = speed.toFixed(1) + '\u00d7';\n  localStorage.setItem('atlas_tts_speed', speed);\n}\n\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// PLAYBACK\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction getVoice(castId) {\n  return voiceOverrides[castId] || cast.find(c => c.id === castId)?.voice || cast[0].voice;\n}\n\nasync function startPlay() {\n  playing = true;\n  document.getElementById('play-btn').textContent = '\u23f8';\n  await playSegment();\n}\n\nasync function playSegment() {\n  if (!playing || currentIdx >= segments.length) {\n    document.getElementById('play-btn').textContent = '\u25b6';\n    playing = false;\n    return;\n  }\n  const seg = segments[currentIdx];\n\n  document.querySelectorAll('.seg.active').forEach(e => e.classList.remove('active'));\n  seg.el.classList.add('active');\n  seg.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n  document.getElementById('tts-speaker').textContent = seg.castSlot?.label || 'Narrator';\n  updateHash(currentIdx);\n  updateProgress();\n\n  try {\n    if (useBrowserTTS) {\n      await playBrowser(seg);\n    } else {\n      await playEdge(seg);\n    }\n  } catch(e) {\n    console.warn('TTS error, falling back to browser TTS:', e);\n    useBrowserTTS = true;\n    renderCastPanel();\n    try { await playBrowser(seg); } catch(e2) { advanceAndContinue(); return; }\n  }\n  advanceAndContinue();\n}\n\nfunction advanceAndContinue() {\n  currentIdx++;\n  localStorage.setItem('atlas_tts_pos', currentIdx);\n  if (playing) playSegment();\n}\n\nasync function playEdge(seg) {\n  return new Promise(async (resolve, reject) => {\n    try {\n      const tts = new window.EdgeTTS({\n        voice: getVoice(seg.castId),\n        text: seg.text,\n        rate: `${Math.round((speed - 1) * 100)}%`,\n        pitch: '+0Hz',\n        volume: '+0%',\n      });\n      const result = await tts.synthesize();\n      const blob = new Blob([result.audio], { type: 'audio/mp3' });\n      const url = URL.createObjectURL(blob);\n      audioEl.src = url;\n      audioEl.onended = () => { URL.revokeObjectURL(url); resolve(); };\n      audioEl.onerror = () => { URL.revokeObjectURL(url); reject(new Error('audio error')); };\n      await audioEl.play();\n    } catch(e) { reject(e); }\n  });\n}\n\nfunction playBrowser(seg) {\n  return new Promise((resolve, reject) => {\n    if (!window.speechSynthesis) { reject(new Error('no speech synthesis')); return; }\n    if (speechSynthesis.speaking) speechSynthesis.cancel();\n    const utt = new SpeechSynthesisUtterance(seg.text);\n    const voiceName = getVoice(seg.castId);\n    const sv = speechSynthesis.getVoices().find(v => v.name === voiceName);\n    if (sv) utt.voice = sv;\n    utt.rate = speed;\n    utt.onend = resolve;\n    utt.onerror = e => { if (e.error === 'interrupted' || e.error === 'canceled') resolve(); else reject(e); };\n    speechSynthesis.speak(utt);\n  });\n}\n\nfunction togglePlay() {\n  if (playing) {\n    playing = false;\n    if (!useBrowserTTS) audioEl.pause();\n    else if (window.speechSynthesis) speechSynthesis.cancel();\n    document.getElementById('play-btn').textContent = '\u25b6';\n  } else {\n    if (currentIdx >= segments.length) currentIdx = 0;\n    startPlay();\n  }\n}\n\nfunction skip(dir) {\n  playing = false;\n  if (!useBrowserTTS) { audioEl.pause(); audioEl.src = ''; }\n  else if (window.speechSynthesis) speechSynthesis.cancel();\n  currentIdx = Math.max(0, Math.min(segments.length - 1, currentIdx + dir));\n  updateHash(currentIdx);\n  startPlay();\n}\n\nfunction seekClick(e) {\n  if (!segments.length) return;\n  const rect = e.currentTarget.getBoundingClientRect();\n  const frac = (e.clientX - rect.left) / rect.width;\n  const idx = Math.floor(frac * segments.length);\n  playing = false;\n  if (!useBrowserTTS) { audioEl.pause(); audioEl.src = ''; }\n  else if (window.speechSynthesis) speechSynthesis.cancel();\n  currentIdx = Math.max(0, Math.min(segments.length - 1, idx));\n  updateHash(currentIdx);\n  startPlay();\n}\n\nfunction updateProgress() {\n  const pct = segments.length ? (currentIdx / segments.length) * 100 : 0;\n  document.getElementById('tts-progress-fill').style.width = pct + '%';\n}\n\nasync function previewVoice(voiceName, label) {\n  const text = `Hello. I am the voice assigned to ${label}.`;\n  if (!useBrowserTTS && window.EdgeTTS) {\n    try {\n      const tts = new window.EdgeTTS({ voice: voiceName, text, rate: '+0%', pitch: '+0Hz', volume: '+0%' });\n      const result = await tts.synthesize();\n      const blob = new Blob([result.audio], { type: 'audio/mp3' });\n      const url = URL.createObjectURL(blob);\n      const tmp = new Audio(url);\n      tmp.play();\n      tmp.onended = () => URL.revokeObjectURL(url);\n      return;\n    } catch(e) { console.warn('Edge preview failed, using browser', e); }\n  }\n  if (window.speechSynthesis) {\n    if (speechSynthesis.speaking) speechSynthesis.cancel();\n    const utt = new SpeechSynthesisUtterance(text);\n    const sv = speechSynthesis.getVoices().find(v => v.name === voiceName);\n    if (sv) utt.voice = sv;\n    speechSynthesis.speak(utt);\n  }\n}\n\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// EDGE TTS OPTIONAL UPGRADE\n// Loads from CDN if available; falls back gracefully to browser TTS.\n// useBrowserTTS starts as true so the app works immediately without network.\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction tryLoadEdgeTTS() {\n  try {\n    const s = document.createElement('script');\n    s.type = 'module';\n    s.textContent = `\n      import { EdgeTTS, VoicesManager } from 'https://unpkg.com/edge-tts-universal@latest/dist/browser.js';\n      window.EdgeTTS = EdgeTTS;\n      window.VoicesManager = VoicesManager;\n      window._edgeReady = true;\n      // Switch to Edge TTS engine now that it's loaded\n      if (typeof window._onEdgeReady === 'function') window._onEdgeReady();\n    `;\n    document.head.appendChild(s);\n  } catch(e) {\n    // CDN unavailable \u2014 browser TTS remains active, no action needed\n  }\n}\n\nwindow._onEdgeReady = function() {\n  useBrowserTTS = false;\n  renderCastPanel();\n};\n\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// INIT\n// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction init() {\n  // Warm up browser speech synthesis voice list\n  if (window.speechSynthesis) {\n    speechSynthesis.getVoices();\n    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();\n  }\n\n  // Try to load cast from JSON; fall back to inline defaults\n  fetch('data/cast.json')\n    .then(r => r.json())\n    .then(data => { if (data.cast) cast = data.cast; })\n    .catch(() => {})\n    .finally(() => {\n      renderChapter(DEMO_CHAPTER);\n      // Attempt to upgrade to Edge TTS in background (optional)\n      tryLoadEdgeTTS();\n    });\n}\n\n// Guard against the bundler's DOMContentLoaded already having fired.\n// In standalone use, readyState will be 'loading'; when injected via the\n// bundler wrapper, it will be 'complete' \u2014 both cases are handled.\nif (document.readyState === 'loading') {\n  document.addEventListener('DOMContentLoaded', init);\n} else {\n  setTimeout(init, 0);\n}\n</script>\n\n\n</body></html>\n"
