<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reading Room</title><link rel="stylesheet" href="popup.css"></head><body><header><h1>FeistTech Reading Room</h1><span>portable · v0.3</span></header><nav class="sources"><button data-mode="tab" class="on">Open Tab</button><button data-mode="paste">Paste Text</button><button data-mode="file">Upload File</button></nav><section id="tabPane"><label>Read from tab</label><div class="line"><select id="tab"></select><button id="tabs">↻</button></div><div id="tabTools"></div></section><section id="pastePane" hidden><label>Drop your own text</label><textarea id="paste" placeholder="Paste an article, manuscript, notes, transcript…"></textarea></section><section id="filePane" hidden><label class="upload">Choose a file<input id="file" type="file" accept=".txt,.md,.markdown,.html,.htm,.json,.csv,.pdf,text/*,application/pdf" hidden></label><div id="fileName" class="muted">TXT, Markdown, HTML, JSON, CSV and PDF</div></section><section class="controls"><div class="line"><label>Narrators</label><select id="count"><option>1</option><option>2</option><option>3</option></select></div><div id="voices"></div><button id="refresh">↻ Refresh voices</button></section><div class="actions"><button id="stop">■ Stop</button><button id="read" class="primary">▶ Read</button></div><div id="status"></div><script src="pdf.min.js"></script><script src="popup.js"></script></body></html>
