<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signature Trends — FeistTech</title>
<meta name="description" content="Compare Google Trends search interest across terms, locations, and time windows in up to five side-by-side panels.">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script type="text/javascript" src="https://ssl.gstatic.com/trends_nrtr/embed_loader.js"></script>
<style>
  :root {
    --primary: #00f3ff;
    --secondary: #bc13fe;
    --accent: #ff6b35;
    --bg: #050510;
    --bg2: #0a0a1a;
    --bg3: #111122;
    --border: rgba(0,243,255,0.18);
    --text: #c8d0dc;
    --dim: #6a7080;
    --success: #22c55e;
    --warning: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto Mono', 'SF Mono', ui-monospace, monospace;
    margin: 0;
    padding: 0;
    line-height: 1.5;
  }
  header {
    padding: 1.4rem 2rem 1.1rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(to bottom, #050510, transparent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  header a { color: var(--dim); text-decoration: none; font-size: 0.75rem; }
  header a:hover { color: var(--primary); }
  h1 {
    font-family: 'Orbitron', 'SF Pro Display', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    margin: 0;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
  }
  .sub { font-size: 0.68rem; color: var(--dim); }
  .badge {
    font-size: 0.6rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(188,19,254,0.2);
    color: var(--secondary);
    letter-spacing: 0.5px;
  }

  main { max-width: 1280px; margin: 0 auto; padding: 1.5rem 1.2rem 4rem; }

  /* Preset Bar */
  .preset-bar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 1.4rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.7rem;
    align-items: center;
  }
  .preset-bar label { font-size: 0.68rem; color: var(--dim); margin-right: 0.4rem; }
  .preset-select {
    min-width: 260px;
    background: #050508;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.78rem;
  }
  .preset-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .preset-actions button {
    font-size: 0.7rem;
    padding: 5px 11px;
    border-radius: 5px;
  }
  .preset-info {
    font-size: 0.68rem;
    color: var(--dim);
    margin-left: auto;
    max-width: 420px;
    line-height: 1.4;
  }
  .preset-info strong { color: var(--primary); }

  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.15rem 1.3rem 1.25rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .panel:hover { border-color: rgba(0,243,255,0.35); }
  .panel-title {
    font-size: 0.66rem;
    color: var(--dim);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 0.7rem;
    font-weight: 500;
  }
  .termsList { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.45rem; }
  .termGroup { display: flex; gap: 0.35rem; align-items: center; }
  input, select {
    background: #050508;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 6px 9px;
    font-family: inherit;
    font-size: 0.78rem;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,243,255,0.1); }
  .removeTerm {
    background: rgba(255,107,53,0.12);
    border: 1px solid rgba(255,107,53,0.45);
    color: #ff6b35;
    border-radius: 5px;
    padding: 0 8px;
    font-size: 0.88rem;
    height: 30px;
    cursor: pointer;
  }
  .addTerm {
    font-size: 0.7rem;
    padding: 4px 10px;
    border-color: var(--dim);
    color: var(--dim);
  }
  .formRow { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center; }
  .dateRow input { min-width: 122px; flex: 0 1 135px; font-feature-settings: "tnum"; }
  .panelControls { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-top: 0.6rem; padding-top: 0.55rem; border-top: 1px dashed var(--border); }
  button {
    background: var(--bg);
    border: 1px solid var(--primary);
    color: var(--primary);
    border-radius: 5px;
    padding: 6px 11px;
    font-family: inherit;
    font-size: 0.74rem;
    cursor: pointer;
    transition: all 0.12s ease;
    font-weight: 500;
  }
  button:hover { background: rgba(0,243,255,0.08); }
  button.load { border-color: var(--secondary); color: var(--secondary); font-weight: 600; }
  button.load:hover { background: rgba(188,19,254,0.12); }
  button.clear { border-color: rgba(255,107,53,0.5); color: #ff6b35; }
  .embedHost {
    margin-top: 0.9rem;
    min-height: 295px;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 0.5rem;
    background: #020208;
  }
  .placeholder { color: var(--dim); font-size: 0.72rem; font-style: italic; display: flex; align-items: center; justify-content: center; height: 100%; min-height: 260px; text-align: center; }
  .hint { font-size: 0.62rem; color: var(--dim); margin-top: 0.3rem; opacity: 0.85; }
  .presets { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin: 0.3rem 0 0.05rem; }
  .presets span { font-size: 0.63rem; color: var(--dim); margin-right: 0.15rem; }
  .presetBtn { font-size: 0.64rem; padding: 2px 7px; border-color: var(--dim); color: var(--dim); }
  .presetBtn:hover { border-color: var(--primary); color: var(--primary); }
  .embedFooter { margin-top: 0.55rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; font-size: 0.7rem; }
  .trendLink { color: var(--primary); text-decoration: none; }
  .trendLink:hover { text-decoration: underline; }
  .copyBtn { background: transparent; border: 1px solid var(--dim); color: var(--dim); font-size: 0.66rem; padding: 2px 8px; border-radius: 4px; }
  .copyBtn:hover { border-color: var(--primary); color: var(--primary); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="../../../index.html">← FeistTech</a>
    <div>
      <h1>SIGNATURE TRENDS</h1>
      <div class="sub">Multi-panel Google Trends comparison</div>
    </div>
  </div>
  <div>
    <span class="badge">v1.0</span>
  </div>
</header>

<main>

  <!-- SAVED PRESETS -->
  <div class="preset-bar">
    <label for="presetSelect">Preset:</label>
    <select id="presetSelect" class="preset-select">
      <option value="">— No presets saved yet —</option>
    </select>

    <div class="preset-actions">
      <button id="btnLoadPreset" type="button">Load → Active Panel</button>
      <button id="btnLoadFullPreset" type="button" style="border-color:#22c55e; color:#22c55e;">Load Across All Panels</button>
      <button id="btnSavePreset" type="button" style="border-color:var(--secondary); color:var(--secondary);">+ Save Active Panel as Preset</button>
      <button id="btnDeletePreset" type="button" class="clear">Delete Preset</button>
    </div>

    <div id="presetInfo" class="preset-info"></div>

    <!-- Multi-term-group selector for presets with more than one group -->
    <div id="presetTermSelector" style="display:none; width:100%; margin-top:0.5rem; padding-top:0.5rem; border-top:1px dashed var(--border);">
      <div style="font-size:0.65rem; color:var(--dim); margin-bottom:0.3rem;">Term groups in this preset (check + add to active panel):</div>
      <div id="presetTermCheckboxes" style="display:flex; flex-wrap:wrap; gap:0.35rem 0.6rem; max-height:110px; overflow:auto; padding:0.2rem 0;"></div>
      <button id="btnAddSelectedTerms" type="button" style="margin-top:0.4rem; font-size:0.7rem; padding:4px 10px;">Add checked terms to active panel</button>
    </div>
  </div>

  <div id="panelContainer"></div>

</main>

<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════
  // Presets are entirely user-authored and stored locally — nothing is
  // pre-populated or shipped in this file. Save the terms/geo/dates on
  // any panel you like with "+ Save Active Panel as Preset" and they'll
  // show up in the dropdown next time, the same way the Reader's save
  // slots work.
  // ═══════════════════════════════════════════════════════════════════
  const PRESETS_KEY = 'feisttech_trends_presets';

  function getPresets() {
    try { return JSON.parse(localStorage.getItem(PRESETS_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function savePresets(list) {
    try { localStorage.setItem(PRESETS_KEY, JSON.stringify(list)); } catch (e) {}
  }

  const GEOS = [
    ['', 'Worldwide'],
    ['US', 'United States'],
    ['US-NY-501', 'New York, NY'],
    ['US-CA-803', 'Los Angeles, CA'],
    ['US-IL-602', 'Chicago, IL'],
    ['GB', 'United Kingdom'],
    ['CA', 'Canada'],
    ['AU', 'Australia'],
    ['custom', '✎ Custom code...'],
  ];

  const TYPES = [
    ['', 'Web Search'],
    ['news', 'News'],
    ['images', 'Images'],
    ['froogle', 'Shopping'],
    ['youtube', 'YouTube'],
  ];

  const MAX_TERMS = 5;
  const PANEL_COUNT = 5;

  let currentPreset = null;

  function optionsHtml(list, selected) {
    return list.map(([v, l]) =>
      `<option value="${v}" ${v === selected ? 'selected' : ''}>${l}</option>`
    ).join('');
  }

  function activePanel() {
    return document.querySelector('.panel:hover') || document.querySelector('.panel');
  }

  // ── Preset dropdown ──
  function populatePresetSelect() {
    const sel = document.getElementById('presetSelect');
    const presets = getPresets();
    sel.innerHTML = presets.length
      ? '<option value="">— Select a preset —</option>'
      : '<option value="">— No presets saved yet —</option>';
    presets.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      sel.appendChild(opt);
    });
  }

  function updatePresetInfo() {
    const infoDiv = document.getElementById('presetInfo');
    const termSel = document.getElementById('presetTermSelector');
    if (!currentPreset) {
      infoDiv.innerHTML = '';
      if (termSel) termSel.style.display = 'none';
      return;
    }
    const termCount = currentPreset.termGroups.reduce((n, g) => n + g.terms.length, 0);
    infoDiv.innerHTML = `
      <strong>${currentPreset.name}</strong><br>
      ${currentPreset.termGroups.length} term group${currentPreset.termGroups.length === 1 ? '' : 's'} · ${termCount} term${termCount === 1 ? '' : 's'} · saved ${new Date(currentPreset.createdAt).toLocaleDateString()}
    `;
    if (termSel && currentPreset.termGroups.length > 1) {
      termSel.style.display = 'block';
      populatePresetTermCheckboxes();
    } else if (termSel) {
      termSel.style.display = 'none';
    }
  }

  function populatePresetTermCheckboxes() {
    const container = document.getElementById('presetTermCheckboxes');
    if (!container || !currentPreset) return;
    container.innerHTML = '';
    const allTerms = new Set();
    currentPreset.termGroups.forEach(g => g.terms.forEach(t => allTerms.add(t)));
    allTerms.forEach(term => {
      const label = document.createElement('label');
      label.style.cssText = 'display:flex; align-items:center; gap:4px; font-size:0.72rem; cursor:pointer; white-space:nowrap;';
      label.innerHTML = `
        <input type="checkbox" value="${term.replace(/"/g, '&quot;')}" checked>
        <span>${term}</span>
      `;
      container.appendChild(label);
    });
  }

  function addSelectedPresetTermsToActivePanel() {
    if (!currentPreset) return;
    const panel = activePanel();
    if (!panel) { alert('No active panel found.'); return; }
    const checked = Array.from(document.querySelectorAll('#presetTermCheckboxes input:checked')).map(i => i.value);
    if (checked.length === 0) { alert('No terms selected.'); return; }
    const list = panel.querySelector('.termsList');
    const currentCount = list.children.length;
    checked.slice(0, MAX_TERMS - currentCount).forEach(t => {
      const exists = Array.from(list.querySelectorAll('.termInput')).some(inp => inp.value.trim() === t);
      if (!exists) addTermRow(panel, t);
    });
    savePanelState(panel);
  }

  // ── Save / load / delete presets ──
  function saveActivePanelAsPreset() {
    const panel = activePanel();
    if (!panel) return;
    const terms = Array.from(panel.querySelectorAll('.termInput')).map(i => i.value.trim()).filter(Boolean);
    if (terms.length === 0) { alert('Add at least one term to this panel before saving it as a preset.'); return; }
    const name = prompt('Name this preset:', '');
    if (!name || !name.trim()) return;

    const preset = {
      id: 'preset_' + Date.now().toString(36),
      name: name.trim(),
      createdAt: Date.now(),
      termGroups: [{ label: 'Terms', terms }],
      geo: panel.querySelector('.geoSelect').value,
      gprop: panel.querySelector('.typeSelect').value,
      startDate: panel.querySelector('.startDate').value.trim(),
      endDate: panel.querySelector('.endDate').value.trim()
    };
    const presets = getPresets();
    presets.unshift(preset);
    savePresets(presets);
    populatePresetSelect();
    document.getElementById('presetSelect').value = preset.id;
    currentPreset = preset;
    updatePresetInfo();
  }

  function deleteCurrentPreset() {
    if (!currentPreset) { alert('Select a preset to delete first.'); return; }
    if (!confirm(`Delete preset "${currentPreset.name}"?`)) return;
    const presets = getPresets().filter(p => p.id !== currentPreset.id);
    savePresets(presets);
    currentPreset = null;
    populatePresetSelect();
    updatePresetInfo();
  }

  function loadPresetIntoActivePanel() {
    if (!currentPreset) { alert('Select a preset first.'); return; }
    const panel = activePanel();
    if (!panel) return;

    const list = panel.querySelector('.termsList');
    list.innerHTML = '';
    currentPreset.termGroups[0].terms.forEach(t => addTermRow(panel, t));

    if (currentPreset.geo !== undefined) panel.querySelector('.geoSelect').value = currentPreset.geo;
    if (currentPreset.gprop !== undefined) panel.querySelector('.typeSelect').value = currentPreset.gprop;
    if (currentPreset.startDate) panel.querySelector('.startDate').value = currentPreset.startDate;
    if (currentPreset.endDate) panel.querySelector('.endDate').value = currentPreset.endDate;

    savePanelState(panel);
    panel.style.transition = 'box-shadow 0.2s';
    panel.style.boxShadow = '0 0 0 3px rgba(34,197,94,0.4)';
    setTimeout(() => panel.style.boxShadow = '0 4px 20px rgba(0,0,0,0.3)', 900);
  }

  function loadPresetAcrossAllPanels() {
    if (!currentPreset) { alert('Select a preset first.'); return; }
    const panels = Array.from(document.querySelectorAll('.panel'));
    panels.forEach(p => {
      p.querySelector('.termsList').innerHTML = '';
      p.querySelector('.startDate').value = '';
      p.querySelector('.endDate').value = '';
    });

    let panelIdx = 0;
    currentPreset.termGroups.forEach(group => {
      if (panelIdx >= panels.length) return;
      const panel = panels[panelIdx];
      group.terms.slice(0, MAX_TERMS).forEach(t => addTermRow(panel, t));
      if (currentPreset.geo !== undefined) panel.querySelector('.geoSelect').value = currentPreset.geo;
      if (currentPreset.gprop !== undefined) panel.querySelector('.typeSelect').value = currentPreset.gprop;
      if (currentPreset.startDate) panel.querySelector('.startDate').value = currentPreset.startDate;
      if (currentPreset.endDate) panel.querySelector('.endDate').value = currentPreset.endDate;
      savePanelState(panel);
      panelIdx++;
    });

    while (panelIdx < panels.length) {
      addTermRow(panels[panelIdx]);
      panelIdx++;
    }
  }

  // ── Panel state persistence (per-panel, independent of presets) ──
  function getPanelKey(panel) {
    return `feisttech_signature_panel_${panel.dataset.index}`;
  }

  function savePanelState(panel) {
    const terms = Array.from(panel.querySelectorAll('.termInput')).map(i => i.value.trim()).filter(Boolean);
    const state = {
      terms,
      geo: panel.querySelector('.geoSelect').value,
      gprop: panel.querySelector('.typeSelect').value,
      startDate: panel.querySelector('.startDate').value.trim(),
      endDate: panel.querySelector('.endDate').value.trim()
    };
    try { localStorage.setItem(getPanelKey(panel), JSON.stringify(state)); } catch(e){}
  }

  function restorePanelState(panel) {
    try {
      const saved = localStorage.getItem(getPanelKey(panel));
      if (!saved) return false;
      const state = JSON.parse(saved);
      panel.querySelector('.geoSelect').value = state.geo || '';
      panel.querySelector('.typeSelect').value = state.gprop || '';
      panel.querySelector('.startDate').value = state.startDate || '';
      panel.querySelector('.endDate').value = state.endDate || '';
      const list = panel.querySelector('.termsList');
      list.innerHTML = '';
      if (state.terms && state.terms.length > 0) {
        state.terms.forEach(t => addTermRow(panel, t));
      } else {
        addTermRow(panel);
      }
      return true;
    } catch(e) { return false; }
  }

  function addTermRow(panel, value = '') {
    const list = panel.querySelector('.termsList');
    if (list.children.length >= MAX_TERMS) return;
    const row = document.createElement('div');
    row.className = 'termGroup';
    row.innerHTML = `
      <input type="text" class="termInput" placeholder="exact phrase term" value="${value.replace(/"/g, '&quot;')}">
      <button class="removeTerm" type="button" title="Remove">×</button>
    `;
    const removeBtn = row.querySelector('.removeTerm');
    removeBtn.addEventListener('click', () => {
      row.remove();
      savePanelState(panel);
    });
    list.appendChild(row);
    const input = row.querySelector('.termInput');
    input.addEventListener('input', () => savePanelState(panel));
  }

  function setupDateInput(input, panel) {
    input.addEventListener('input', () => {
      let val = input.value.replace(/[^0-9]/g, '').slice(0, 8);
      if (val.length > 4) val = val.slice(0,4) + '-' + val.slice(4);
      if (val.length > 7) val = val.slice(0,7) + '-' + val.slice(7);
      if (input.value !== val) {
        input.value = val;
      }
      savePanelState(panel);
    });
  }

  function applyDatePreset(panel, preset, baseDate = null) {
    const startIn = panel.querySelector('.startDate');
    const endIn = panel.querySelector('.endDate');
    let end = baseDate ? new Date(baseDate) : new Date();
    let start = new Date(end.getTime());
    if (preset === '7d') start.setDate(start.getDate() - 7);
    else if (preset === '30d') start.setDate(start.getDate() - 30);
    else if (preset === '90d') start.setDate(start.getDate() - 90);
    else if (preset === '6mo') start.setMonth(start.getMonth() - 6);
    else if (preset === '1y') start.setFullYear(start.getFullYear() - 1);
    else if (preset === 'saved' && currentPreset && currentPreset.startDate) {
      startIn.value = currentPreset.startDate;
      endIn.value = currentPreset.endDate || '';
      savePanelState(panel);
      return;
    }
    const fmt = d => d.toISOString().slice(0,10);
    startIn.value = fmt(start);
    endIn.value = fmt(end);
    savePanelState(panel);
  }

  function buildPanel(index) {
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.dataset.index = index;
    panel.innerHTML = `
      <div class="panel-title">Panel ${index + 1}</div>
      <div class="termsList"></div>
      <button class="addTerm" type="button">+ term</button>

      <div class="formRow" style="margin-top:0.6rem">
        <select class="geoSelect">${optionsHtml(GEOS, '')}</select>
        <select class="typeSelect">${optionsHtml(TYPES, '')}</select>
      </div>

      <div class="formRow dateRow">
        <input type="text" class="startDate" placeholder="start YYYY-MM-DD" inputmode="numeric">
        <input type="text" class="endDate" placeholder="end YYYY-MM-DD" inputmode="numeric">
      </div>

      <div class="presets">
        <span>Quick:</span>
        <button type="button" class="presetBtn" data-preset="7d">7d</button>
        <button type="button" class="presetBtn" data-preset="30d">30d</button>
        <button type="button" class="presetBtn" data-preset="90d">90d</button>
        <button type="button" class="presetBtn" data-preset="6mo">6mo</button>
        <button type="button" class="presetBtn" data-preset="saved">Saved preset's window</button>
        <button type="button" class="clearDates" style="margin-left:0.4rem; font-size:0.62rem; padding:2px 6px; border-color:rgba(255,107,53,0.4); color:#ff6b35;">Clear dates</button>
      </div>

      <div class="panelControls">
        <button class="load" type="button">Load</button>
        <button class="clear" type="button">Clear Embed</button>
      </div>

      <div class="embedHost"><span class="placeholder">No data loaded yet.<br>Enter terms or load a saved preset.</span></div>
      <div class="hint">Exact phrase matching · Max 5 terms per panel</div>
    `;
    return panel;
  }

  function wirePanel(panel) {
    restorePanelState(panel);
    const list = panel.querySelector('.termsList');
    if (list.children.length === 0) addTermRow(panel);

    panel.addEventListener('input', e => {
      if (e.target.classList.contains('termInput') || e.target.classList.contains('startDate') || e.target.classList.contains('endDate')) {
        savePanelState(panel);
      }
    });
    panel.addEventListener('change', e => {
      if (e.target.classList.contains('geoSelect') || e.target.classList.contains('typeSelect')) savePanelState(panel);
    });

    panel.querySelector('.addTerm').addEventListener('click', () => {
      addTermRow(panel);
      savePanelState(panel);
    });

    panel.querySelector('.geoSelect').addEventListener('change', e => {
      if (e.target.value === 'custom') {
        const code = prompt('Enter custom geo code (e.g. US-TX-623, FR, JP):', '');
        if (code && code.trim()) {
          const opt = document.createElement('option');
          opt.value = code.trim();
          opt.textContent = code.trim() + ' (custom)';
          opt.selected = true;
          e.target.appendChild(opt);
          savePanelState(panel);
        } else {
          e.target.value = '';
        }
      }
    });

    setupDateInput(panel.querySelector('.startDate'), panel);
    setupDateInput(panel.querySelector('.endDate'), panel);

    panel.querySelectorAll('.presetBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        applyDatePreset(panel, btn.dataset.preset);
      });
    });
    panel.querySelector('.clearDates').addEventListener('click', () => {
      panel.querySelector('.startDate').value = '';
      panel.querySelector('.endDate').value = '';
      savePanelState(panel);
    });

    panel.querySelector('.load').addEventListener('click', () => loadPanel(panel));
    panel.querySelector('.clear').addEventListener('click', () => {
      const host = panel.querySelector('.embedHost');
      host.innerHTML = '<span class="placeholder">Embed cleared.</span>';
    });
  }

  function loadPanel(panel) {
    const terms = Array.from(panel.querySelectorAll('.termInput'))
      .map(i => i.value.trim()).filter(Boolean).slice(0, MAX_TERMS);
    if (terms.length === 0) { alert('Enter at least one term.'); return; }

    const geo = panel.querySelector('.geoSelect').value;
    const gprop = panel.querySelector('.typeSelect').value;
    const start = panel.querySelector('.startDate').value.trim();
    const end = panel.querySelector('.endDate').value.trim();
    const time = (start && end) ? `${start} ${end}` : undefined;

    const host = panel.querySelector('.embedHost');
    const hostId = `embed-host-${panel.dataset.index}-${Date.now()}`;

    const exploreQuery =
      `q=${terms.map(t => encodeURIComponent(`"${t}"`)).join(',')}` +
      (gprop ? `&gprop=${encodeURIComponent(gprop)}` : '') +
      (time ? `&date=${encodeURIComponent(time)}` : '') +
      (geo ? `&geo=${encodeURIComponent(geo)}` : '') +
      `&hl=en-US`;
    const fullUrl = `https://trends.google.com/trends/explore?${exploreQuery}`;

    host.innerHTML = `
      <div style="padding:0.6rem; background:#0a0a1a; border-radius:6px; margin-bottom:0.5rem; font-size:0.72rem;">
        <div style="color:var(--dim); margin-bottom:0.25rem;">Full Google Trends URL (copy or open with all params):</div>
        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
          <a href="${fullUrl}" target="_blank" class="trendLink" style="flex:1; word-break:break-all;">${fullUrl}</a>
          <button type="button" class="copyBtn" data-url="${fullUrl}">⎘ Copy URL</button>
        </div>
      </div>
      <div id="${hostId}"><div class="placeholder">Attempting to load embedded chart…<br>If it fails, use the URL above.</div></div>
    `;

    const copyBtn = host.querySelector('.copyBtn');
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const url = copyBtn.dataset.url;
        navigator.clipboard.writeText(url).then(() => {
          const orig = copyBtn.textContent;
          copyBtn.textContent = '✓ Copied';
          setTimeout(() => copyBtn.textContent = orig, 1200);
        }).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
          copyBtn.textContent = '✓ Copied'; setTimeout(() => copyBtn.textContent = '⎘ Copy', 1200);
        });
      });
    }

    const comparisonItem = terms.map(t => {
      const item = { keyword: t, geo: geo || '' };
      if (time) item.time = time;
      return item;
    });

    if (!window.trends || !window.trends.embed) {
      const embedDiv = host.querySelector(`#${hostId}`);
      if (embedDiv) embedDiv.innerHTML = `<span class="placeholder">Embed script not ready.<br>Use the full URL above (it contains every parameter).</span>`;
      return;
    }

    try {
      window.trends.embed.renderExploreWidget('TIMESERIES', {
        comparisonItem, category: 0, property: gprop || ''
      }, {
        exploreQuery,
        guestPath: 'https://trends.google.com:443/trends/embed/',
        embedTarget: hostId
      });
    } catch (e) {
      const embedDiv = host.querySelector(`#${hostId}`);
      if (embedDiv) embedDiv.innerHTML = `<span class="placeholder">Widget error: ${e.message}<br>Use the full URL above.</span>`;
      return;
    }

    savePanelState(panel);
  }

  function init() {
    populatePresetSelect();

    const container = document.getElementById('panelContainer');
    for (let i = 0; i < PANEL_COUNT; i++) {
      const panel = buildPanel(i);
      container.appendChild(panel);
      wirePanel(panel);
    }

    document.getElementById('presetSelect').addEventListener('change', (e) => {
      const presets = getPresets();
      currentPreset = presets.find(p => p.id === e.target.value) || null;
      updatePresetInfo();
    });
    document.getElementById('btnLoadPreset').addEventListener('click', loadPresetIntoActivePanel);
    document.getElementById('btnLoadFullPreset').addEventListener('click', loadPresetAcrossAllPanels);
    document.getElementById('btnSavePreset').addEventListener('click', saveActivePanelAsPreset);
    document.getElementById('btnDeletePreset').addEventListener('click', deleteCurrentPreset);

    const addTermsBtn = document.getElementById('btnAddSelectedTerms');
    if (addTermsBtn) addTermsBtn.addEventListener('click', addSelectedPresetTermsToActivePanel);
  }

  init();
})();
</script>

</body>
</html>
