<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Symmetry Painting App</title>
	<style>
		body { margin: 0; overflow: hidden; background: #111; color: #efffee; font-family: sans-serif; }
		#ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; z-index: 100; max-height: 90vh; overflow-y: auto; }
		canvas { display: block; width: 100vw; height: 100vh; }
		.control { margin: 5px 0; }
		label { display: block; font-size: 12px; margin-bottom: 2px; }
		input[type=range], select { width: 150px; }
		button { margin-top: 5px; width: 100%; cursor: pointer; background: #333; color: #fff; border: 1px solid #555; padding: 5px; }
		button:hover { background: #555; }
	</style>
</head>
<body>
	<div id="ui">
		<div class="control">
			<label for="mirrors">Mirrors</label>
			<input type="range" id="mirrors" min="1" max="24" value="6">
		</div>
		<div class="control">
			<label for="stampSize">Stamp Size</label>
			<input type="range" id="stampSize" min="5" max="200" value="50">
		</div>
		<div class="control">
			<label for="thickness">Thickness</label>
			<input type="range" id="thickness" min="0.1" max="20" step="0.1" value="2">
		</div>
		<div class="control">
			<label for="pattern">Pattern</label>
			<select id="pattern"></select>
		</div>
		<div class="control">
			<label for="palette">Palette</label>
			<select id="palette"></select>
		</div>
		<div class="control">
			<button id="autoToggle">Toggle Auto Mode</button>
		</div>
		<div class="control">
			<button id="clearBtn">Clear Canvas</button>
		</div>
		<div class="control">
			<button id="exportBtn">Export PNG</button>
		</div>
	</div>
	<canvas id="artboard"></canvas>

<script>
	const CONFIG = { mirrors: 6, patternIndex: 0, paletteIndex: 0, isAuto: false, thickness: 2, stampSize: 50, touchSpeed: 1 };
	const canvas = document.getElementById('artboard');
	const ctx = canvas.getContext('2d');

	let lastUV = null;
	let lastAutoUV = null;
	let ongoingTouches = [];
	let touchColorCounter = 10;

	function resizeCanvas() {
		canvas.width = window.innerWidth;
		canvas.height = window.innerHeight;
		ctx.clearRect(0, 0, canvas.width, canvas.height);
	}
	window.addEventListener('resize', resizeCanvas);
	resizeCanvas();

	const colorPalettes = {
		"Cyberpunk": ["#00FFFF", "#FF00FF", "#00FF00", "#FFFF00", "#FF0000", "#7D00FF"],
		"Galactic Dust": ["#4B0082", "#8A2BE2", "#9370DB", "#C71585", "#DA70D6", "#E6E6FA", "#F0F8FF"],
		"Neon Blue": ["#00FFFF", "#0088FF", "#FFFFFF", "#0000AA"],
		"Cosmic": ["#000033", "#4B0082", "#8A2BE2", "#FFD700", "#F0E68C", "#FFFFFF"],
		"Forest": ["#2F4F2F", "#556B2F", "#8B4513", "#006400", "#228B22", "#6B8E23", "#90BE6D"],
		"Ocean": ["#00C9FF", "#92FE9D", "#1D2B64", "#AFEEEE", "#1E90FF", "#4682B4", "#000080", "#0000CD", "#20B2AA", "#008B8B"],
		"Sunset": ["#FFC371", "#FF5F6D", "#FF8C00", "#DA70D6", "#8A2BE2", "#F2C94C", "#ff5e5e", "#ff9a5e", "#ffd65e", "#fff35e"],
		"Earth Tones": ["#8B4513", "#A0522D", "#B8860B", "#D2B48C", "#F5DEB3", "#8B0000"],
		"Sakura": ["#FFC0CB", "#FFB6C1", "#FF69B4", "#DB7093", "#F5DEB3", "#FFFFFF"],
		"Retro Summer": ["#FFD700", "#FF8C00", "#FF4500", "#E9967A", "#87CEEB", "#ADD8E6", "#00BFFF"],
		"Axial DNA": ["#FF00FF", "#00FFFF", "#FFFF00", "#FF0000", "#00FF00", "#0000FF", "#FF77FF"],
		"Fire & Ice": ["#FF4500", "#FF6347", "#DC143C", "#1E90FF", "#00BFFF", "#87CEEB"],
		"Grayscale": ["#FFFFFF", "#D3D3D3", "#A9A9A9", "#808080", "#696969", "#000000"],
		"Autumn": ["#A0522D", "#D2691E", "#FF4500", "#8B0000", "#FFD700", "#DAA520"],
		"Tundra": ["#F0FFFF", "#ADD8E6", "#B0C4DE", "#778899", "#FFFFFF", "#E6E6FA"],
		"Volcano": ["#FF4500", "#FF0000", "#8B0000", "#2F4F4F", "#696969", "#FFFF00"],
		"Neon Funk": ["#FF00FF", "#00FFFF", "#FFFF00", "#FF007F", "#7F00FF", "#00FF7F"],
		"Pastel": ["#FFB6C1", "#ADD8E6", "#90EE90", "#F0E68C", "#E6E6FA", "#FFDAB9"]
	};

	function shadeHex(color, percent) {
		let f = parseInt(color.slice(1), 16),
			t = percent < 0 ? 0 : 255,
			p = percent < 0 ? percent * -1 : percent,
			R = f >> 16,
			G = f >> 8 & 0x00FF,
			B = f & 0x0000FF;
		return "#" + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 + (Math.round((t - G) * p) + G) * 0x100 + (Math.round((t - B) * p) + B)).toString(16).slice(1);
	}

	const baseNames = Object.keys(colorPalettes);
	baseNames.forEach(name => {
		colorPalettes[name + " Shadow"] = colorPalettes[name].map(c => shadeHex(c, -0.45));
	});

	const paletteNames = Object.keys(colorPalettes);

	const PATTERNS = [
		{
			name: "Standard Line",
			spacing: 0,
			draw: (ctx, x, y, size, speed, pal, p, prev, colorIndex, allTouches, shadowPal) => {
				const color = pal[colorIndex % pal.length];
				ctx.strokeStyle = color;
				ctx.lineWidth = p.thickness;
				if(!prev) {
					ctx.fillStyle = color;
					ctx.beginPath();
					ctx.arc(x, y, p.thickness/2, 0, Math.PI * 2);
					ctx.fill();
					return;
				}
				ctx.beginPath();
				ctx.moveTo(prev.x, prev.y);
				ctx.lineTo(x, y);
				ctx.stroke();
			}
		},
		{
			name: "Golden Spiral V1",
			spacing: 0,
			draw: (ctx, x, y, size, speed, pal, p, prev, colorIndex, allTouches, shadowPal) => {
				const others = allTouches.filter(t => t.colorIndex !== colorIndex);
				let distortion = 0;
				if (others.length > 0) {
					const avgX = others.reduce((acc, t) => acc + t.x, 0) / others.length;
					const avgY = others.reduce((acc, t) => acc + t.y, 0) / others.length;
					const dist = Math.hypot(x - (avgX - (canvas.width/2)), y - (avgY - (canvas.height/2)));
					distortion = dist * 0.002;
				}
				const color = pal[colorIndex % pal.length];
				const a = 0.5;
				const b = 0.1 + distortion;
				const turns = 1 + (p.param3||0) * 5;
				const scale = size * 0.1;

				ctx.beginPath();
				for (let i = 0; i < 360 * turns; i += 5) {
					const angleRad = i * (Math.PI / 180);
					const radius = scale * a * Math.exp(b * angleRad);
					const px = x + radius * Math.cos(angleRad);
					const py = y + radius * Math.sin(angleRad);
					if (i === 0) ctx.moveTo(px, py);
					else ctx.lineTo(px, py);
				}
				ctx.strokeStyle = color;
				ctx.lineWidth = p.thickness;
				ctx.stroke();
			}
		},
		{
			name: "Flower of Life",
			spacing: 0.6,
			draw: (ctx, x, y, size, speed, pal, p, prev, colorIndex, allTouches, shadowPal) => {
				const radius = size * 0.5;
				const sides = 9;
				ctx.lineWidth = p.thickness;

				for (let i = 0; i < sides; i++) {
					const angle = (Math.PI * 2 / sides) * i;
					ctx.strokeStyle = pal[(colorIndex + i) % pal.length];
					ctx.beginPath();
					ctx.arc(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius, radius, 0, Math.PI * 2);
					ctx.stroke();
				}
				ctx.strokeStyle = pal[(colorIndex + sides) % pal.length];
				ctx.beginPath();
				ctx.arc(x, y, radius, 0, Math.PI * 2);
				ctx.stroke();
			}
		},
		{
			name: "Phyllotaxis Web",
			spacing: 0.4,
			draw: (ctx, x, y, size, speed, pal, p, prev, colorIndex, allTouches, shadowPal) => {
				const color = pal[colorIndex % pal.length];
				ctx.fillStyle = color;
				const c = size * 0.05;
				for(let i=0; i<size*2; i++) {
					const a = i * 137.5 * (Math.PI/180);
					const r = c * Math.sqrt(i);
					const px = x + r * Math.cos(a);
					const py = y + r * Math.sin(a);
					ctx.beginPath();
					ctx.arc(px, py, p.thickness, 0, Math.PI*2);
					ctx.fill();
				}
			}
		},
		{
			name: "Pyrotaxis",
			spacing: 0.4,
			draw: (ctx, x, y, size, speed, pal, p, prev, colorIndex, allTouches, shadowPal) => {
				const color = pal[colorIndex % pal.length];
				const c = size * 0.05;
				const cx = ctx.canvas.width / 2;
				const cy = ctx.canvas.height / 2;
				const others = allTouches.filter(t => t.colorIndex !== colorIndex);

				for(let i = 0; i < size * 2; i++) {
					const a = i * 137.5 * (Math.PI / 180);
					const r = c * Math.sqrt(i);
					const px = x + r * Math.cos(a);
					const py = y + r * Math.sin(a);

					ctx.fillStyle = color;
					ctx.beginPath();
					ctx.arc(px, py, p.thickness, 0, Math.PI * 2);
					ctx.fill();

					if (others.length > 0) {
						ctx.strokeStyle = shadowPal[colorIndex % shadowPal.length];
						ctx.lineWidth = Math.max(0.5, p.thickness * 0.5);
						ctx.setLineDash([p.thickness * 2, p.thickness * 2]);
						ctx.beginPath();
						for (const ot of others) {
							const ox = (ot.x - cx) + r * Math.cos(a);
							const oy = (ot.y - cy) + r * Math.sin(a);
							ctx.moveTo(px, py);
							ctx.lineTo(ox, oy);
						}
						ctx.stroke();
						ctx.setLineDash([]);
					}
				}
			}
		},
		{
			name: "Lynchpin Star",
			spacing: 0.5,
			draw: (ctx, x, y, size, speed, pal, p, prev, colorIndex, allTouches, shadowPal) => {
				const color = pal[colorIndex % pal.length];
				ctx.strokeStyle = color;
				ctx.lineWidth = p.thickness;
				const points = 5;
				const outer = size;
				const inner = size * 0.382;
				ctx.beginPath();
				for(let i=0; i<points*2; i++) {
					const radius = i%2===0 ? outer : inner;
					const angle = (i * Math.PI) / points;
					const px = x + radius * Math.cos(angle);
					const py = y + radius * Math.sin(angle);
					if(i===0) ctx.moveTo(px, py);
					else ctx.lineTo(px, py);
				}
				ctx.closePath();
				ctx.stroke();
			}
		},
		{
			name: "Sine Wave",
			spacing: 0,
			draw: (ctx, x, y, size, speed, pal, p, prev, colorIndex, allTouches, shadowPal) => {
				if(!prev) return;
				const color = pal[colorIndex % pal.length];
				ctx.strokeStyle = color;
				ctx.lineWidth = p.thickness;

				const dist = Math.hypot(x-prev.x, y-prev.y);
				const angle = Math.atan2(y-prev.y, x-prev.x);

				ctx.save();
				ctx.translate(prev.x, prev.y);
				ctx.rotate(angle);
				ctx.beginPath();
				for(let i=0; i<dist; i+=2) {
					const wy = Math.sin((i+Date.now()*0.01) * 0.1) * size;
					if(i===0) ctx.moveTo(i, wy);
					else ctx.lineTo(i, wy);
				}
				ctx.stroke();
				ctx.restore();
			}
		},
		{
			name: "Axial DNA Helix",
			spacing: 0,
			draw: (ctx, x, y, size, speed, pal, p, prev, colorIndex, allTouches, shadowPal) => {
				if(!prev) return;
				const col1 = pal[colorIndex % pal.length];
				const col2 = pal[(colorIndex+1) % pal.length];
				const dist = Math.hypot(x-prev.x, y-prev.y);
				const angle = Math.atan2(y-prev.y, x-prev.x);
				ctx.save();
				ctx.translate(prev.x, prev.y);
				ctx.rotate(angle);
				ctx.lineWidth = p.thickness;

				ctx.beginPath();
				ctx.strokeStyle = col1;
				for(let i=0; i<dist; i+=2) {
					const wy = Math.sin(i * 0.05) * size;
					if(i===0) ctx.moveTo(i, wy);
					else ctx.lineTo(i, wy);
				}
				ctx.stroke();

				ctx.beginPath();
				ctx.strokeStyle = col2;
				for(let i=0; i<dist; i+=2) {
					const wy = Math.sin(i * 0.05 + Math.PI) * size;
					if(i===0) ctx.moveTo(i, wy);
					else ctx.lineTo(i, wy);
				}
				ctx.stroke();
				ctx.restore();
			}
		},
		{
			name: "Lorenz Attractor (2D)",
			spacing: 0,
			draw: (ctx, x, y, size, speed, pal, p, prev, colorIndex, allTouches, shadowPal) => {
				const color = pal[colorIndex % pal.length];
				ctx.strokeStyle = color;
				ctx.lineWidth = p.thickness;
				let lx = 0.1, ly = 0, lz = 0;
				const dt = 0.01;
				const scale = size * 0.5;
				ctx.beginPath();
				for(let i=0; i<100; i++) {
					const dx = 10 * (ly - lx);
					const dy = lx * (28 - lz) - ly;
					const dz = lx * ly - (8/3) * lz;
					lx += dx * dt;
					ly += dy * dt;
					lz += dz * dt;
					const px = x + lx * scale;
					const py = y + ly * scale;
					if(i===0) ctx.moveTo(px, py);
					else ctx.lineTo(px, py);
				}
				ctx.stroke();
			}
		},
		{
			name: "Rotating Notch",
			spacing: 0.3,
			draw: (ctx, x, y, size, speed, pal, p, prev, colorIndex, allTouches, shadowPal) => {
				const color = pal[colorIndex % pal.length];
				ctx.strokeStyle = color;
				ctx.lineWidth = p.thickness;
				const time = Date.now() * 0.002;
				ctx.save();
				ctx.translate(x, y);
				ctx.rotate(time);
				ctx.beginPath();
				ctx.moveTo(-size/2, 0);
				ctx.lineTo(size/2, 0);
				ctx.moveTo(size/4, -size/4);
				ctx.lineTo(size/2, 0);
				ctx.lineTo(size/4, size/4);
				ctx.stroke();
				ctx.restore();
			}
		}
	];

	function drawOnTexture(uv, isAuto = false, colorIndex = 0) {
		let prevUV = isAuto ? lastAutoUV : lastUV;
		const currentPaletteName = paletteNames[CONFIG.paletteIndex];
		const pal = colorPalettes[currentPaletteName];

		const shadowPalName = currentPaletteName.includes("Shadow") ? currentPaletteName : currentPaletteName + " Shadow";
		const shadowPal = colorPalettes[shadowPalName] || pal;
		const pat = PATTERNS[CONFIG.patternIndex];

		ctx.lineCap = "round";
		const cx = canvas.width / 2;
		const cy = canvas.height / 2;
		const angleSlice = (Math.PI * 2) / CONFIG.mirrors;

		ctx.shadowColor = shadowPal[colorIndex % shadowPal.length];
		ctx.shadowBlur = CONFIG.thickness * 2;
		ctx.shadowOffsetX = 1;
		ctx.shadowOffsetY = 1;

		for (let i = 0; i < CONFIG.mirrors; i++) {
			ctx.save();
			ctx.translate(cx, cy);
			ctx.rotate(i * angleSlice);
			if (i % 2 === 0) ctx.scale(1, -1);

			pat.draw(
				ctx,
				uv.x - cx,
				uv.y - cy,
				CONFIG.stampSize,
				CONFIG.touchSpeed,
				pal,
				CONFIG,
				prevUV ? {x: prevUV.x - cx, y: prevUV.y - cy} : null,
				colorIndex,
				ongoingTouches,
				shadowPal
			);
			ctx.restore();
		}

		ctx.shadowColor = 'transparent';
		ctx.shadowBlur = 0;
		ctx.shadowOffsetX = 0;
		ctx.shadowOffsetY = 0;

		if (isAuto) lastAutoUV = uv;
		else lastUV = uv;
	}

	canvas.addEventListener('mousedown', e => {
		lastUV = {x: e.offsetX, y: e.offsetY};
		drawOnTexture(lastUV, false, 0);
	});

	canvas.addEventListener('mousemove', e => {
		if (e.buttons !== 1) return;
		const pat = PATTERNS[CONFIG.patternIndex];
		const spacingThresh = (pat.spacing || 0) * CONFIG.stampSize;
		if (spacingThresh > 0 && lastUV) {
			if (Math.hypot(e.offsetX - lastUV.x, e.offsetY - lastUV.y) < spacingThresh) return;
		}
		drawOnTexture({x: e.offsetX, y: e.offsetY}, false, 0);
	});

	canvas.addEventListener("touchstart", e => {
		e.preventDefault();
		for (let i = 0; i < e.changedTouches.length; i++) {
			const t = e.changedTouches[i];
			const newTouch = { identifier: t.identifier, colorIndex: touchColorCounter++, x: t.clientX, y: t.clientY };
			ongoingTouches.push(newTouch);
			lastUV = {x: t.clientX, y: t.clientY};
			drawOnTexture(lastUV, false, newTouch.colorIndex);
		}
	}, {passive: false});

	canvas.addEventListener("touchmove", e => {
		e.preventDefault();
		const pat = PATTERNS[CONFIG.patternIndex];
		const spacingThresh = (pat.spacing || 0) * CONFIG.stampSize;

		for (let i = 0; i < e.changedTouches.length; i++) {
			const t = e.changedTouches[i];
			const idx = ongoingTouches.findIndex(x => x.identifier === t.identifier);
			if (idx >= 0) {
				const tX = t.clientX;
				const tY = t.clientY;

				if (spacingThresh > 0) {
					const dist = Math.hypot(tX - ongoingTouches[idx].x, tY - ongoingTouches[idx].y);
					if (dist < spacingThresh) continue;
				}

				ongoingTouches[idx].x = tX;
				ongoingTouches[idx].y = tY;
				drawOnTexture({x: tX, y: tY}, false, ongoingTouches[idx].colorIndex);
			}
		}
	}, {passive: false});

	canvas.addEventListener("touchend", e => {
		for (let i = 0; i < e.changedTouches.length; i++) {
			const idx = ongoingTouches.findIndex(x => x.identifier === e.changedTouches[i].identifier);
			if (idx >= 0) ongoingTouches.splice(idx, 1);
		}
	});

	const patternSelect = document.getElementById('pattern');
	PATTERNS.forEach((p, i) => {
		const opt = document.createElement('option');
		opt.value = i;
		opt.textContent = p.name;
		patternSelect.appendChild(opt);
	});
	patternSelect.addEventListener('change', e => CONFIG.patternIndex = parseInt(e.target.value));

	const paletteSelect = document.getElementById('palette');
	paletteNames.forEach((p, i) => {
		const opt = document.createElement('option');
		opt.value = i;
		opt.textContent = p;
		paletteSelect.appendChild(opt);
	});
	paletteSelect.addEventListener('change', e => CONFIG.paletteIndex = parseInt(e.target.value));

	document.getElementById('mirrors').addEventListener('input', e => CONFIG.mirrors = parseFloat(e.target.value));
	document.getElementById('stampSize').addEventListener('input', e => CONFIG.stampSize = parseInt(e.target.value));
	document.getElementById('thickness').addEventListener('input', e => CONFIG.thickness = parseFloat(e.target.value));
	document.getElementById('autoToggle').addEventListener('click', () => CONFIG.isAuto = !CONFIG.isAuto);

	document.getElementById('clearBtn').addEventListener('click', () => {
		ctx.clearRect(0, 0, canvas.width, canvas.height);
	});

	document.getElementById('exportBtn').addEventListener('click', () => {
		const dataURL = canvas.toDataURL('image/png');
		const link = document.createElement('a');
		link.download = 'symmetry-art.png';
		link.href = dataURL;
		link.click();
	});

	function animate() {
		if(CONFIG.isAuto) {
			const t = Date.now() * 0.001;
			drawOnTexture({x: (canvas.width/2) + Math.sin(t*2)*100, y: (canvas.height/2) + Math.cos(t*2)*100}, true, 0);
		}
		requestAnimationFrame(animate);
	}
	animate();
</script>
</body>
</html>
