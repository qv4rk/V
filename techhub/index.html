<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Hub | FeistTech</title>
<meta name="description" content="Guides, troubleshooting, and local apps from FeistTech.">
<link rel="stylesheet" href="/site.css">
<style>
  :root { --bg:#0b0c10; --line:#23262f; --text:#e4e2dc; --muted:#8d9099; --gold:#c9a84c; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; }
  main { max-width:1040px; margin:0 auto; padding:56px 16px 40px; }
  h1 { font-family:"Cormorant Garamond",Georgia,serif; font-weight:400; font-size:clamp(32px,5vw,48px); margin:0 0 12px; }
  .lead { color:var(--muted); max-width:60ch; margin:0 0 32px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:16px; background:#10131b; text-decoration:none; color:inherit; display:block; }
  .card:hover { border-color:var(--gold); }
  .card h2 { font-size:18px; margin:0 0 6px; }
  .card p { color:var(--muted); font-size:14px; margin:0; }
  footer { max-width:1040px; margin:0 auto; padding:24px 16px 40px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>Tech Hub</h1>
  <p class="lead">Troubleshooting guides, how-tos, and the catalog of local apps you can run on your own device.</p>
  <div class="cards">
    <a class="card" href="/techhub/support/">
      <h2>Support</h2>
      <p>Android diagnostics, recovery steps, and answers to common questions. More guides added as people ask.</p>
    </a>
  </div>
</main>
<footer>FeistTech · <a href="/">Home</a> · <a href="mailto:info@feisttech.com">info@feisttech.com</a></footer>
</body>
</html>
