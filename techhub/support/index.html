<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support · Tech Hub | FeistTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d1117;
      --bg-surface: #161b22;
      --bg-card: #1c2128;
      --border-subtle: #30363d;
      --border-accent: #388bfd;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-amber: #d29922;
      --accent-red: #f85149;
      --code-bg: #090d13;
      --code-border: #21262d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* Top Nav Brand Header */
    .site-nav {
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .brand-badge {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(88, 166, 255, 0.3);
    }
  </style>
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/techhub/" class="brand-title">FeistTech <span class="brand-badge">Tech Hub</span></a>
    </div>
  </header>
  <main class="container" style="max-width:1200px;margin:0 auto;padding:32px 24px;">
    <p>The full page content is being deployed. This is a temporary marker while the complete HTML is written.</p>
  </main>
</body>
</html>
