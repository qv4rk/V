<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 240px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111;
    color: #eee;
    padding: 14px;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 10px;
    color: #9cf;
  }
  #status {
    font-size: 12px;
    color: #999;
    margin-bottom: 10px;
    min-height: 16px;
  }
  #status.recording { color: #ff6b6b; }
  #timer {
    font-family: ui-monospace, monospace;
    font-size: 20px;
    text-align: center;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 10px;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 6px;
  }
  #startBtn { background: #2e7d32; color: #fff; }
  #startBtn:disabled { background: #333; color: #777; cursor: default; }
  #stopBtn { background: #c62828; color: #fff; }
  #stopBtn:disabled { background: #333; color: #777; cursor: default; }
  #hint {
    font-size: 11px;
    color: #777;
    line-height: 1.4;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <h1>Doc Audio Capture</h1>
  <div id="status">Idle</div>
  <div id="timer">00:00</div>
  <button id="startBtn">● Start Capture</button>
  <button id="stopBtn" disabled>■ Stop &amp; Save</button>
  <div id="hint">Press play on the doc's read-aloud voice first, then Start. The tab keeps playing normally — this just also saves what it plays.</div>
  <script src="popup.js"></script>
</body>
</html>
