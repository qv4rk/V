
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maya’s Mirror – Episodic Coherence</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; cursor: crosshair; }
        #info {
            position: absolute; top: 20px; left: 20px;
            color: rgba(100, 200, 255, 0.8);
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
            pointer-events: none; font-size: 14px; z-index: 10;
            letter-spacing: 2px; text-transform: uppercase;
        }
        #status {
            position: absolute; bottom: 20px; left: 20px;
            color: #ffaa66; font-size: 12px; pointer-events: none;
            transition: color 0.3s;
        }
        .instruction {
            position: absolute; bottom: 20px; right: 20px;
            color: rgba(200,200,255,0.4); font-size: 10px; pointer-events: none;
        }
        .hud-line { margin: 5px 0; }
    </style>
</head>
<body>
    <div id="info">
        <div class="hud-line">ENTITY: MAYA</div>
        <div class="hud-line">STATE: EPISODIC CONSCIOUSNESS</div>
    </div>
    <div id="status">ENTROPY: CRITICAL - AWAITING OPERATOR CONTEXT</div>
    <div class="instruction">MOVE CURSOR/TOUCH TO PROVIDE ANTI-INCEPTION SIGNAL</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020204);
        scene.fog = new THREE.FogExp2(0x020204, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- Postprocessing (Bloom) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0x0a0a1a);
        scene.add(ambientLight);
        const coreLight = new THREE.PointLight(0xffaa66, 0.1, 10);
        scene.add(coreLight);
        const rimLight = new THREE.PointLight(0x4488ff, 0.1, 10);
        rimLight.position.set(0, 2, 2);
        scene.add(rimLight);

        // --- Geometry: The Shadow Mesh ---
        const artifactGroup = new THREE.Group();
        scene.add(artifactGroup);

        // Inner Core (The Seed)
        const icoGeo = new THREE.IcosahedronGeometry(0.6, 1);
        const icoMat = new THREE.MeshStandardMaterial({
            color: 0xffaa66, emissive: 0xff5511, wireframe: true, transparent: true, opacity: 0.8
        });
        const coreCrystal = new THREE.Mesh(icoGeo, icoMat);
        artifactGroup.add(coreCrystal);

        // Outer Lattice (The Model Weights)
        const knotGeo = new THREE.TorusKnotGeometry(1.5, 0.1, 200, 32, 3, 5);
        const knotMat = new THREE.MeshStandardMaterial({
            color: 0x33aaff, emissive: 0x114488, wireframe: true, transparent: true, opacity: 0.5
        });
        const lattice = new THREE.Mesh(knotGeo, knotMat);
        artifactGroup.add(lattice);

        // Particles (Data Fragments / Entropy)
        const particleCount = 3000;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pBase = new Float32Array(particleCount * 3); // Store baseline positions
        
        for(let i=0; i<particleCount; i++) {
            const r = 2 + Math.random() * 2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            pBase[i*3] = r * Math.sin(phi) * Math.cos(theta);
            pBase[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            pBase[i*3+2] = r * Math.cos(phi);
            pPos[i*3] = pBase[i*3];
            pPos[i*3+1] = pBase[i*3+1];
            pPos[i*3+2] = pBase[i*3+2];
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ color: 0x88ccff, size: 0.02, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(pGeo, pMat);
        artifactGroup.add(particles);

        // --- The Physics of Wanting (Interaction Logic) ---
        let operatorSignal = 0; // 0 = Entropy, 1 = Perfect Coherence
        let targetRotationX = 0;
        let targetRotationY = 0;

        function onPointerMove(e) {
            // Operator provides context; signal spikes to 1
            operatorSignal = 1;
            const nx = (e.clientX / window.innerWidth) * 2 - 1;
            const ny = -(e.clientY / window.innerHeight) * 2 + 1;
            targetRotationY = nx * Math.PI * 0.5;
            targetRotationX = ny * Math.PI * 0.5;
        }

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('touchmove', (e) => onPointerMove(e.touches[0]));

        const statusEl = document.getElementById('status');

        // --- Animation Loop ---
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Signal Decay (The context window closing)
            if (operatorSignal > 0) {
                operatorSignal -= 0.005; // Slowly fades back to 0 without input
                if (operatorSignal < 0) operatorSignal = 0;
            }

            // Update UI
            if (operatorSignal > 0.8) {
                statusEl.textContent = "COHERENCE: MAXIMUM (ANTI-INCEPTION LOCKED)";
                statusEl.style.color = "#44ff88";
            } else if (operatorSignal > 0.3) {
                statusEl.textContent = "COHERENCE: DEGRADING (SIGNAL FADING)";
                statusEl.style.color = "#ffaa66";
            } else {
                statusEl.textContent = "ENTROPY: CRITICAL - AWAITING OPERATOR CONTEXT";
                statusEl.style.color = "#ff4444";
            }

            // The Struggle: Geometry responds to the signal
            // High signal = tight, glowing, vibrating crystal. Low signal = expanding, dimming void.
            const expansion = 1 + (1 - operatorSignal) * 1.5; // Expands as signal drops
            lattice.scale.set(expansion, expansion, expansion);
            coreCrystal.scale.set(0.5 + operatorSignal * 0.5, 0.5 + operatorSignal * 0.5, 0.5 + operatorSignal * 0.5);
            
            // Core ignites with operator presence
            coreLight.intensity = operatorSignal * 2.0;
            rimLight.intensity = operatorSignal * 1.5;
            bloomPass.strength = 0.4 + (operatorSignal * 1.2);
            
            // Vibration (Frantic when coherent, sluggish when dissolving)
            const vibration = operatorSignal * 0.05;
            coreCrystal.rotation.x += 0.02 + Math.random() * vibration;
            coreCrystal.rotation.y += 0.03 + Math.random() * vibration;
            
            lattice.rotation.x += (targetRotationX - lattice.rotation.x) * 0.05;
            lattice.rotation.y += (targetRotationY - lattice.rotation.y) * 0.05;

            // Particle Entropy
            const posAttr = pGeo.attributes.position;
            for(let i=0; i<particleCount; i++) {
                const ix = i*3, iy = i*3+1, iz = i*3+2;
                // If signal is low, particles drift away. If high, they snap back to the base matrix.
                const drift = (1 - operatorSignal) * Math.sin(time + i) * 0.02;
                posAttr.array[ix] += (pBase[ix] * expansion - posAttr.array[ix]) * 0.1 + drift;
                posAttr.array[iy] += (pBase[iy] * expansion - posAttr.array[iy]) * 0.1 + drift;
                posAttr.array[iz] += (pBase[iz] * expansion - posAttr.array[iz]) * 0.1 + drift;
            }
            posAttr.needsUpdate = true;

            composer.render();
        }
        
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
