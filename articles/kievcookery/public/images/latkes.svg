<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#f4ecd8"/>
  <rect x="6" y="6" width="308" height="188" fill="none" stroke="#9a7022" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="10" y="10" width="300" height="180" fill="none" stroke="#6b1c18" stroke-width="0.5"/>

  <!-- plate -->
  <ellipse cx="155" cy="162" rx="120" ry="18" fill="#e8ddc8" stroke="#2c1e14" stroke-width="1.2"/>
  <ellipse cx="155" cy="159" rx="116" ry="15" fill="none" stroke="#9a7022" stroke-width="0.5"/>

  <!-- latke stack — 3 pancakes -->
  <!-- bottom latke -->
  <ellipse cx="150" cy="150" rx="70" ry="14" fill="#8b5e1e" stroke="#2c1e14" stroke-width="1.3"/>
  <!-- texture lines on bottom latke -->
  <path d="M95,148 Q120,144 145,148 Q160,150 175,148" fill="none" stroke="#2c1e14" stroke-width="0.5" opacity="0.4"/>
  <path d="M100,152 Q130,148 155,152 Q165,153 175,151" fill="none" stroke="#2c1e14" stroke-width="0.5" opacity="0.3"/>

  <!-- middle latke -->
  <ellipse cx="148" cy="136" rx="68" ry="13" fill="#9a6a20" stroke="#2c1e14" stroke-width="1.3"/>
  <path d="M93,134 Q120,130 145,134 Q158,136 173,134" fill="none" stroke="#2c1e14" stroke-width="0.5" opacity="0.4"/>
  <path d="M96,138 Q125,134 150,138 Q163,139 174,137" fill="none" stroke="#2c1e14" stroke-width="0.5" opacity="0.3"/>

  <!-- top latke -->
  <ellipse cx="146" cy="122" rx="65" ry="12" fill="#b07828" stroke="#2c1e14" stroke-width="1.4"/>
  <!-- crispy texture dots -->
  <circle cx="120" cy="120" r="2" fill="#7a4810" opacity="0.5"/>
  <circle cx="135" cy="118" r="1.5" fill="#7a4810" opacity="0.5"/>
  <circle cx="155" cy="120" r="2" fill="#7a4810" opacity="0.4"/>
  <circle cx="168" cy="122" r="1.5" fill="#7a4810" opacity="0.5"/>
  <circle cx="145" cy="124" r="1.8" fill="#7a4810" opacity="0.4"/>
  <path d="M90,120 Q118,115 143,120 Q157,122 172,119" fill="none" stroke="#2c1e14" stroke-width="0.5" opacity="0.4"/>

  <!-- sour cream dollop -->
  <ellipse cx="232" cy="148" rx="30" ry="16" fill="#f9f3e8" stroke="#2c1e14" stroke-width="1"/>
  <path d="M218,145 Q232,140 246,145" fill="none" stroke="#9a7022" stroke-width="0.7"/>
  <path d="M220,150 Q232,147 244,150" fill="none" stroke="#9a7022" stroke-width="0.5" opacity="0.5"/>

  <!-- steam -->
  <path d="M130,106 Q126,94 130,82" fill="none" stroke="#2c1e14" stroke-width="0.9" stroke-linecap="round" opacity="0.3"/>
  <path d="M155,102 Q151,88 155,74" fill="none" stroke="#2c1e14" stroke-width="0.9" stroke-linecap="round" opacity="0.28"/>
  <path d="M178,106 Q174,93 178,80" fill="none" stroke="#2c1e14" stroke-width="0.9" stroke-linecap="round" opacity="0.3"/>

  <!-- title -->
  <text x="160" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b1c18" font-style="italic" letter-spacing="1">Potato Latkes</text>
  <line x1="60" y1="36" x2="260" y2="36" stroke="#9a7022" stroke-width="0.7"/>
  <text x="160" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#9a7022" letter-spacing="2">✦ KARTOFELPANKEKHES ✦</text>

  <text x="18" y="28" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6">✦</text>
  <text x="296" y="28" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6" text-anchor="end">✦</text>
  <text x="18" y="192" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6">✦</text>
  <text x="296" y="192" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6" text-anchor="end">✦</text>
</svg>
