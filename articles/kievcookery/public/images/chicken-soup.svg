<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#f4ecd8"/>
  <rect x="6" y="6" width="308" height="188" fill="none" stroke="#9a7022" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="10" y="10" width="300" height="180" fill="none" stroke="#6b1c18" stroke-width="0.5"/>

  <!-- bowl outer shape -->
  <path d="M60,90 Q60,168 160,168 Q260,168 260,90 Z" fill="#e8c87a" stroke="#2c1e14" stroke-width="1.5"/>
  <!-- bowl rim ellipse -->
  <ellipse cx="160" cy="90" rx="100" ry="20" fill="#f0d890" stroke="#2c1e14" stroke-width="1.5"/>
  <!-- bowl inner surface -->
  <ellipse cx="160" cy="90" rx="96" ry="17" fill="#e8c060"/>
  <!-- broth depth shading -->
  <path d="M70,100 Q70,158 160,158 Q250,158 250,100" fill="#d4a840" stroke="none"/>

  <!-- matzo ball 1 -->
  <circle cx="130" cy="100" r="22" fill="#f0e0b0" stroke="#2c1e14" stroke-width="1.3"/>
  <path d="M118,95 Q130,90 142,95" fill="none" stroke="#2c1e14" stroke-width="0.6" opacity="0.5"/>
  <path d="M115,103 Q130,97 145,103" fill="none" stroke="#2c1e14" stroke-width="0.5" opacity="0.4"/>
  <circle cx="125" cy="96" r="1.5" fill="#2c1e14" opacity="0.2"/>

  <!-- matzo ball 2 -->
  <circle cx="196" cy="104" r="18" fill="#f0dca8" stroke="#2c1e14" stroke-width="1.3"/>
  <path d="M185,100 Q196,95 207,100" fill="none" stroke="#2c1e14" stroke-width="0.6" opacity="0.5"/>
  <circle cx="192" cy="100" r="1.2" fill="#2c1e14" opacity="0.2"/>

  <!-- dill sprigs -->
  <path d="M155,86 Q150,78 145,70" fill="none" stroke="#5a7a3a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M145,70 Q141,64 138,60" fill="none" stroke="#5a7a3a" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="138" cy="59" r="3" fill="#6a8a4a" opacity="0.8"/>
  <circle cx="143" cy="66" r="2.5" fill="#6a8a4a" opacity="0.7"/>
  <circle cx="148" cy="73" r="2" fill="#6a8a4a" opacity="0.7"/>

  <!-- steam wisps -->
  <path d="M120,68 Q116,56 120,44" fill="none" stroke="#2c1e14" stroke-width="1" stroke-linecap="round" opacity="0.25"/>
  <path d="M160,62 Q156,49 160,36" fill="none" stroke="#2c1e14" stroke-width="1" stroke-linecap="round" opacity="0.22"/>
  <path d="M200,66 Q196,54 200,42" fill="none" stroke="#2c1e14" stroke-width="1" stroke-linecap="round" opacity="0.25"/>

  <!-- bowl base/foot -->
  <ellipse cx="160" cy="168" rx="60" ry="8" fill="#c8a850" stroke="#2c1e14" stroke-width="1"/>
  <rect x="140" y="168" width="40" height="6" fill="#b89040" stroke="#2c1e14" stroke-width="1"/>
  <ellipse cx="160" cy="174" rx="30" ry="5" fill="#a88030" stroke="#2c1e14" stroke-width="1"/>

  <!-- title -->
  <text x="160" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b1c18" font-style="italic" letter-spacing="1">Golden Chicken Soup</text>
  <line x1="60" y1="36" x2="260" y2="36" stroke="#9a7022" stroke-width="0.7"/>
  <text x="160" y="49" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#9a7022" letter-spacing="2">✦ MIT KNEYDLAKH ✦</text>

  <text x="18" y="28" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6">✦</text>
  <text x="296" y="28" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6" text-anchor="end">✦</text>
  <text x="18" y="192" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6">✦</text>
  <text x="296" y="192" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6" text-anchor="end">✦</text>
</svg>
