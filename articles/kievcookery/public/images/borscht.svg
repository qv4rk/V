<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#f4ecd8"/>
  <rect x="6" y="6" width="308" height="188" fill="none" stroke="#9a7022" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="10" y="10" width="300" height="180" fill="none" stroke="#6b1c18" stroke-width="0.5"/>

  <!-- bowl outer -->
  <path d="M55,95 Q55,170 160,170 Q265,170 265,95 Z" fill="#8b1a3a" stroke="#2c1e14" stroke-width="1.5"/>
  <!-- bowl rim -->
  <ellipse cx="160" cy="95" rx="105" ry="20" fill="#b02040" stroke="#2c1e14" stroke-width="1.5"/>
  <!-- soup surface -->
  <ellipse cx="160" cy="95" rx="101" ry="17" fill="#9a1830"/>
  <!-- depth shading -->
  <path d="M65,105 Q65,158 160,158 Q255,158 255,105" fill="#7a1228"/>
  <!-- light reflection on soup -->
  <ellipse cx="130" cy="92" rx="30" ry="8" fill="#c02848" opacity="0.4"/>

  <!-- sour cream swirl -->
  <circle cx="160" cy="100" r="28" fill="none" stroke="#f4ecd8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="160" cy="100" r="16" fill="#f9f3e8" stroke="none"/>
  <path d="M160,84 Q172,100 160,116 Q148,100 160,84 Z" fill="#f4ecd8" opacity="0.6"/>
  <!-- spiral center -->
  <path d="M160,92 Q168,100 160,108 Q152,100 160,92" fill="none" stroke="#e8dcc8" stroke-width="1.5"/>

  <!-- dill sprig -->
  <path d="M188,82 Q192,74 196,66" fill="none" stroke="#5a7a3a" stroke-width="1.5"/>
  <circle cx="196" cy="65" r="3" fill="#6a8a4a" opacity="0.9"/>
  <circle cx="192" cy="71" r="2.5" fill="#6a8a4a" opacity="0.8"/>
  <circle cx="188" cy="78" r="2" fill="#6a8a4a" opacity="0.7"/>

  <!-- bowl foot/base -->
  <ellipse cx="160" cy="170" rx="65" ry="9" fill="#6a1430" stroke="#2c1e14" stroke-width="1"/>
  <rect x="138" y="170" width="44" height="6" fill="#601228" stroke="#2c1e14" stroke-width="1"/>
  <ellipse cx="160" cy="176" rx="32" ry="5" fill="#581020" stroke="#2c1e14" stroke-width="1"/>

  <!-- steam -->
  <path d="M135,73 Q131,60 135,47" fill="none" stroke="#2c1e14" stroke-width="1" stroke-linecap="round" opacity="0.25"/>
  <path d="M160,68 Q156,54 160,40" fill="none" stroke="#2c1e14" stroke-width="1" stroke-linecap="round" opacity="0.22"/>
  <path d="M185,72 Q181,59 185,46" fill="none" stroke="#2c1e14" stroke-width="1" stroke-linecap="round" opacity="0.25"/>

  <!-- title -->
  <text x="160" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b1c18" font-style="italic" letter-spacing="1">Imperial Beet Borscht</text>
  <line x1="55" y1="36" x2="265" y2="36" stroke="#9a7022" stroke-width="0.7"/>
  <text x="160" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#9a7022" letter-spacing="2">✦ DER ROYTE BORSCH ✦</text>

  <text x="18" y="28" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6">✦</text>
  <text x="296" y="28" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6" text-anchor="end">✦</text>
  <text x="18" y="192" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6">✦</text>
  <text x="296" y="192" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6" text-anchor="end">✦</text>
</svg>
