<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#f4ecd8"/>
  <!-- decorative border -->
  <rect x="6" y="6" width="308" height="188" fill="none" stroke="#9a7022" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="10" y="10" width="300" height="180" fill="none" stroke="#6b1c18" stroke-width="0.5"/>

  <!-- plate ellipse -->
  <ellipse cx="160" cy="158" rx="130" ry="22" fill="#e8ddc8" stroke="#2c1e14" stroke-width="1.2"/>
  <ellipse cx="160" cy="155" rx="128" ry="20" fill="none" stroke="#9a7022" stroke-width="0.5"/>

  <!-- three rolled blintzes -->
  <!-- back blintz -->
  <rect x="82" y="112" width="82" height="28" rx="14" fill="#c8a86a" stroke="#2c1e14" stroke-width="1.2"/>
  <line x1="96" y1="112" x2="96" y2="140" stroke="#2c1e14" stroke-width="0.6" opacity="0.4"/>
  <line x1="150" y1="112" x2="150" y2="140" stroke="#2c1e14" stroke-width="0.6" opacity="0.4"/>
  <!-- seam lines on back blintz -->
  <path d="M82,126 Q123,120 164,126" fill="none" stroke="#2c1e14" stroke-width="0.7" opacity="0.5"/>

  <!-- middle blintz -->
  <rect x="100" y="124" width="82" height="28" rx="14" fill="#d4a85a" stroke="#2c1e14" stroke-width="1.4"/>
  <line x1="114" y1="124" x2="114" y2="152" stroke="#2c1e14" stroke-width="0.6" opacity="0.4"/>
  <line x1="168" y1="124" x2="168" y2="152" stroke="#2c1e14" stroke-width="0.6" opacity="0.4"/>
  <path d="M100,138 Q141,132 182,138" fill="none" stroke="#2c1e14" stroke-width="0.7" opacity="0.5"/>

  <!-- front blintz -->
  <rect x="118" y="136" width="82" height="28" rx="14" fill="#c8944a" stroke="#2c1e14" stroke-width="1.5"/>
  <line x1="132" y1="136" x2="132" y2="164" stroke="#2c1e14" stroke-width="0.6" opacity="0.4"/>
  <line x1="186" y1="136" x2="186" y2="164" stroke="#2c1e14" stroke-width="0.6" opacity="0.4"/>
  <path d="M118,150 Q159,144 200,150" fill="none" stroke="#2c1e14" stroke-width="0.7" opacity="0.5"/>

  <!-- sour cream dollop -->
  <ellipse cx="252" cy="150" rx="22" ry="12" fill="#f9f3e8" stroke="#2c1e14" stroke-width="1"/>
  <path d="M242,148 Q252,143 262,148" fill="none" stroke="#9a7022" stroke-width="0.7"/>

  <!-- steam wisps -->
  <path d="M130,105 Q126,94 130,83" fill="none" stroke="#2c1e14" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <path d="M159,100 Q155,87 159,74" fill="none" stroke="#2c1e14" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <path d="M188,105 Q184,92 188,79" fill="none" stroke="#2c1e14" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

  <!-- title -->
  <text x="160" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b1c18" font-style="italic" letter-spacing="1">Sweet Potato Blintzes</text>
  <line x1="60" y1="38" x2="260" y2="38" stroke="#9a7022" stroke-width="0.7"/>
  <text x="160" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#9a7022" letter-spacing="2">✦ KARTOFFL BLINTZEN ✦</text>

  <!-- corner ornaments -->
  <text x="18" y="28" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6">✦</text>
  <text x="296" y="28" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6" text-anchor="end">✦</text>
  <text x="18" y="192" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6">✦</text>
  <text x="296" y="192" font-family="Georgia, serif" font-size="10" fill="#9a7022" opacity="0.6" text-anchor="end">✦</text>
</svg>
