<div class="chapter-header">
    <div class="chapter-number">Chapter 1</div>
    <h1>The Spectrum Belongs to Someone</h1>
</div>

<p>There's a document you should read sometime, assuming you're the kind of person who finds bureaucratic artifacts fascinating or at least revealing of how power actually works in the modern world. It's called the FCC Table of Frequency Allocations and if you were to print it out—though nobody does that anymore, obviously—it would run to something like 300 pages of dense technical specifications, color-coded bands, territorial markings showing who gets to transmit what and where and under which precise conditions. Think of it like a political map except instead of showing countries with borders you can see and cross and argue about, it shows invisible territories carved up and fought over just as fiercely. Maybe more so because most people don't even know they exist.</p>

<p>The whole electromagnetic spectrum from about 3 Hz all the way up past 300 GHz and then higher into ranges we're still figuring out how to use commercially has been allocated. Every single frequency band has been assigned to something—maritime navigation, aviation communication, amateur radio enthusiasts, weather satellites tracking hurricanes, mobile phone carriers trying to sell you unlimited data plans, deep space research listening for signals from places so far away the light took billions of years to reach us. The Federal Communications Commission in the US handles civilian spectrum, the National Telecommunications and Information Administration deals with federal government use including military applications, and globally the International Telecommunication Union coordinates everything so signals don't devour each other in interference chaos.</p>

<h2>Who Actually Owns This</h2>

<p>Technically the answer is nobody owns the spectrum, it's a commons held in trust by the government for public benefit. Legally that's the framework established back in 1927 with the Radio Act and then formalized in the Communications Act of 1934 which said broadcasters don't own frequencies, they hold licenses that can be renewed or revoked depending on whether they're serving "public interest, convenience, and necessity." Practically though, the answer is whoever can afford the auction bids and maintain infrastructure and survive the inevitable litigation that comes with operating in contested electromagnetic territory.</p>

<p>When analog television broadcasting ended and freed up the 700 MHz band, the FCC held spectrum auctions in 2008 that brought in about $19.6 billion. Wireless carriers paid that sum for the legal right to occupy specific frequency ranges in specific geographic areas for specific time periods. Think about that for a second—almost twenty billion dollars for permission to use invisible wavelengths that don't physically exist in any material sense but are absolutely essential for modern telecommunications infrastructure.</p>

<p>FirstNet represents something slightly different in this landscape. Launched around 2020 by the Department of Commerce, it's a dedicated public safety network operating on the Lower 700 MHz D Block reserved exclusively for police, fire departments, emergency medical services. When a tornado touches down or there's an active shooter situation, law enforcement devices connecting through FirstNet get absolute priority. Everyone else waits. The architecture here is straightforward—during emergencies, public safety needs take precedence over your ability to stream video or check social media, which makes sense until you start thinking about how emergency states can be extended or declared for increasingly broad reasons.</p>

<p>The 6 GHz expansion approved around 2020 opened up new frequencies for Wi-Fi use, basically unlicensed spectrum where anyone can operate as long as they follow power limits and technical standards. Suddenly routers and laptops and smart home devices got access to bandwidth that hadn't been available before. The spectrum itself didn't change—radio waves don't care about regulatory status—but the rules governing who can transmit at what power with which equipment shifted overnight.</p>

<h2>How Military Needs Became Everyone's Reality</h2>

<p>During the Cold War, frequency allocation was strategic in ways most people don't appreciate now. The military needed certain UHF bands for radar systems, civilian aviation needed precise frequencies for navigation to avoid disasters, there were concerns about the Soviets listening for missile launch signatures on specific frequencies though how much of that was real versus bureaucratic justification for budget increases is hard to say from this distance. Spectrum allocation became part of deterrence strategy—you needed to control your electromagnetic environment to maintain operational security.</p>

<p>AM radio sits at 535-1705 kHz, FM at 88-108 MHz, not because those frequencies have some inherent property that makes them perfect for radio broadcasting necessarily but because those bands were negotiated, fought over, claimed through a mix of technical reasoning and political pressure. The broadcast lobby pushed the FCC to protect FM from interference, aeronautical industries demanded precision in their allocated ranges, everyone had interests to defend and constituencies to serve.</p>

<p>What stands out when you look at the historical record is the degree of control being exercised. The government asserted through legislation that spectrum is a public resource held in trust, which sounds democratic and reasonable until you realize it means centralized authority deciding who gets to use which frequencies for what purposes. Broadcasters holding licenses that could be revoked gave the state enormous power over mass media, though this power was rarely exercised directly in ways that would cause public outcry.</p>

<p>By the 1990s the system had shifted from comparative hearings where the FCC judged applicants based on who would serve the public interest better, to spectrum auctions where money became the deciding factor. Efficiency replaced democratic allocation—whoever could pay the most got the frequencies. You can debate whether that's good policy or regulatory capture by commercial interests, but the outcome is clear enough: control over spectrum shifted increasingly toward large telecommunications corporations with the capital to compete in billion-dollar auctions.</p>

<h2>The Thing Nobody Emphasizes</h2>

<p>Here's what doesn't get discussed much in FCC documents or telecommunications policy papers: the exact same frequencies that enable beneficial communication can, with different equipment and modulation and power levels, penetrate walls to map building interiors, cause neural disruption in human targets, destroy electronic infrastructure. A frequency allocated to weather radar could be repurposed for surveillance. Cellular transmission frequencies with modified antenna designs become through-wall imaging systems. Medical imaging frequencies at high enough power and specific modulation cause measurable biological effects.</p>

<p>The NTIA manages federal spectrum separately from the FCC's civilian spectrum, which creates two parallel systems—one public, one classified. What military and intelligence agencies do with their allocated frequencies often isn't public record. When there's overlap or conflict between civilian and federal use, negotiations happen behind closed doors.</p>

<p>Havana Syndrome emerged in 2016 when US embassy personnel in Cuba started reporting sudden-onset headaches, vertigo, cognitive problems, hearing loss. Initial explanations blamed "acoustic attacks" which sounded less threatening than the reality, which multiple investigations eventually pointed toward: microwave radiation in the 10-20 GHz range, possibly modulated to produce what's called microwave auditory effect where pulsed RF energy causes the sensation of sounds perceived internally without actual acoustic waves present. This had been documented since Allan Frey's experiments in 1962 exposing mice to pulsed microwaves and observing startle responses.</p>

<p>The link to Russia's GRU Unit 29155 came from counterintelligence analysis. The tool was directed energy at frequencies that FCC regulates for civilian use. The damage was permanent neurological injury. The initial cover story was acoustic weapons because that sounded less technologically sophisticated and therefore less threatening diplomatically. For five years the US government wouldn't officially acknowledge microwave as the mechanism even though the National Academies had confirmed it in December 2020, four years after the incidents began.</p>

<h2>Where This Leaves Us</h2>

<p>Spectrum allocation matters because it determines infrastructure, and infrastructure determines power. The carriers who won those 700 MHz auctions control significant pieces of the network everyone depends on. They decide who connects, at what cost, under what restrictions. FirstNet gives law enforcement priority access during emergencies, which means the definition of emergency becomes critical.</p>

<p>The pattern repeats across technologies—military applications lead to civilian adoption which leads to commercial consolidation which concentrates power. The FCC table of allocations is available online, you can read all 300 pages if you want, see exactly which frequencies got assigned to what uses. It's all documented, all bureaucratically proper, all operating within legal frameworks established decades ago.</p>

<p>That documentation is the power. Every frequency spoken for before the technology using it was invented. Every use regulated. Every possibility already constrained by decisions made by people most of us never elected to positions most of us don't know exist. That's the foundation modern control runs on—invisible, bureaucratic, absolute.</p>
