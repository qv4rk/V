<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #050403;
  --bronze:  #a67041;
  --br-dk:   #3e2208;
  --br-lt:   #d4a373;
  --patina:  #438f7e;
  --gold:    #f0c38e;
  --red:     #c0392b;
  --muted:   #6b5a4a;
  
  /* Gemstones for planets */
  --sun:     #ffd700;
  --moon:    #e0e0e0;
  --mercury: #40e0d0; /* Turquoise */
  --venus:   #2a52be; /* Lapis Lazuli */
  --mars:    #c1440e; /* Red Jasper */
  --jupiter: #ffffff; /* Rock Crystal */
  --saturn:  #2f2f2f; /* Obsidian */
}
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; background:var(--bg); color:var(--br-lt); font-family:'Share Tech Mono',monospace; overflow:hidden; touch-action:none; }

/* ── HUD OVERLAYS ── */
header {
  position: absolute; top: 0; left: 0; width: 100%; z-index: 10;
  text-align:center; padding:15px 20px;
  background:linear-gradient(to bottom, rgba(5,4,3,0.95), rgba(5,4,3,0));
  pointer-events: none;
}
header h1 { font-family:'Cinzel',serif; font-size:clamp(16px,4vw,28px); color:var(--gold); letter-spacing:4px; margin-bottom:4px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
header p { font-size:10px; color:var(--patina); letter-spacing:3px; text-shadow: 0 1px 5px #000; }

#controls {
  position: absolute; bottom: 0; left: 0; width: 100%; z-index: 10;
  background: rgba(10, 6, 4, 0.85); border-top: 1px solid var(--br-dk);
  padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  backdrop-filter: blur(5px);
}

.mode-bar { display: flex; gap: 5px; margin-bottom: 5px; }
.mdbtn {
  background: var(--bg); border: 1px solid var(--bronze); color: var(--gold);
  padding: 6px 12px; font-family: inherit; font-size: 10px; letter-spacing: 2px;
  cursor: pointer; text-transform: uppercase; transition: all 0.2s;
}
.mdbtn.active { background: var(--patina); color: #fff; border-color: #fff; box-shadow: 0 0 10px rgba(67, 143, 126, 0.5); }

.crank-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 600px; }
.crank-btn {
  background: var(--br-dk); border: 1px solid var(--bronze); color: var(--gold);
  padding: 8px 12px; font-family: inherit; font-size: 11px; cursor: pointer;
  letter-spacing: 1px; flex: 1; transition: background 0.2s; min-width: 70px; text-align: center;
}
.crank-btn:hover { background: var(--bronze); color: #000; }
.crank-btn.active { background: var(--gold); color: #000; border-color: #fff; }

.info-panel {
  position: absolute; top: 90px; left: 15px; z-index: 10;
  background: rgba(10, 6, 4, 0.7); border-left: 2px solid var(--patina);
  padding: 15px; backdrop-filter: blur(4px); pointer-events: none;
  min-width: 220px;
}
.info-title { font-family: 'Cinzel', serif; font-size: 12px; color: var(--gold); letter-spacing: 2px; margin-bottom: 10px; border-bottom: 1px solid var(--br-dk); padding-bottom: 4px; }
.dr { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 6px; letter-spacing: 1px;}
.dr .lbl { color: var(--muted); }
.dr .val { color: var(--br-lt); }

/* ── CANVAS ── */
#dial-canvas { display: block; width: 100vw; height: 100vh; }

.retrograde-alert { color: var(--red); font-size: 9px; margin-top: 8px; display: none; }
.retrograde-alert.show { display: block; animation: pulse 2s infinite; }
@keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; text-shadow: 0 0 8px var(--red); } 100% { opacity: 0.5; } }

</style>
</head>
<body>

<header>
  <h1>THE COSMOS WINDOW</h1>
  <p>HELLENISTIC GEOCENTRIC PLANETARIUM · FRONT DIAL</p>
</header>

<div class="info-panel">
  <div class="info-title">GEAR TRAIN OUTPUT</div>
  <div class="dr"><span class="lbl">EPOCH</span><span class="val" id="i-epoch">000000 TICKS</span></div>
  <div class="dr"><span class="lbl">SUN (YEAR)</span><span class="val" id="i-sun">0.0°</span></div>
  <div class="dr"><span class="lbl">MOON</span><span class="val" id="i-moon">0.0°</span></div>
  <div class="dr"><span class="lbl">MERCURY</span><span class="val" id="i-mer">0.0°</span></div>
  <div class="dr"><span class="lbl">VENUS</span><span class="val" id="i-ven">0.0°</span></div>
  <div class="dr"><span class="lbl">MARS</span><span class="val" id="i-mar">0.0°</span></div>
  <div class="dr"><span class="lbl">JUPITER</span><span class="val" id="i-jup">0.0°</span></div>
  <div class="dr"><span class="lbl">SATURN</span><span class="val" id="i-sat">0.0°</span></div>
  <div class="retrograde-alert" id="retro-alert">⚠ EPICYCLIC RETROGRADE DETECTED</div>
</div>

<canvas id="dial-canvas"></canvas>

<div id="controls">
  <div class="mode-bar">
    <button class="mdbtn active" data-mode="front">◷ FRONT DIAL (ZODIAC)</button>
    <button class="mdbtn" data-mode="gears" onclick="alert('Internal gear view is running behind this dial. Focus on the output.')">⚙ INTERNAL GEARS</button>
  </div>
  <div class="crank-row">
    <button class="crank-btn" onclick="crank(-64)">−1 YEAR</button>
    <button class="crank-btn" onclick="crank(1)">+1 TOOTH</button>
    <button class="crank-btn" onclick="crank(64)">+1 YEAR</button>
    <button class="crank-btn" id="auto-btn" onclick="toggleAuto()">▶ AUTO-CRANK</button>
  </div>
</div>

<script>
'use strict';

// ── ENGINE STATE ──
const TEETH_PER_YEAR = 64; // b1
let tick = 0; // The master integer clock
let autoRunning = false;
let autoInterval = null;

const cv = document.getElementById('dial-canvas');
const ctx = cv.getContext('2d');
let W, H, CX, CY, RADIUS;

const ZODIAC_SIGNS = ['♈︎ Aries', '♉︎ Taurus', '♊︎ Gemini', '♋︎ Cancer', '♌︎ Leo', '♍︎ Virgo', '♎︎ Libra', '♏︎ Scorpio', '♐︎ Sagittarius', '♑︎ Capricorn', '♒︎ Aquarius', '♓︎ Pisces'];
const MONTHS_EGYPTIAN = ['Thoth','Phaophi','Athyr','Choiak','Tybi','Mechir','Phamenoth','Pharmuthi','Pachons','Payni','Epiphi','Mesore','Epagomenae'];

// ── HELLENISTIC EPICYCLIC PARAMETERS ──
// Ratios represent approximate gearing relative to the solar year (365.25 days)
// We use (Deferent Radius, Epicycle Radius, Sidereal Rate, Synodic Rate) to calculate geocentric longitude
// Rates are in degrees per year
const PLANETS = {
  sun:     { name: 'Sun',     color: 'var(--sun)',     R: 1.0, r: 0.0,   deferentRate: 360, epicycleRate: 0,   symbol: '☉', trackOffset: 0.70 },
  moon:    { name: 'Moon',    color: 'var(--moon)',    R: 1.0, r: 0.0,   deferentRate: 4812.5, epicycleRate: 0, symbol: '☽', trackOffset: 0.64 }, // roughly 13.368 revs/year
  mercury: { name: 'Mercury', color: 'var(--mercury)', R: 1.0, r: 0.38,  deferentRate: 360, epicycleRate: 1133,symbol: '☿', trackOffset: 0.58 }, // deferent = sun, epicycle = synodic
  venus:   { name: 'Venus',   color: 'var(--venus)',   R: 1.0, r: 0.72,  deferentRate: 360, epicycleRate: 225, symbol: '♀', trackOffset: 0.52 }, // deferent = sun, epicycle = synodic
  mars:    { name: 'Mars',    color: 'var(--mars)',    R: 1.5, r: 1.0,   deferentRate: 191, epicycleRate: 360, symbol: '♂', trackOffset: 0.46 }, // deferent = sidereal, epicycle = sun
  jupiter: { name: 'Jupiter', color: 'var(--jupiter)', R: 5.2, r: 1.0,   deferentRate: 30,  epicycleRate: 360, symbol: '♃', trackOffset: 0.40 }, // deferent = sidereal, epicycle = sun
  saturn:  { name: 'Saturn',  color: 'var(--saturn)',  R: 9.5, r: 1.0,   deferentRate: 12,  epicycleRate: 360, symbol: '♄', trackOffset: 0.34 }  // deferent = sidereal, epicycle = sun
};

// Store previous longitudes to detect retrograde motion
let prevLongitudes = {};
let isRetrograde = { mercury:false, venus:false, mars:false, jupiter:false, saturn:false };

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = W;
  cv.height = H;
  CX = W / 2;
  CY = H / 2;
  // Make radius fit nicely, accounting for UI
  RADIUS = Math.min(W, H) * 0.42; 
  if(W < 600) RADIUS = Math.min(W, H) * 0.48; // slightly larger on mobile
  drawDial();
}
window.addEventListener('resize', resize);

function crank(n) {
  tick += n;
  drawDial();
}

function toggleAuto() {
  autoRunning = !autoRunning;
  const btn = document.getElementById('auto-btn');
  if (autoRunning) {
    btn.textContent = '⏸ PAUSE';
    btn.classList.add('active');
    autoInterval = setInterval(() => { tick += 2; drawDial(); }, 30);
  } else {
    btn.textContent = '▶ AUTO-CRANK';
    btn.classList.remove('active');
    clearInterval(autoInterval);
  }
}

// ── KINEMATICS ──
function calculateEpicyclicLongitude(years, p) {
  // Angle of deferent (center of epicycle)
  const defAngle = (years * p.deferentRate) * (Math.PI / 180);
  // Angle of planet on epicycle
  const epiAngle = (years * p.epicycleRate) * (Math.PI / 180);

  // X/Y position of deferent center
  const cx = p.R * Math.cos(defAngle);
  const cy = p.R * Math.sin(defAngle);

  // X/Y position of planet relative to deferent
  const px = p.r * Math.cos(epiAngle);
  const py = p.r * Math.sin(epiAngle);

  // Total Geocentric Longitude
  const totalX = cx + px;
  const totalY = cy + py;

  let lon = Math.atan2(totalY, totalX) * (180 / Math.PI);
  return (lon + 360) % 360;
}

function updateState() {
  const years = tick / TEETH_PER_YEAR;
  let anyRetrograde = false;

  const currentLons = {};

  Object.keys(PLANETS).forEach(key => {
    const p = PLANETS[key];
    const lon = calculateEpicyclicLongitude(years, p);
    currentLons[key] = lon;

    // Detect Retrograde (if longitude is decreasing)
    if (prevLongitudes[key] !== undefined && key !== 'sun' && key !== 'moon') {
      let diff = lon - prevLongitudes[key];
      // Handle 360 wrap-around
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      
      isRetrograde[key] = (diff < -0.01);
      if (isRetrograde[key]) anyRetrograde = true;
    }
    
    // Update HUD Text
    const el = document.getElementById(`i-${key.substring(0,3)}`);
    if(el) {
        el.textContent = `${lon.toFixed(1)}°`;
        if(isRetrograde[key]) el.style.color = 'var(--red)';
        else el.style.color = 'var(--br-lt)';
    }
  });

  document.getElementById('i-epoch').textContent = String(tick).padStart(6, '0');
  
  const alertEl = document.getElementById('retro-alert');
  if (anyRetrograde) alertEl.classList.add('show');
  else alertEl.classList.remove('show');

  prevLongitudes = currentLons;
  return currentLons;
}

// ── RENDERING ──
function drawRing(r, width, color) {
  ctx.beginPath();
  ctx.arc(CX, CY, r, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

function drawTicks(r, count, tickLength, color, weight=1) {
  ctx.save();
  ctx.translate(CX, CY);
  ctx.strokeStyle = color;
  ctx.lineWidth = weight;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
    ctx.lineTo(Math.cos(angle) * (r + tickLength), Math.sin(angle) * (r + tickLength));
    ctx.stroke();
  }
  ctx.restore();
}

function drawZodiacRing(rOuter, rInner) {
  // Background fill
  ctx.beginPath();
  ctx.arc(CX, CY, rOuter, 0, Math.PI * 2);
  ctx.arc(CX, CY, rInner, 0, Math.PI * 2, true);
  ctx.fillStyle = 'rgba(166, 112, 65, 0.1)';
  ctx.fill();

  drawRing(rOuter, 2, 'var(--bronze)');
  drawRing(rInner, 2, 'var(--bronze)');
  drawTicks(rInner, 360, (rOuter-rInner)*0.2, 'rgba(166,112,65,0.4)', 1); // degree ticks
  drawTicks(rInner, 12, rOuter-rInner, 'var(--bronze)', 2); // sign separators

  // Zodiac Text
  ctx.save();
  ctx.translate(CX, CY);
  ctx.fillStyle = 'var(--gold)';
  ctx.font = `bold ${Math.max(10, RADIUS*0.045)}px 'Cinzel', serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  const textRadius = rInner + (rOuter - rInner) / 2;
  for (let i = 0; i < 12; i++) {
    // Offset by 15 degrees so text is centered in the 30-degree segment
    const angle = (i * 30 + 15) * (Math.PI / 180);
    ctx.save();
    ctx.rotate(angle + Math.PI/2); // Rotate text so bottom faces center
    // Adjust y-position because we rotated the context
    ctx.fillText(ZODIAC_SIGNS[i], 0, -textRadius);
    ctx.restore();
  }
  ctx.restore();
}

function drawCalendarRing(rOuter, rInner, rotationOffsetDeg) {
  ctx.beginPath();
  ctx.arc(CX, CY, rOuter, 0, Math.PI * 2);
  ctx.arc(CX, CY, rInner, 0, Math.PI * 2, true);
  ctx.fillStyle = 'rgba(67, 143, 126, 0.1)';
  ctx.fill();

  drawRing(rInner, 1, 'var(--patina)');
  
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(rotationOffsetDeg * (Math.PI / 180));
  
  // 365 day ticks
  for (let i = 0; i < 365; i++) {
    const angle = (i / 365) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * rInner, Math.sin(angle) * rInner);
    ctx.lineTo(Math.cos(angle) * (rInner + 4), Math.sin(angle) * (rInner + 4));
    ctx.strokeStyle = 'rgba(67, 143, 126, 0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  
  // Month separators (12 months of 30 days, 1 of 5 days)
  ctx.fillStyle = 'var(--patina)';
  ctx.font = `${Math.max(8, RADIUS*0.035)}px 'Cinzel', serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const textR = rInner + (rOuter - rInner) / 2;

  let currentDay = 0;
  for (let i = 0; i < 13; i++) {
    const daysInMonth = (i === 12) ? 5 : 30;
    const midDay = currentDay + daysInMonth / 2;
    const angle = (midDay / 365) * Math.PI * 2;
    
    // Draw separator line
    const sepAngle = (currentDay / 365) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(sepAngle) * rInner, Math.sin(sepAngle) * rInner);
    ctx.lineTo(Math.cos(sepAngle) * rOuter, Math.sin(sepAngle) * rOuter);
    ctx.strokeStyle = 'var(--patina)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Draw Month Text
    ctx.save();
    ctx.rotate(angle + Math.PI/2);
    ctx.fillText(MONTHS_EGYPTIAN[i], 0, -textR);
    ctx.restore();
    
    currentDay += daysInMonth;
  }
  ctx.restore();
}

function drawPointer(angleDeg, radius, color, isRetrograde, label, trackR, isMoon) {
  const angle = angleDeg * (Math.PI / 180);
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(angle);

  // The bronze pointer arm
  ctx.beginPath();
  ctx.moveTo(-3, 0);
  ctx.lineTo(0, -3);
  ctx.lineTo(radius, 0);
  ctx.lineTo(0, 3);
  ctx.fillStyle = isRetrograde ? 'rgba(192, 57, 43, 0.3)' : 'rgba(166, 112, 65, 0.3)';
  ctx.fill();
  
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(radius, 0);
  ctx.strokeStyle = isRetrograde ? 'var(--red)' : 'var(--bronze)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // The concentric track line
  ctx.beginPath();
  ctx.arc(0, 0, trackR, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(166, 112, 65, 0.15)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // The Planet "Gemstone" marker
  const glow = isRetrograde ? 'var(--red)' : color;
  ctx.shadowBlur = 10;
  ctx.shadowColor = glow;
  
  if (isMoon) {
    // Special Moon Phase indicator
    const sunLon = PLANETS.sun.lon || 0;
    const phaseAngle = (angleDeg - sunLon) * (Math.PI/180);
    
    ctx.translate(trackR, 0);
    // Dark half
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI*2);
    ctx.fillStyle = '#111';
    ctx.fill();
    
    // Light half (rotated to show phase)
    ctx.save();
    ctx.rotate(phaseAngle);
    ctx.beginPath();
    ctx.arc(0, 0, 8, -Math.PI/2, Math.PI/2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
    
    // Silver rim
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI*2);
    ctx.strokeStyle = 'var(--gold)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

  } else {
    // Standard Planet Gem
    ctx.beginPath();
    ctx.arc(trackR, 0, 5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'var(--gold)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  
  ctx.shadowBlur = 0;

  // Label
  ctx.save();
  ctx.translate(trackR + 12, 0);
  ctx.rotate(-angle); // Keep text upright
  ctx.fillStyle = color;
  ctx.font = `bold 12px 'Share Tech Mono'`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, 0, 0);
  ctx.restore();

  ctx.restore();
}

function drawDial() {
  const lons = updateState();
  // Store sun lon for moon phase calc
  PLANETS.sun.lon = lons.sun; 

  ctx.clearRect(0, 0, W, H);

  // Background Dial Plate
  ctx.beginPath();
  ctx.arc(CX, CY, RADIUS * 1.05, 0, Math.PI*2);
  ctx.fillStyle = '#0a0806';
  ctx.fill();
  ctx.strokeStyle = 'var(--br-dk)';
  ctx.lineWidth = 5;
  ctx.stroke();

  // 1. Outer Ring: Egyptian Calendar (rotates slightly over 4 years, but we'll lock it for visual clarity or shift it based on tick)
  // Historically the calendar ring could be manually shifted 1 day every 4 years.
  const calendarShift = (tick / TEETH_PER_YEAR / 4) * (360/365); 
  drawCalendarRing(RADIUS, RADIUS * 0.90, -calendarShift);

  // 2. Inner Ring: Zodiac
  drawZodiacRing(RADIUS * 0.90, RADIUS * 0.78);

  // 3. Central Earth Hub
  ctx.beginPath();
  ctx.arc(CX, CY, RADIUS * 0.08, 0, Math.PI*2);
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, RADIUS*0.08);
  grad.addColorStop(0, '#2a3b4c'); // Earthy blue
  grad.addColorStop(1, '#050403');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = 'var(--gold)';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  ctx.fillStyle = 'var(--gold)';
  ctx.font = `10px 'Cinzel'`;
  ctx.textAlign = 'center';
  ctx.fillText('⊕', CX, CY + 4);

  // 4. Planetary Pointers & Tracks (Rendered from outside in)
  const zRadius = RADIUS * 0.78; // Pointer tip reaches the Zodiac

  // Order of spheres: Saturn, Jupiter, Mars, Sun, Venus, Mercury, Moon
  const order = ['saturn', 'jupiter', 'mars', 'sun', 'venus', 'mercury', 'moon'];
  
  order.forEach(key => {
    const p = PLANETS[key];
    const lon = lons[key];
    const trackRadius = RADIUS * p.trackOffset;
    drawPointer(lon, zRadius, p.color, isRetrograde[key], p.symbol, trackRadius, key === 'moon');
  });
  
  // Central nesting tubes visual (just a stack of small circles at the center)
  for(let i=0; i<7; i++) {
      ctx.beginPath();
      ctx.arc(CX, CY, (7-i) * 3 + 12, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(166, 112, 65, 0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();
  }
}

// ── BOOT ──
window.addEventListener('load', () => {
  resize();
  // Start with a slight offset to make it look active
  tick = TEETH_PER_YEAR * 2.3; 
  drawDial();
});

</script>
</body>
</html>
