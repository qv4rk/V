<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAMP FPV: Advanced Telemetry</title>
<style>
    body { margin: 0; overflow: hidden; background: #050505; font-family: monospace; color: #fff; cursor: crosshair; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { 
        position: absolute; top: 15px; left: 15px; 
        background: rgba(10, 10, 10, 0.8); padding: 15px; 
        border-left: 3px solid #ffaa00; pointer-events: none; 
        z-index: 10; text-transform: uppercase; letter-spacing: 1px;
    }
    .val { color: #ffaa00; font-weight: bold; }
    #crosshair {
        position: absolute; top: 50%; left: 50%;
        width: 30px; height: 30px; transform: translate(-50%, -50%);
        border: 1px solid rgba(255,170,0,0.4); border-radius: 50%;
        pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
        content: ''; position: absolute; background: #ffaa00;
    }
    #crosshair::before { top: 14px; left: -5px; width: 40px; height: 2px; }
    #crosshair::after { top: -5px; left: 14px; width: 2px; height: 40px; }
</style>
</head>
<body>
    <div id="hud">
        VAMP FLIGHT TELEMETRY [HIGH FIDELITY]<br><br>
        ALTITUDE : <span id="alt" class="val">55.00</span> KM<br>
        AIRSPEED : <span id="spd" class="val">MACH 0.15</span><br>
        TARGET   : <span id="tgt" class="val">SEARCHING...</span><br>
        H2SO4 DEN: <span class="val">CRITICAL</span><br>
        [MOUSE POSITION = FLIGHT YOKE]
    </div>
    <div id="crosshair"></div>
    </body>
</html>
