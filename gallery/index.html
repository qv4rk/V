<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generative Art Gallery — FeistTech</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#080c15;color:#edf4ff}*{box-sizing:border-box}body{margin:0}header{padding:1rem clamp(1rem,4vw,3rem);border-bottom:1px solid #344155;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}h1{font-size:1.4rem;margin:0;letter-spacing:.04em}a{color:#7ee4ec}button,.button,select,input{font:inherit}button,.button,select{background:#192638;border:1px solid #61758b;border-radius:.55rem;color:inherit;padding:.55rem .8rem;cursor:pointer}button:hover,.button:hover{background:#29435d}.button input{display:none}main{padding:1.2rem clamp(1rem,4vw,3rem)}.tools{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin:1rem 0}.tools input[type=search]{background:#111b2a;color:inherit;border:1px solid #61758b;border-radius:.5rem;padding:.65rem;min-width:min(100%,260px)}.note{color:#aebccc;max-width:70ch}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem}.card{background:#121c2c;border:1px solid #35465a;border-radius:.7rem;overflow:hidden;cursor:pointer;color:inherit;text-align:left;padding:0}.card:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #64e8fb;outline-offset:2px}.thumb{height:175px;display:grid;place-items:center;background-color:#ddd;background-image:linear-gradient(45deg,#aaa 25%,transparent 25%),linear-gradient(-45deg,#aaa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aaa 75%),linear-gradient(-45deg,transparent 75%,#aaa 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0}.thumb img{max-width:100%;max-height:100%;object-fit:contain}.card span{display:block;padding:.65rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}dialog{border:0;background:#080c15;color:inherit;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0}dialog::backdrop{background:#080c15}.viewer{height:100%;display:flex;flex-direction:column}.viewerbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.6rem 1rem;border-bottom:1px solid #344155}.viewerbar strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:100px}.stage{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;background:#161b23}.stage.checker{background-color:#ddd;background-image:linear-gradient(45deg,#aaa 25%,transparent 25%),linear-gradient(-45deg,#aaa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aaa 75%),linear-gradient(-45deg,transparent 75%,#aaa 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.stage.white{background:#fff}.stage img{max-width:100%;max-height:100%;object-fit:contain}.stage.zoom img{max-width:none;max-height:none}.caption{padding:.35rem 1rem;color:#aebccc;font-size:.8rem}
</style>
</head>
<body><header><a href="/">← FeistTech</a><h1>Generative Art Gallery</h1></header>
<main><p class="note">Browse the public collection or open a folder from your device. Local files stay on your device; choosing a folder does not upload it. PNG alpha remains intact.</p>
<div class="tools"><label class="button">Open local folder<input id="folder" type="file" accept="image/*" webkitdirectory multiple></label><label class="button">Choose images<input id="files" type="file" accept="image/*" multiple></label><button id="public">Public collection</button><input id="search" type="search" placeholder="Filter by filename" aria-label="Filter images"><select id="sort" aria-label="Sort order"><option value="name">Name</option><option value="reverse">Reverse name</option><option value="original">Original order</option></select><span id="count" role="status"></span></div>
<div id="grid" class="grid"></div></main>
<dialog id="dialog"><div class="viewer"><div class="viewerbar"><button id="close" aria-label="Close">× Close</button><button id="prev" aria-label="Previous image">←</button><strong id="title"></strong><span id="position"></span><button id="next" aria-label="Next image">→</button><button id="background">Background: checker</button><button id="zoom">Fit</button><a id="original" download>Original</a></div><div id="stage" class="stage checker"><img id="large" alt=""></div><div class="caption">Arrow keys to page · Escape to close · Tap image to zoom</div></div></dialog>
<script>
const $=id=>document.getElementById(id);let items=[],shown=[],active=0,urls=[],bg=0;
function release(){for(const u of urls)URL.revokeObjectURL(u);urls=[]}
function label(s){return s.replace(/^.*\//,'')}
function render(){const q=$('search').value.toLowerCase();shown=items.filter(x=>x.name.toLowerCase().includes(q));if($('sort').value==='name')shown.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if($('sort').value==='reverse')shown.sort((a,b)=>b.name.localeCompare(a.name,undefined,{numeric:true}));$('count').textContent=`${shown.length} images`;const grid=$('grid');grid.replaceChildren();const frag=document.createDocumentFragment();shown.forEach((it,i)=>{const b=document.createElement('button');b.className='card';b.type='button';const box=document.createElement('div');box.className='thumb';const img=document.createElement('img');img.src=it.thumb||it.url;img.alt='';img.loading='lazy';img.decoding='async';box.append(img);const title=document.createElement('span');title.textContent=it.name;b.append(box,title);b.onclick=()=>open(i);frag.append(b)});grid.append(frag)}
function open(i){if(!shown.length)return;active=(i+shown.length)%shown.length;const it=shown[active];$('large').src=it.url;$('large').alt=it.name;$('title').textContent=it.name;$('position').textContent=`${active+1} / ${shown.length}`;$('original').href=it.url;$('original').download=label(it.name);if(!$('dialog').open)$('dialog').showModal()}
function useFiles(list){release();items=[...list].filter(f=>f.type.startsWith('image/')||/\.(png|jpe?g|webp|gif|avif)$/i.test(f.name)).map(f=>{const url=URL.createObjectURL(f);urls.push(url);return{name:f.webkitRelativePath||f.name,url}});$('search').value='';render()}
async function publicCollection(){release();try{const response=await fetch('./gallery.json',{cache:'no-cache'});if(!response.ok)throw Error('No collection yet');const data=await response.json();items=data.map(x=>({name:x.name,url:x.url,thumb:x.thumb}));$('search').value='';render()}catch{items=[];render();$('count').textContent='No public images yet — choose a folder to browse locally.'}}
$('folder').onchange=e=>useFiles(e.target.files);$('files').onchange=e=>useFiles(e.target.files);$('public').onclick=publicCollection;$('search').oninput=render;$('sort').onchange=render;$('close').onclick=()=>$('dialog').close();$('prev').onclick=()=>open(active-1);$('next').onclick=()=>open(active+1);$('background').onclick=()=>{bg=(bg+1)%3;$('stage').className='stage '+['checker','white',''][bg]+($('stage').classList.contains('zoom')?' zoom':'');$('background').textContent='Background: '+['checker','white','dark'][bg]};$('zoom').onclick=()=>{$('stage').classList.toggle('zoom');$('zoom').textContent=$('stage').classList.contains('zoom')?'Actual size':'Fit'};$('large').onclick=()=>$('zoom').click();document.addEventListener('keydown',e=>{if(!$('dialog').open)return;if(e.key==='ArrowRight')open(active+1);if(e.key==='ArrowLeft')open(active-1)});window.addEventListener('beforeunload',release);publicCollection();
</script></body></html>
